description = "Brualdi-Goldwasser campaign, restructured 2026-09-24 into two targets. (1) GOAL BG_backbone_conjecture: the Brualdi-Goldwasser problem (1984) asks for the maximum of the Laplacian ratio per(L(T))/prod deg over n-vertex trees; it is open (Pant 2026, arXiv 2605.14176, refuted the Wu-Dong-Lai answer). Campaign conjecture 1, pinned: the per-size maximum is attained on a multi-hub cherry-backbone. Kernel-reduced (R47BGConjecture.bgBackbone_of_straightProgress) to the single open obligation BG_straight_progress. The earlier free-tie capstone (conjecture1_of_HnormMulti*) carried no content and is superseded by the pinned statement. (2) MILESTONE BG_rate_sharp: Phi^11 <= 1 for every rooted tree in the literal planted matching-sum model (BGSCL), equality exactly at the 5-arm spider rooted at its hub; the <= half is kernel-proved (bg_ceiling, node BG_rate_ceiling), the equality half is open (BG_tie_root_degree proves bell = 0 forces a degree-6 root). The older DEC-model nodes (phi_le_one etc.) remain as proved history. CI: proof-lean on main green again 2026-09-24 (scheduled run, staged build + cache); the axiom guard checks the exact three-axiom set and requires every BG node anchor (the 2026-09-23 caveat is resolved). New 2026-09-24 nodes are DRAFT pending an INDEPENDENT read-back and grant. conjecture1_proved = False."
