description = "Migration of PROGRAM ANDURIL (telperion/docs/PROGRAM_ANDURIL_2026-09-12.md, ROADMAP_ANDURIL_MIRRORMERE_2026-09-14.md) into the missions registry: the kernel-certified Turing ladder (every nontrivial zeta zero to height T verified on the critical line, T -> 10^13) plus the verified-evaluator reflection track (A2 Euler-Maclaurin era, A4 checkBand, A3 Riemann-Siegel to come). The registry is the tracking truth. NOTHING here is a proof of RH and conjecture1_proved = False throughout: the ladder is finite verification; the goal node is the 10^13 finite-verification target, itself draft. FIDELITY NOTE (design section 9): all artifacts live on the rh/million-turing line, which is NOT merged into main; therefore no node enters as proved -- nodes with kernel-checked artifacts on that line enter as open with the artifact linked, and `mission grant` is deferred until the branch reconcile lands the artifacts on this line. Environment = the zeta islands' shared pin (v4.32.0); artifacts verify in their home islands (zeta_zero_localization, zeta_reflection) per design section 2. [2026-09-23] Update: six nodes are PROVED (granted 2026-09-18 after the million-turing reconcile); the earlier sentence that no node enters as proved is historical. Their island has no working CI (see CLOSURE_RUN_2026-09-22.md)."
