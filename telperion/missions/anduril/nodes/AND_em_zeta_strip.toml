text = "For every complex s with positive real part and s /= 1, the Riemann zeta function equals 1/(s-1) + 1/2 plus the integral over x > 1 of the first sawtooth-Bernoulli function of x times -s x^(-s-1) -- the K=1 Euler-Maclaurin closed form, valid on the whole slit right half-plane and hence across the entire critical strip. Proved by the identity theorem from the classical region Re s > 1, anchored at s = 2. This is the load-bearing analytic gap of the A2 verified-evaluator track, closed. [Verbatim extract of the proved em_zeta_strip theorem; artifact on rh/million-turing, grant deferred to the branch reconcile.]"
