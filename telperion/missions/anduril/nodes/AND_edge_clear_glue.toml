text = "Read-back, written before I opened the artifact: for any reals T0 and T1, and every y in the closed unordered interval Set.uIcc T0 T1, riemannZeta(-1 + iy) is not zero. Because T0 = T1 = y is allowed, this says zeta has no zero anywhere on the line Re s = -1. The statement has no hypotheses. It is true: zeros off the real axis have 0 < Re s < 1, the trivial zeros are at -2, -4, ..., and zeta(-1) = -1/12.\n\nStatement gate, on the canonical path (load_campaign then _normalized_statement): statement_matches returned True. My own whitespace-collapsed comparison is also identical. artifact_incompleteness_markers returned [] for EdgeClearGlue, ZetaZeroConfinement, TuringBand and RHInBoxAnalytic. The artifact's theorem is EdgeClearGlue.hnzl_discharged, and the file has `open Complex`, as the statement file does.\n\nBuild: leanlock lake build EdgeClearGlue completed successfully (8735 jobs, exit 0). The only warnings came from the unused-simp-argument linter.\n\nAxioms: my probe (now deleted) printed [propext, Classical.choice, Quot.sound] for hnzl_discharged, riemannZeta_neg_one and zeta_zero_re_mem_strip. #check shows the binders are only T0, T1, y and the membership proof. The probe also re-elaborated the registry text against the proof and instantiated it at T0 = T1 = y for every y and at y = 0; all of it compiled.\n\nHidden hypotheses: none. The proof is `fun y _ => ...`, so the interval membership goes unused. The strip theorem takes only im ≠ 0 and ζ ρ = 0. Searching the closure for axiom, opaque, native_decide, ofReduceBool, extern and sorry in code found nothing; the only matches were docstring prose.\n\nMath: for y = 0 the proof goes through the Bernoulli formula (bernoulli 2 = 1/6), and mpmath gives zeta(-1) = -1/12. For y ≠ 0, Re s = -1 ≤ 0 with Im s ≠ 0 is excluded by the strip theorem. As an untrusted sanity check, the smallest value of |zeta(-1+iy)| over y in [-100, 100] (step 0.05) is 1/12, at y = 0.\n\nWhat this establishes: the H2b (hnzl) conjunct