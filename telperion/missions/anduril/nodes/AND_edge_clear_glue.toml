(-1) = -1/12, which mpmath confirms.\n- y != 0: Re s = -1 is outside 0 < Re < 1, and the trivial zeros -2, -4, ... are real. The functional equation gives the same result, since zeta(2 - iy) != 0 and sin(pi*s/2) never vanishes.\n- mpmath spot checks from y = 0 to 279999.5 give |zeta(-1+iy)| between 0.083 and 1.3e7.\n\nScope: this removes the hnzl Arb input from the bands, as glue for a finite verification up to a fixed height. It says nothing about critical-strip zeros or RH, and it does not discharge hnzb, hnzt or hins (those still need the SlabClear facts). conjecture1_proved = False.\n\nTestimony: docs/AUDIT_TESTIMONY_AND_edge_clear_glue_2026-09-23_A1.md, _A2.md (both pass, axioms_clean, statement_byte_identical)."
