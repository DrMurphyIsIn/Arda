text = "The statement says there is a list of two strictly increasing reals in [14, 22] at which Mathlib's completedRiemannZeta (pi^(-s/2) Gamma(s/2) zeta(s)) vanishes at s = 1/2 + i t. In other words, at least two distinct zeros of the completed zeta function on the critical line have ordinates in [14, 22]. The theorem has no binders or hypotheses, so the claim is unconditional. This is finite verification only, not RH. conjecture1_proved = False.\n\nIndependent second read-back (A2): There is a list of exactly two real numbers, strictly increasing, each in the closed interval [14, 22]. At each of them, Mathlib's completedRiemannZeta (Lambda(s) = pi^(-s/2) Gamma(s/2) zeta(s)) vanishes at s = 1/2 + i t. So Lambda has at least two distinct zeros on the critical line with ordinates in [14, 22]. The statement has no hypotheses and makes no claim about multiplicity, zeros off the line, or other heights. The artifact theorem ReflectedBand_t14_Kernel.pilot_kernel matches this text exactly once whitespace is collapsed. A probe that restated it with no opens (so it refers to root Mathlib completedRiemannZeta) accepted it as proof. It builds (8696 jobs, exit 0), and its axioms are [propext, Classical.choice, Quot.sound]. It has no binders. The three wide dyadic boxes at t = 14, 15, 22 were checked independently with mpmath: gLine = -2.0514e-6, +6.2659e-6 and -3.1869e-8. Each value lies in its box, and each box excludes 0. The zeros found are 14.1347251417 and 21.0220396388, and nzeros(22) - nzeros(14) = 2. This is a finite verification only, not RH. conjecture1_proved = False.\n\nTestimony: docs/AUDIT_TESTIMONY_AND_g2_reflected_band_kernel_2026-09-23_A1.md, _A2.md (both pass, axioms_clean, statement_byte_identical)."
