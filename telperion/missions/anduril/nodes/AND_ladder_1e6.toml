text = "For every complex rho, if riemannZeta rho = 0 and 0 < Im rho <= 1000000, then Re rho = 1/2 -- exactly the Riemann Hypothesis restricted to zeros with imaginary part in (0, 10^6]. The hypotheses do not pre-restrict rho to the critical strip; the statement is a genuine finite-height RH restriction, correctly stated, unproven (sorry). No flags."
