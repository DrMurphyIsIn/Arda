text = "Read-back, written before opening the artifact: for every real H and every complex rho with riemannZeta rho = 0, 0 < Im rho and Im rho <= H, we get 55/16 <= |Im rho|. H plays no role, and the claim covers all of C, not just the strip. It is true, since the first zero is at Im 14.1347.\n\nGate: the canonical path statement_matches(HeightFloor.lean, _normalized_statement(node)) returned True. My own whitespace-normalized extraction of both texts gives identical strings, and a Lean probe restating the registry text verbatim typechecks against HeightFloor.height_floor. artifact_incompleteness_markers returned [] on all 12 closure modules I checked, including HeightFloor*, the EMZeta* files, ZetaEMSum, ZetaZeroConfinement and the Dlvp* modules.\n\nBuild: lake build HeightFloor succeeded (8732 jobs, exit 0, no `sorry` warnings). #print axioms for height_floor, the probe and strip_clear_low each give [propext, Classical.choice, Quot.sound]. There are no hmem/hArb/hLine/oracle binders, and no native_decide, ofReduceBool, axiom, opaque or implemented_by anywhere in the closure. The single premise of no_low_zeros_of_strip_clear is supplied by the proved strip_clear_low.\n\nCoverage: Re >= 1 and Re <= 0 are handled by zeta_zero_re_mem_strip (Mathlib's riemannZeta_ne_zero_of_one_le_re plus the 1 - rho reflection). 0 < Re < 1/2 is folded onto the right half by rho -> 1 - conj rho, which keeps Im. On [1/2, 1) x (0, 55/16], the EM bound ||G2|| <= 23/100 contradicts the box result ||G2|| > 1/4 on the closed rectangle [1/2,1] x [0,55/16]. The 32 closed boxes (2 sigma slabs by 16 t slabs) are contiguous from 0 to 55/16, as I checked by script. The le_total dispatch leaves no boundary gaps, and each box is checked with kernel decide.\n\nmpmath: first zero 0.5 + 14.13472514i. min |(s-1) zeta(s)| on a 121x121 grid is 0.7302 at (1/2, 0), and min |G2| is 0.7301. The largest EM tail bound is 0.189, under 23/100.\n\nScope: this is a finite, low-height zero-free result that discharges the ladder's hgamma input. It is not RH. conjecture1_proved = False.\n\nI deleted my probe (AuditProbe_..._A1); the other auditors' probes were left alone.\n\nIndependent second read-back (A2): The statement (written down before reading the artifact) says: for every real H and every complex ρ anywhere in ℂ, if Mathlib's riemannZeta ρ = 0 and 0 < Im ρ ≤ H, then Im ρ ≥ 55/16. H does not affect the conclusion, so this says Mathlib's zeta has no zero with 0 < Im < 55/16. Trivial zeros are real, so they are excluded.\n\nGate: I ran the check on the canonical path (load_campaign, then _normalized_statement, then statement_matches) and it returned True. A whitespace-collapsed comparison of the declaration heads also matches. The artifact names the theorem HeightFloor.height_floor. A probe restated the registry statement in the root namespace with no `open` and closed it with HeightFloor.height_floor H, so the elaborated types coincide.\n\nMarkers: artifact_incompleteness_markers found nothing in all 75 local modules of the import closure. Grepping the closure with comments stripped found no axiom, opaque, unsafe, native_decide, ofReduceBool, implemented_by, extern, admit or sorryAx, and no `sorry`. The only hγ binder is in zero_in_band, which is not on the proof path.\n\nBuild and axioms: `lake build HeightFloor` succeeded (8732 jobs; only deprecation warnings). `#print axioms` gives [propext, Classical.choice, Quot.sound] for height_floor, the restatement, strip_clear_low, G2_norm_gt and G2_norm_le_of_zero. The probe file has been deleted.\n\nCoverage:\n- Re ≥ 1 is excluded by Mathlib's riemannZeta_ne_zero_of_one_le_re.\n- Re ≤ 0 is sent to Re ≥ 1 by the functional-equation reflection 1−ρ, which is valid because Im ≠ 0.\n- 0 < Re < 1/2 is folded onto the right half by ρ ↦ 1−conj ρ, which keeps Im.\n- On [1/2,1)×(0,55/16], Euler-Maclaurin order 3 at N=2 shows a zero would force ‖G2‖ ≤ 0.23 (tail constant 0.2277). The boxes show ‖G2‖ > 1/4.\n- There are 32 closed boxes: 2 σ-slabs times 16 t-slabs of width 55/256. The cover is proved in Lean with le_total splits, so there is no gap at box edges, t=0 or t=55/16.\n\nmpmath: the first zero is 0.5+14.1347i. min|(s−1)ζ| on the right rectangle is 0.7302 and min|G2| is 0.7301. max|G2−(s−1)ζ| is 0.0227.\n\nThis establishes a hypothesis-free, kernel-checked finite height floor (no zero with 0 < |Im| < 55/16). It does not establish RH. conjecture1_proved = False.\n\nTestimony: docs/AUDIT_TESTIMONY_AND_height_floor_kernel_2026-09-23_A1.md, _A2.md (both pass, axioms_clean, statement_byte_identical)."
