description = "Migration of PROGRAM MIRRORMERE (telperion/docs/QC_PROGRAM.md, ROADMAP_ANDURIL_MIRRORMERE_2026-09-14.md) into the missions registry: the reverse-Dyson program -- classify 1-D Fourier quasicrystals, locate the zeta point set, extract zero-localization -- built as finite, unconditional instruments (axioms + falsification zoo, the rigidity ladder R1/R2/R3, the defect-k instrument, the N(T) brick). NOTHING here proves or claims RH and conjecture1_proved = False throughout; the goal node is the program's honest RH-hard membership target and is draft. The known difficulty map: RH-hardness enters at exactly one place, twice disguised (FQ-grade temperedness of the dual comb; the rational -> irrational frequency transition); everything registered below is unconditional or carries its named hypothesis explicitly. FIDELITY NOTE (design section 9): all artifacts live on the rh/million-turing line, NOT merged into main; no node enters as proved -- kernel-checked artifacts are linked on open nodes and `mission grant` is deferred to the branch reconcile. Environment = v4.32.0 (quasicrystal island); two nodes' artifacts live on the zeta_zero_localization island (same pin, cross-island grant per design section 2). W3b IS REGISTERED (MM_bragg_bridge, 2026-09-15): the gw-finite agent proved rect_explicit_formula_bragg on the v4.34 li island -- cross-island node per design section 2. Statement-authoring queue (nodes NOT yet registered because their authoritative formal statements ARE the work; specs in RH_ROUTES_ROADMAP_2026-09-16 section 9): the T->inf corridor bound |zeta'/zeta| = O(log^2 T) (effective-constant form must be pinned against its four consumers -- W3b limit, B6, D6, A3), the A0 REGULARIZED membership statement (the naive clause list '|mu-hat| tempered for the (log p)p^{-m/2} dual comb' is UNCONDITIONALLY FALSE -- sum_{n<=e^R} Lambda(n) n^{-1/2} ~ 2 e^{R/2} by PNT, and mu-hat carries an absolutely-continuous archimedean component; only the Guinand-Weil-regularized triple can carry membership, and authoring it is open formulation work), the W_temp precise wall statement (QC_LITERATURE section 1.7 grades it a program conjecture), R1 crystalline rigidity with the isolated temperedness clause, W3c infinite-torus log-density FQ axioms, A3-adjacent W4 face probes, the torus-section ladder's T3 defect-instrumentation rungs, MM_leakage_composite_zero (the content is the log-derivative coefficient functional; the Lambda-support direction is rfl-bait), and MM_ks_forward_smallN (the island's FQ vocabulary is deliberately abstract; a concrete faithful statement is W3c formulation work). W3c GOAL AUTHORED (2026-09-18): the placeholder goal statement (Mathlib RiemannHypothesis via zeta_FQ_iff_RH) is replaced, through the registry writer, by the concrete membership target in the program's own diffraction vocabulary -- defect-0 membership of the Guinand-Weil REGULARIZED TRIPLE, written as Weil positivity of the primes-side functional weilForm on Hermitian autocorrelations autocorr g over the E8 test class IsWeilTest (roadmap A5 = D11 wall form; QC_TORUS_MEMO 2.2 support-reality clause), authorable because RvMBridge4.limit_explicit_formula makes the triple concrete. It is RH-EQUIVALENT (Weil 1952; Bombieri 2000 states the criterion on exactly C_c^infinity), so the node stays kind=goal / status=draft permanently, is never attempted and is never decomposed. The Selberg-class / B-mult-twisted GROWTH-CARRIER form of the same membership clause (arithmetic FQ <-> Selberg element) remains PROSE ONLY and is NOT registered: it is substrate-blocked (ARITHMETIC_FQ_MEMBERSHIP_SPEC section 4 -- Mathlib has no Fourier transform of measures, no almost-periodicity predicate, no prod_p S^1 restriction), and an opaque placeholder def would fail that spec's own vacuity check by construction. Design memo: telperion/docs/MM_w3c_goal_weil_membership_DESIGN_2026-09-18.md."
