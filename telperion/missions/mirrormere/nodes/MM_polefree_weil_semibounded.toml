text = "Mathlib's RiemannHypothesis is equivalent to: there exists a real constant C (of either sign) such that for every complex-valued g on R that is smooth with compact support (IsWeilTest) and pole-free (paperFT g (I/2) = 0 and paperFT g (-I/2) = 0, the same two conditions as MM_polefree_weil_converse), the real part of the Weil functional weilForm (archSide minus primeSide) evaluated at the Hermitian autocorrelation autocorr g is at least -C times the L2 norm squared, integral of |g x|^2. This is a soft (semibounded) form of Weil's criterion: C = 0 recovers positivity. RH-equivalent, not progress on RH."
