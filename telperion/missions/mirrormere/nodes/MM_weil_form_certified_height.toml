title = "Routes-roadmap D3 REFORMULATED (not band-limited): the reach of the certified zero ladder into Weil positivity, per test function.  In g-coordinates on the E8 class (so off-line values of H_g are literal and the Paley-Wiener obstruction that refuted the band-limited D3 does not arise): for every smooth compactly supported g whose autocorrelation f = g * g~ is again a test function, there is a constant C = C(g) >= 0 such that for every height T >= 2 the zero side truncated at T is summable with a value P satisfying (unconditionally) ||W(f) - P|| <= C log T / T^3, and GIVEN the ladder hypothesis at height T (every zero with ordinate in (0, T] lies on the critical line) also 0 <= Re P and -(C log T / T) <= Re W(f).  W(f) = archSide f - primeSide f is the ARITHMETIC-side Weil functional (the finite von Mangoldt sum together with the archimedean digamma term of archSide; no zero of zeta enters its definition); the tail bound comes from RH_rvm_unconditional plus the two-integrations-by-parts decay |H_f| <= C_g^2/|rho-1/2|^4, the positivity from the on-line square channel H_f(rho) = ||H_g(rho)||^2.  Escape-proof shape: the summability and tail conjuncts are OUTSIDE the ladder implication, so the classical case split on RH that closes the headline-only version (kernel-certified negative control headline_alone_is_trivial) cannot close this one.  Measures compatibility with the ladder; says nothing about an off-line zero entering beyond any fixed height"
updated = "2026-09-18"
