text = "Formal statement, read in the author's own session (so this read-back is NOT independent; the Comparator judge is the independent check that the artifact proves exactly this type). For every g : R -> C that is C-infinity with compact support (IsWeilTest), and every real L with 2L <= log 2 and tsupport g inside [-L, L], the real part of weilForm(autocorr g) is >= 0. weilForm f = archSide f - primeSide f with archSide = H_f(0) + H_f(1) - f(0) log pi + (1/2pi) int h_f(r) Re psi(1/4 + ir/2) dr (both pole terms kept) and primeSide = sum_n Lambda(n)/sqrt n (f(log n) + f(-log n)); autocorr g u = int g(v) conj g(v-u) dv. Since autocorr g is supported in [-2L, 2L] within [-log 2, log 2] and vanishes at the endpoints (the overlap is a single point), every prime term is zero, so the claim is positivity of the archimedean Weil functional on autocorrelations: the prime-free window. Not vacuous: the class contains nonzero bump functions for every L > 0, and the conclusion is a genuine inequality on them. It does not imply RH: it covers only support width 2L <= log 2; Weil's criterion needs all L. Pole terms are included, so this is not the pole-free Connes-Consani class."
