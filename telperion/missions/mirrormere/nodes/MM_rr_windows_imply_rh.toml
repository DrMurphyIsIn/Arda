title = "RR-SQUARE WINDOWS IMPLY RH, CONDITIONAL REDUCTION (rvm_bridge RegRRChain, kernel-checked): a family of windows i, each with V i, Div i, B i, f i, iota i, deg, Prin, h0, h1, K, a, chi satisfying the RR index identity, effectivity, compatibility and (degree bound OR no zero divisors), test maps tau i with B v v = -(c * Re weilForm(autocorr (tau v))), c > 0, and pole-free tests of degree 0, which covers every pole-free Weil test, implies Mathlib's RiemannHypothesis. Under RH such windows exist trivially (MM_rr_square_collapse); all content is the construction without reference to the zeros. Not progress on RH."
