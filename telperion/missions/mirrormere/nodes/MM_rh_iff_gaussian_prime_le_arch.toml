text = "RiemannHypothesis is equivalent to: for every real c and lam > 0, Re primeSide (autocorr (gaussPhi c lam)) <= Re archSide (autocorr (gaussPhi c lam)). It is rh_iff_gaussian_positivity composed with gaussian_positivity_iff_prime_le_arch, the latter being the Gaussian explicit formula zeroSide_gaussTest_eq rewritten through sub_re and sub_nonneg under the (c, lam) quantifier. The right-hand side mentions no zeros: it is the sign of one explicit function of two real parameters, an archimedean-minus-prime expression. Both sides of the inequality are in fact real (gauss_zeroSide_real) so the real parts lose nothing. The inequality is not closable by automation and is refuted by any off-line zero (audit non-vacuity probes). An equivalence; neither side is asserted; RH is NOT proved. Axioms [propext, Classical.choice, Quot.sound]. conjecture1_proved = False."
