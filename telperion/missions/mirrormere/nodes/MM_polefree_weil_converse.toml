text = "AI read-back of theorem polefree_weil_converse (artifact RegRRChain.lean, proved from RvMBridgePF.weil_positivity_poleFree_implies_rh; statement identical to the island theorem; in AxiomGuardRvMBridge). Vocabulary as in MMDefs (IsWeilTest: smooth, compactly supported g : R -> C; autocorr g(u) = integral of g(v) conj g(v - u) dv; weilForm = archSide - primeSide; Zeta23.paperFT g z = integral of g(u) e^(i z u) du). Hypothesis: for every such g with BOTH pole conditions paperFT g (i/2) = 0 and paperFT g (-i/2) = 0 (the same pole-free class as the HODGE-1 nodes; RvMBridgePF.PoleFree is this conjunction), Re weilForm(autocorr g) >= 0. Conclusion: Mathlib's RiemannHypothesis. This is Weil's criterion in pole-free form (the direction positivity implies RH); a reformulation, not progress on RH."
