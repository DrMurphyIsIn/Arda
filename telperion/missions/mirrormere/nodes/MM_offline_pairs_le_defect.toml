text = "For a Hermitian matrix A (the Weil-form Gram block of a zero configuration), if there is a NegativeWitness of dimension p -- a p-dimensional subspace on which the Hermitian form of A is negative definite -- then p is at most the defect of A (the number of negative eigenvalues, i.e. the negative index of inertia). Dual to the positive-index rank bound applied to -A. Consequence: off-line zero pairs, each of which supplies an independent negative direction (Vandermonde-type test vectors keep them linearly independent), are COUNTED by the defect, not merely detected -- the R2 defect-k rigidity direction. [Verbatim extract of the proved offline_pairs_le_defect; artifact on rh/million-turing, grant deferred to the branch reconcile.]"
