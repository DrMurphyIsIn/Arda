text = "Formal statement, read in the author's own session (so this read-back is NOT independent; the Comparator judge is the independent check that the artifact proves exactly this type). For every g : R -> C that is C-infinity with compact support (IsWeilTest), and every real L with 2L <= 4/5 and tsupport g inside [-L, L], the real part of weilForm(autocorr g) is >= 0, with weilForm = archSide - primeSide (both pole terms H(0), H(1) kept) and autocorr g u = int g(v) conj g(v-u) dv. Since 4/5 > log 2 (about 0.693), the support [-2L, 2L] of autocorr g can reach u = +-log 2, so the prime side is NOT empty: exactly the n = 2 term Lambda(2)/sqrt 2 (f(log 2) + f(-log 2)) can be nonzero (log 3 is about 1.10 > 4/5). So this is positivity of the Weil functional past the prime-free boundary, including one prime. Not vacuous: the class contains nonzero bumps for every L > 0. Strictly stronger than MM_weil_positivity_prime_free_window, whose hypothesis 2L <= log 2 implies 2L <= 4/5. It does not imply RH: Weil's criterion needs every support width, and this covers only 2L <= 4/5."

