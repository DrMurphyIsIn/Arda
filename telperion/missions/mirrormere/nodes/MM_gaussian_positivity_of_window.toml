text = "An instrument with a load-bearing on-line hypothesis, NOT a proof of RH. Given D >= 0, delta > 0, d^2 + 1/4 < D^2, the hypothesis WindowOnLine c D (every nontrivial zero with |Im rho - c| <= D has real part 1/2; exactly what a finite Turing verification supplies for bounded c, carried cross-island at registry level and never imported), one certified nontrivial zero at ordinate distance between delta and d from c, and lam >= lamThreshold c D d delta = max 1 (constB c e^{2(D^2 - 1/4)} / (2 (D^2 - 1/4 - d^2) delta^2)), the Gaussian zero sum Re zeroSide (gaussTest c lam) is nonnegative. Audited shape: the zero side splits into window and tail (summable_term_subtype, zeroSide_split); under WindowOnLine every window summand is real and nonnegative and the near zero contributes at least m delta^2 e^{-2 lam d^2}; every tail term has phi = (1/2 - Re rho)^2 - (Im rho - c)^2 <= 1/4 - D^2 < 0 and for lam >= 1 is bounded by e^{2 (lam - 1)(1/4 - D^2)} times E6Bridge7's lam = 1 majorant, whose tsum is constB c; the threshold arithmetic makes the tail bound at most the near floor. Load-bearing: the auditor's probes show the conclusion is refuted without the on-line hypothesis and the class is non-vacuous. Nothing is assumed or concluded about zeros outside the window; RH is NOT proved. Axioms [propext, Classical.choice, Quot.sound], no sorry. conjecture1_proved = False."
