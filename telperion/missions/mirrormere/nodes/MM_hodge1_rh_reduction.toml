text = "AI read-back of theorem rh_iff_poleFree_outside_window5493. Vocabulary as in MMDefs and checked against the rvm_bridge island: IsWeilTest g means g : R -> C is smooth (C^infinity) with compact support; autocorr g (u) = integral of g(v) conj(g(v - u)) dv; weilForm f = archSide f - primeSide f, with archSide the two pole terms weilKernel f 0 + weilKernel f 1, minus f(0) log pi, plus (1/(2 pi)) times the integral of the transform against Re digamma(1/4 + i r/2), and primeSide = sum over n of Lambda(n)/sqrt n (f(log n) + f(-log n)); Zeta23.paperFT g z = integral of g(u) e^(i z u) du, so the hypothesis paperFT g (i/2) = 0 and paperFT g (-i/2) = 0 says the integrals of g(u) e^(-u/2) and g(u) e^(u/2) both vanish (pole-free; Hodge1.PoleFree2 unfolds to exactly this). Statement: Mathlib's RiemannHypothesis (not redefined in MMDefs) holds if and only if, for every smooth compactly supported g with both pole conditions whose topological support is NOT contained in [-0.5493, 0.5493], the real part of weilForm(autocorr g) is >= 0. Combined with MM_hodge1_window5493, which covers the tests supported inside that window, this says RH is equivalent to pole-free Weil positivity for all tests; the theorem is a reformulation that isolates the part not yet proved (supports reaching beyond half-width 0.5493). It is not progress on RH. The statement is identical to the island wrapper Hodge1_RegRH, proved from Hodge1.rh_iff_poleFree2_outside_window5493 (heavy job)."
