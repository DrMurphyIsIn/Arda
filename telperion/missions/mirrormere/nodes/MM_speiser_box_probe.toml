text = "Formal statement, rendered by the auditor from the statement file Statements/MM_speiser_box_probe.lean (not from the title): for every complex s with 1/4 <= Re s <= 3/8 and 6 <= Im s <= 10, deriv riemannZeta s != 0 (Mathlib's riemannZeta and deriv; a closed box strictly left of the critical line). It is one finitely-checkable box and NOT the Speiser wall (zeta' zero-free on the whole open strip 0 < Re s < 1/2 is equivalent to RH, Speiser 1935); it says nothing about RH. Artifact theorem speiser_box_probe in SpeiserDerivBox.lean (:288), over SpeiserDerivCore.lean. Eight discs of radius 13/50 centred at 5/16 + i(25/4 + k/2), k = 0..7, cover the box by the proved lemma dist_le_of_row and a case split on Im s, so the cover is a theorem, not an assumption. On each disc, ArbEcon.Off.SpD.cell_deriv_ne_zero turns a kernel-checked (decide +kernel) certificate for a model polynomial M into zeta' != 0: a uniform bound |zeta - M| <= budget on the disc of radius r + rho, Cauchy's estimate giving |(zeta - M)'| <= budget/rho <= F on the inner disc, and |M'| > F there. Checked by the auditor in its own detached worktree ~/arda-bb-speiser at main 8f5c830c8 (the #753 merge): lake build SpeiserDerivCore SpeiserDerivBox AxiomGuardSpeiserDeriv, 3227 jobs, exit 0, both modules freshly built (2026-10-17); all 11 lines of AxiomGuardSpeiserDeriv print exactly [propext, Classical.choice, Quot.sound], with no sorryAx or ofReduceBool, and neither file contains sorry, axiom, native_decide, implemented_by or extern; statement_matches against SpeiserDerivBox.lean is True, and tampered copies (1/4 to 1/5, 3/8 to 1/2, 6 to 5, 10 to 11, != to =, deriv riemannZeta to riemannZeta) are all False; in a root-namespace file with import Mathlib and no open, speiser_box_probe closes the statement as elaborated there (standard three axioms), while the riemannZeta variant without deriv is rejected by the type checker; the statement file elaborates against the island's Mathlib v4.32.0 with only the exp