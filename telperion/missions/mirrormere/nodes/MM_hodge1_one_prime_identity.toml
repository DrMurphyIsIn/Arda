text = "AI read-back of theorem re_weilForm_eq_archW_sub_prime. Registry definitions checked verbatim against the rvm_bridge island (IsWeilTest, weilKernel, archIntegrand, archSide, primeSide as in E6Bridge4; autocorr and weilForm as in E6Bridge5; Zeta23.paperFT; hsq from E6Bridge31; psiR from E6Bridge11; archW from ArchS3_Delta), and the island theorem in Hodge1_Reduction.lean has the same type. Hypotheses: g : R -> C is smooth with compact support; its topological support lies in [-L, L]; 2L <= log 3; and paperFT g (i/2) = integral of g(u) e^(-u/2) du = 0. Let f = autocorr g, f(u) = integral of g(v) conj(g(v - u)) dv. Conclusion: Re weilForm f, i.e. Re(archSide f - primeSide f), equals archW g - (log 2 / sqrt 2) Re(f(log 2) + f(-log 2)), where archW g = (1/(2 pi)) times the integral over real r of |paperFT g r|^2 (Re digamma(1/4 + i r/2) - log pi). Reading: f is supported in [-2L, 2L], inside [-log 3, log 3], so in primeSide only n = 2 contributes (Lambda(2)/sqrt 2 = log 2/sqrt 2); the two pole terms weilKernel f 0 and weilKernel f 1 each carry the factor paperFT g (i/2) and vanish; and the -f(0) log pi term together with the digamma integral is archW g by Plancherel. It is an exact identity on this pole-free one-prime window, makes no positivity claim, and says nothing about zeros of zeta or about RH."
