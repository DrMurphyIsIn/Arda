text = "If a complex polynomial p satisfies the self-inversive identity z^deg(p) * conj(p(1/conj z)) = phase * p(z) for all nonzero z, and u is a unit-norm square root of the phase, then for every real omega and x the finite Hardy-Z analogue hardyZ p u omega x (the half-degree-phase-normalized exponential sum) has zero imaginary part. This is the functional-equation <-> self-inversive dictionary's reality theorem: conjugation composed with the self-inversive identity fixes Z on the unit circle's preimage, the exact finite model of the completed zeta being real on Re s = 1/2, with u^2 = phase the finite analogue of the archimedean completion factor. [Verbatim extract of the proved selfInversive_iff_hardyZ_real; artifact on rh/million-turing, grant deferred to the branch reconcile.]"
