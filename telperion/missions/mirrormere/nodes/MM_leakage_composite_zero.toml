title = "A2b, a FORMALIZATION win, not new mathematics: for a completely multiplicative normalized amplitude a, the Dirichlet coefficients b of -F'/F vanish at every non-prime-power index -- the classical identity -F'/F = sum Lambda(n) a(n) n^-s, Apostol-grade, whose content here is the kernel proof rather than the theorem. NOT the rfl-grade von Mangoldt support fact: unfolding both definitions leaves the goal untouched, and the proof is a real strong induction over the divisor recursion plus a well-founded construction of b. Carries a certified Davenport-Heilbronn counterexample at n = 6 showing the multiplicativity hypothesis is NECESSARY, and the only clause with numerical content is the kernel enclosure 1.93635 < b(6) < 1.93636, built from proved boxes for two square roots and two logarithms. NOTE the enclosure does NOT contain the published 4-dp figure 1.9364; it ROUNDS to it, proved in-kernel. Blind read-back 2026-09-20 verdict: CONTENTFUL, MODEST, CLASSICAL"
