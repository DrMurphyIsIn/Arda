text = "AI read-back of theorem weil_positivity_poleFree_window5493. Vocabulary as in MMDefs and checked against the rvm_bridge island: IsWeilTest g means g : R -> C is smooth (C^infinity) with compact support; autocorr g (u) = integral of g(v) conj(g(v - u)) dv; weilForm f = archSide f - primeSide f, with archSide the two pole terms weilKernel f 0 + weilKernel f 1, minus f(0) log pi, plus (1/(2 pi)) times the integral of the transform against Re digamma(1/4 + i r/2), and primeSide = sum over n of Lambda(n)/sqrt n (f(log n) + f(-log n)); Zeta23.paperFT g z = integral of g(u) e^(i z u) du, so the hypothesis paperFT g (i/2) = 0 and paperFT g (-i/2) = 0 says the integrals of g(u) e^(-u/2) and g(u) e^(u/2) both vanish (pole-free; Hodge1.PoleFree2 unfolds to exactly this). Statement: for every such g with both pole conditions, every real L <= 5493/10000, and topological support of g inside [-L, L], the real part of weilForm(autocorr g) is >= 0. Since log 3 / 2 = 0.549306..., autocorr g is supported strictly inside (-log 3, log 3), so only the prime 2 enters; this extends the window of MM_hodge1_window45 and goes past the half-width 1/2 of the KWin2 result. The statement is identical to the island wrapper Hodge1_RegWindow5493, proved from Hodge1.weil_positivity_poleFree2_window5493 (certificate-based; heavy job). A finite-window verification statement with no conceptual content beyond the window; nothing about RH."
