text = "AI read-back of theorem rr_square_collapse (artifact RegRRChain.lean; statement identical to the island theorem; in AxiomGuardRvMBridge). For a real vector space V, a SYMMETRIC bilinear form B and f with B f f > 0: there exist data deg (with deg v = B v f), Prin (deg vanishing on it), h0, h1 >= 0, K, a, chi and beta satisfying the RR identity, the effectivity clause (h0 X > 0 gives X congruent mod Prin to E with deg E > 0 or E principal), compatibility (principal v has B v v = 0) and the degree bound, all with Div = V and iota the identity, IF AND ONLY IF the Hodge index holds: B v f = 0 implies B v v <= 0. Meaning: the abstract axioms on the test space alone are equivalent to the sign they are meant to produce, so an existence statement of this kind is circular; any non-circular use needs a constructed Div strictly larger than V. This is the guard against misreading the chain."
