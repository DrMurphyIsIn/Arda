text = "RiemannHypothesis is equivalent to GaussianPositivity: for every real centre c and width lam > 0, the real part of the Gaussian-weighted zero sum Sum_rho m(rho) (gamma_rho - c)^2 exp(-2 lam (gamma_rho - c)^2) is nonnegative. Forward: under RH gammaOf rho = Im rho, each summand is m(rho) times the real nonnegative (x - c)^2 exp(-2 lam (x - c)^2), non-zeros vanish, and summable_gauss_zeroSide + hasSum_re + HasSum.nonneg give the sign. Converse: an off-line zero yields, by RvMBridge7.gaussian_dominance (MM_gaussian_dominance), some (c, lam) with Re zeroSide < 0, contradicting positivity, so all zeros are on the line and rh_of_all_on_line closes. Two-line composition of audited inputs; E6Bridge10 imports only E6Bridge9 and nothing in E6Bridge5-9 imports it, so no circularity. Axioms [propext, Classical.choice, Quot.sound], no sorry. An equivalence between two open statements; neither side is asserted; RH is NOT proved. conjecture1_proved = False."
