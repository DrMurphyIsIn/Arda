text = "Assuming Mathlib's RiemannHypothesis, there exist an index type (in Type) and for each index i real vector spaces V i and Div i (instances supplied as existential data) with a bilinear form B i, a vector f i, a linear map iota i : V i -> Div i, a linear degree deg i, a submodule Prin i, functions h0, h1 >= 0, a class K i, a function a i, a constant chi i, test maps tau i : V i -> (R -> C) and constants c i > 0, satisfying: deg(iota v) = B(v, f); deg vanishes on Prin; the Riemann-Roch identity h0(n v) - h1(n v) + h0(K - n v) = n^2 B(v,v)/2 - n a(v)/2 + chi for every natural n; effectivity (h0 X > 0 gives E with X - E principal and deg E > 0 or E principal); principal classes have B(v,v) = 0; a degree bound on h0 OR the no-zero-divisor clause; B(v,v) = -(c * Re weilForm(autocorr(tau v))); pole-free tau v (paperFT at I/2 and -I/2 both zero) has B(v, f) = 0; and every pole-free Weil test g equals some tau i v. Clause by clause these are exactly the hypotheses of rr_windows_imply_rh (MM_rr_windows_imply_rh), in the same order, so together the two nodes say RH iff such windows exist. This is the trivial direction (the collapse windows read off from Weil positivity carry no geometry); not progress on RH. Checked by rebuilding RegRRConverse and AxiomGuardRvMBridge locally: standard axioms, no sorryAx."
