text = "For every c and lam > 0, RvMBridge6.zeroSide (gaussTest c lam) equals archSide (autocorr (gaussPhi c lam)) minus primeSide (autocorr (gaussPhi c lam)), where gaussPhi is the non-compactly-supported Gaussian-derivative test. Proof shape audited step by step: E8 (weilForm_autocorr_eq_zeroSide) on the compactly supported truncations gaussTests c lam n; the zero side converges by Tannery with the n-uniform strip bound C/(1+|gamma|^2) against the local zero count; autocorr (gaussTests n) -> autocorr gaussPhi pointwise by DCT with the n-free Gaussian majorant autocorrMaj (the two hand-checked inequalities |v||v-u| <= (v-u/2)^2 + u^2/4 and v^2 + (v-u)^2 = 2(v-u/2)^2 + u^2/2); the prime side converges by Tannery against primeBound = Lambda(k)/sqrt k * 2 autocorrMaj (log k), summable; the archimedean side by DCT in u for the kernel at s = 0, 1, 1/2 + ir and DCT in r against the digamma growth; then uniqueness of limits. The E8 definitions on the limit test are honest values: the auditor proved their integrability and summability from the file's own majorants. Unconditional identity; no RH content; nothing about the sign of either side. Axioms [propext, Classical.choice, Quot.sound]. conjecture1_proved = False."
