text = "AI read-back of theorem bragg_defect_witness_sie (namespace BraggDefect, registry definitions checked against the island BraggDefect.lean): Aon = 2; Aoff = exp(1/10) + exp(-1/10); excess = Aoff - Aon, i.e. 2cosh(1/10) - 2, about 0.0100083361; defectFunctional d = -(d^2). With no hypotheses the theorem asserts a conjunction of two facts. (1) defectFunctional 0 = 0: the all-on-line configuration has defect exactly zero. (2) defectFunctional excess lies in the closed interval between two explicit negative rationals, lo about -1.00166791722900687180258e-4 and hi about -1.00166791722900687179608e-4 (width about 6.5e-25). Since defectFunctional excess = -(2cosh(0.1) - 2)^2, about -1.001667917229006871800e-4, this is a certified enclosure of that one real number; in particular the synthetic off-line configuration has strictly negative defect. It concerns these explicit numbers only and says nothing about zeros of zeta or about RH."
