text = "For every function g from the reals to the complex numbers that is infinitely differentiable with compact support (IsWeilTest; no bound on the support width and no vanishing condition at any point), the real number archW g + Dfun g is at least 0. Here archW g = (1/(2 pi)) times the integral over all real r of |G(r)|^2 (Re digamma(1/4 + i r/2) - log pi), where G(r) = integral of g(u) exp(i r u) du; and Dfun g = the real part of the integral over all real u of (g * g~)(u) K(u), where (g * g~)(u) = integral of g(v) conj(g(v - u)) dv and K(u) = 2 exp(|u|/2) (S(2 pi (e^|u| + 1)) + S(2 pi (e^|u| - 1))) with S(c) = integral from 0 to 1 of sinc(c t) dt. So the archimedean Weil functional plus this explicit kernel correction is nonnegative on every test function."
