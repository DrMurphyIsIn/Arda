text = "AI read-back of theorem rr_square_hodge_index (artifact RegRRChain.lean, proved by RvMBridgePF.RRSquare.hodge_index; statement identical to the island theorem; in AxiomGuardRvMBridge). Data: real vector spaces V (tests) and Div (divisors), a bilinear form B on V, a vector f in V (the fibre class), a linear map iota: V -> Div, a linear degree deg: Div -> R with deg(iota v) = B v f, a subspace Prin of principal divisors on which deg vanishes, functions h0, h1: Div -> R with h0, h1 >= 0, a class K, a function a: V -> R and a constant chi. Axioms: (RR) for every v and natural n, h0(iota(n v)) - h1(iota(n v)) + h0(K - iota(n v)) = (1/2) n^2 B v v - (1/2) n a(v) + chi; (eff) if h0 X > 0 then X is congruent mod Prin to some E with deg E > 0 or E principal, which (since deg vanishes on Prin) says exactly: a divisor with sections has positive degree or is principal; there is no separate effective predicate; (compat) if iota v is principal then B v v = 0. Extra hypothesis: a degree bound, h0 X <= beta(deg X) for some function beta. Conclusion: for every v with B v f = 0, B v v <= 0 (the Hodge index on the part orthogonal to f). An abstract implication about real-valued data; it constructs nothing and says nothing about zeta or RH by itself."
