text = "For every real number c (quantified outside the equivalence), Mathlib's RiemannHypothesis is equivalent to: there exists a real C such that for every smooth compactly supported pole-free g (paperFT g at I/2 and at -I/2 both zero), -C times integral |g|^2 is at most Re weilForm(autocorr g) + c times integral |g|^2. Since integral |g|^2 = (autocorr g)(0), the shift is a c-delta at u = 0; the statement says the delta coefficient does not decide RH. Given the unshifted node it is immediate (take C' = C + c); RH-equivalent, not progress on RH."
