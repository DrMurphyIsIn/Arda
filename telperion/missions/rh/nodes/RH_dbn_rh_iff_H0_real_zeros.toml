text = "The registry statement asserts only a biconditional and proves neither side. Left side: every complex rho with Mathlib riemannZeta rho = 0, 0 < Re rho and Re rho < 1 has Re rho = 1/2. This is the registry's AND-ladder strip form of RH, and the strict bound Re rho < 1 keeps zeta's junk value at s = 1 out. Right side: every complex z with DBN.H 0 z = 0 has Im z = 0. Here DBN.H t z is the integral over (0, oo) of exp(t u^2) Phi(u) cos(z u), and Phi(u) is the sum over n >= 1 of (2 pi^2 n^4 e^{9u} - 3 pi n^2 e^{5u}) exp(-pi n^2 e^{4u}), the Polymath15 convention. In words: every zero of H_0 is real. Classically both sides are RH, via H_0(z) = (1/8) xi(1/2 + iz/2) and the map z -> 1/2 + iz/2, which sends the real axis exactly onto the critical line. The statement neither proves RH nor rules it out, and conjecture1_proved = False.\n\nIndependent second read-back (A2): The registry statement dbn_rh_iff_H0_real_zeros says two conditions are equivalent. Left side: every complex zero rho of Mathlib's riemannZeta with 0 < Re rho < 1 has Re rho = 1/2. This is RH in the curried AND_ladder strip grammar (forall rho, riemannZeta rho = 0 -> 0 < rho.re -> rho.re < 1 -> rho.re = 1/2). Right side: every complex zero z of H_0 has Im z = 0. H_0 is DBN.H 0, where H_t(z) = integral over (0, infinity) of e^{t u^2} Phi(u) cos(z u) du, and Phi(u) = sum over n >= 1 of (2 pi^2 n^4 e^{9u} - 3 pi n^2 e^{5u}) exp(-pi n^2 e^{4u}). This is the Polymath15 / Rodgers-Tao de Bruijn-Newman kernel. Classically H_0(z) = xi(1/2 + iz/2)/8, and Re(1/2 + iz/2) = (1 - Im z)/2, so the right side is RH restated. The node asserts only the equivalence of the two restatements. It asserts neither side, says nothing about the de Bruijn-Newman constant, and does not claim de Bruijn's t >= 1/2 theorem. The artifact proves it unconditionally: it specialises the conditional bridge at the island theorem dbn_H0_eq_xi, with axioms exactly [propext, Classical.choice, Quot.sound]. conjecture1_proved = False.\n\nTestimony: docs/AUDIT_TESTIMONY_RH_dbn_rh_iff_H0_real_zeros_2026-09-22_A1.md, _A2.md (both pass, axioms_clean, statement_byte_identical)."
