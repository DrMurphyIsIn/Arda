text = "Read back by the operator from Statements/RH_dbn_selberg_newman.lean and RHDefs.lean (rendering drafted by the authoring session, checked by me). The theorem quantifies over every F of the structure DBNSelberg.ExtSelbergData, i.e. Dirichlet coefficients a with a 1 = 1, a second nonzero coefficient, and absolute convergence for Re s > 1; Gamma data Q > 0, lam_j > 0, Re mu_j >= 0 with sum lam_j > 0; a nonzero polynomial P; and a function Xi that is entire, equals the sum of a n times P(s) Q^s prod Gamma(lam_j s + mu_j) times n^-s for Re s > 1 in the variable z = -i(2s-1), and is bounded on every horizontal strip. For every such F and every real t < 0 it concludes that there is a complex z with F.flow t z = 0 and z.im not equal to 0, where flow t is the Gaussian convolution (4 pi |t|)^(-1/2) times the integral of exp(-w^2/(4|t|)) Xi(z + w). That is Newman's conjecture Lambda_F >= 0 for the abstract data; the entire-continuation and strip-bound fields are hypotheses here, not derived."
