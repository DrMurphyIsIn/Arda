text = "For T >= 4, assuming only that zeta is nonvanishing on the horizontal segment Re in [1/2,2] at height T, the Backlund argument-count S(T) (continuous argument change of zeta along 2 -> 2+iT -> 1/2+iT, divided by pi) satisfies the explicit bound |S(T)| <= log((4T+19)/|F_T(2)|)/log(7/6) + 2, where F_T is Backlund's auxiliary function (zeta(z+iT)+zeta(z-iT))/2 — the classical S(T)=O(log T) with an explicit constant, slimmed to one hypothesis. [Verbatim extract of the proved RvMBacklundLogCont theorem; session-audited per the verbatim-extract precedent.]"
