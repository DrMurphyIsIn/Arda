text = "The node is established as stated, for every real t0 and Y.\n\nStatement, read before the artifact: take any real t0 and Y. If every zero of H_{t0} has (Im z)^2 <= Y, then for every t >= t0, every zero of H_t has (Im z)^2 <= max(Y - 2(t - t0), 0). Here H_t(z) is the integral over u > 0 of e^{t u^2} Phi(u) cos(zu), with the standard de Bruijn-Newman Phi. This is de Bruijn 1950 Thm 13 (also Polymath15 Thm 3.2). It is conditional on the caller's information about H_{t0}: it does not locate the zeros of H_0 and does not prove RH. If Y < 0 the theorem is vacuous. The DBN block in RHDefs is a verbatim copy of the DBNDefs lines.\n\n1. Canonical gate: statement_matches returns True, and the raw statement is byte-identical to artifact lines 132-134. artifact_incompleteness_markers finds nothing in the artifact or in its 11-file dbn-island import closure. There are no axiom, opaque or extern declarations, and the closure does not use DBNStrip or any registry theorem.\n2. Build: lake build --no-build reports all targets up to date.\n3. Axioms: my #print axioms probe (now deleted) shows only propext, Classical.choice and Quot.sound for dbn_debruijn_parametric and three supporting lemmas (the growth bound, the Hadamard data and the convergence). An example restating the registry proposition closes with dbn_debruijn_parametric.\n4. Negative t0: the order-3/2 growth is proved, not assumed. m1_norm_W_le_growth has no sign condition on t0; I instantiated it at t0 = -5 and it compiled. m1W_zero shows the bound covers H_{t0} itself. The order-less-than-2 Hadamard step is discharged with rho = 3/2.\n5. Numerics (single process): H_0 matches xi(1/2+iz/2)/8 to within 1e-12 relative error. For t = 0.3, the argument principle gives winding 0 on the box Re[0.5,60] x Im[0.05,3] (no zeros above the axis) and 3 on the box Re[0.5,60] x Im[-0.5,0.5] across the axis. The real axis has exactly 3 sign changes, at about 28.10, 41.82 and 49.85. So these zeros are real, consistent with the bound (Im z)^2 <= 0.4.\n\nconjecture1_proved = False.\n\nIndependent second read-back (A2): Pass: the artifact establishes the node RH_dbn_debruijn_parametric. conjecture1_proved = False.\n\nWhat the statement says (read before opening the artifact). H t z = ∫_{u>0} e^{t u^2} Φ(u) cos(zu) du, where Φ is the standard de Bruijn-Newman kernel. For every real t0 and Y: if every zero of H_{t0} has (Im z)^2 <= Y, then for every t >= t0 every zero of H_t has (Im z)^2 <= max(Y - 2(t - t0), 0). This is de Bruijn 1950 Thm 13 / Polymath15 Thm 3.2, with no restriction on t0. It depends on the caller's hypothesis about H_{t0}, so it neither bounds Λ nor proves RH. The DBN definitions in RHDefs match DBNDefs.lean byte for byte (checked with diff).\n\nGate:\n- statement_matches returned True against examples/dbn/lean/DBNM1Parametric.lean.\n- The statement text in the artifact (lines 132-134) is byte-identical to the node file.\n- artifact_incompleteness_markers returned [] for the artifact and for all 11 files in its island import closure (DBNDefs, DBNStep, DBNHurwitz, DBNHeatApprox, DBNHadamard*, DBNM1Approx).\n\nBuild and axioms:\n- lake build --no-build reported all targets up to date (8807 jobs).\n- In my probe, #print axioms dbn_debruijn_parametric gave [propext, Classical.choice, Quot.sound].\n- An example restating the registry statement verbatim was proved by dbn_debruijn_parametric. An example at t0 = -5 also elaborated.\n- The helper lemmas the proof relies on show the same three axioms.\n- The probe file is deleted.\n\nNegative t0: the order < 2 growth is proved, not assumed. m1_norm_W_le_growth holds for all real t0, δ and N with no hypotheses, and bounds ||W|| by A·exp(B|z|^{3/2}). m1_evenHadamardData_W, m1W_zero and m1W_succ also take no condition on t0. m1_tendstoLocallyUniformly_G needs only 0 <= s.\n\nNumerical check (mpmath at 40 digits, one process):\n- Calibration: 8·H_0(0) = ξ(1/2) = 0.497120778188.\n- H_0.3 changes sign on the real line at 28.0958, 41.8183 and 49.8457.\n- Winding numbers: 0 on [20,50]×[0.05,1] and 0 on [20,50]×[-1,-0.05], largest phase step 1.07 rad (below π). The full box [20,50]×[-1,1] gives 3.\n- So all three zeros in that box are real, consistent with the bound (Im z)^2 <= 0.4.\n\nTestimony: docs/AUDIT_TESTIMONY_RH_dbn_debruijn_parametric_2026-09-24_A1.md, _A2.md (both pass, axioms_clean, statement_byte_identical)."
