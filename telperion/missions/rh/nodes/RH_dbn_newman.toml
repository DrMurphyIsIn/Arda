title = "Newman's conjecture (Rodgers-Tao 2018), after Dobner 2020: for every t < 0 the heat-flowed H_t has a NON-REAL zero, i.e. Lambda >= 0 in the island's sInf-free vocabulary. PROVED on the dbn island (DBNNewman: Bohr almost periodicity + Hadamard exp-polynomial + complex Stirling + Gaussian convolution of H_0 + saddle-point Theorem 4 + Hurwitz). With de Bruijn (Lambda <= 1/2) and the judged QRH bridge (Lambda <= 9/32) the kernel-checked picture is 0 <= Lambda <= 9/32. Lambda = 0 is RH and is NOT proved. conjecture1_proved = False"
