text = "For every smooth compactly supported complex test function g on the prime side, the archimedean integrand is integrable and the sum over all complex rho of (multiplicity of rho as a zero of zeta on the open critical strip, zero elsewhere) times the transform H_g(rho) = integral of g(u) e^{(rho-1/2)u} du converges (HasSum, so summability is part of the claim) to H_g(0) + H_g(1) - g(0) log pi + (1/2pi) integral of H_g(1/2+ir) Re psi(1/4+ir/2) dr minus the finite prime-power sum of Lambda(n)/sqrt(n) (g(log n) + g(-log n)). This is the Weil 1952 / Guinand 1948 explicit formula in the non-even form; rho and its conjugate are separate terms, matching the prime side carrying both g(log n) and g(-log n). Non-summability would make it false, not vacuous; the class is nonempty and not a singleton."
