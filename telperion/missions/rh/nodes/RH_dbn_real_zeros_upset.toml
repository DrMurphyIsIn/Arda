text = "Pass. The node is proved as stated, with no `sorry` and only the three standard axioms. conjecture1_proved = False.\n\nWhat the statement says (read from the statement file before opening the artifact): for real t0 <= t, if every zero of H_{t0} is real, then every zero of H_t is real. H_t(z) is the integral over u > 0 of e^{t u^2} Phi(u) cos(z u), with Phi the Polymath15 theta series. The definitions of thetaMoment, Phi, HIntegrand and H in RHDefs are copied word for word from the island's DBNDefs; I compared the text. This is the forward heat-flow (up-set) half of de Bruijn's theorem and says nothing about where the zeros of H_0 lie.\n\nGate checks:\n- R.load_campaign found the node (status draft).\n- V.statement_matches against DBNM1Parametric.lean returned True.\n- The raw statement text appears byte for byte in the artifact, once, followed by ':= by'.\n- V.artifact_incompleteness_markers found nothing in the artifact or in any of the 11 local files it imports (DBNDefs, DBNStep, DBNHurwitz, DBNHeatApprox, DBNHadamard*, DBNM1Approx, DBNM1Parametric). The only outside imports are Mathlib and Lc.LiCriterion.Basic.\n\nBuild and kernel:\n- leanlock.sh lake build --no-build exited 0: \"All targets up-to-date (8807 jobs)\".\n- My probe printed [propext, Classical.choice, Quot.sound] for both dbn_real_zeros_upset and dbn_debruijn_parametric.\n- An example restating the registry statement verbatim is closed by dbn_real_zeros_upset.\n- An example of the Y = 0 case of the parametric theorem also checks.\n- H_zero_ne_zero (H t 0 != 0) holds, so H_t is never identically zero.\n- I deleted the probe afterwards.\n\nY = 0 and non-vacuity: the proof calls dbn_debruijn_parametric t0 0, which bounds (Im z)^2 by max(-2(t-t0)) 0 = 0, so Im z = 0. That is exactly the Y = 0 case. The parametric result has a real proof: a step lemma iterated over approximants with even Hadamard data, then Hurwitz's theorem passes the bound to the limit H(t0+s), which is not identically zero. The hypothesis is actually used, and at t = 0 the conclusion alone would be RH. With t0 = 1/2 it adds nothing to de Bruijn's theorem, but the implication itself is genuine.\n\nIt does not establish anything about the zeros of H_0, the de Bruijn-Newman constant (not defined on this island), Lambda <= 0, or RH.\n\nIndependent second read-back (A2): Checked everything asked for. The artifact proves the registry statement. conjecture1_proved = False.\n\nRead-back, done before opening the artifact: for all real t0 <= t, if every complex zero of DBN.H t0 is real, then every zero of DBN.H t is real. Here H t z = integral over u>0 of e^{t u^2} Phi(u) cos(z u), with the standard Polymath15 Phi. This is de Bruijn's 1950 Thm 13: real zeros stay real as t increases, so the set of real-zero times is an up-set. It does not define Lambda. The RHDefs DBN block matches island DBNDefs.lean lines 40-41, 211-214, 408-409 and 413 exactly, apart from blank lines and the namespace wrapper.\n\nGate: load_campaign(missions/rh) loads the node, status draft. statement_matches against DBNM1Parametric.lean = True. The raw statement lines are byte-identical by cmp. artifact_incompleteness_markers found nothing in the artifact or its 11-module dbn import closure (DBNDefs, DBNStep, DBNHurwitz, DBNHeatApprox, five DBNHadamard* modules, DBNM1Approx). Nothing in the closure redefines DBN.H.\n\nBuild: leanlock lake build --no-build reports all targets up-to-date (8807 jobs). Probe (now deleted): #print axioms dbn_real_zeros_upset gives [propext, Classical.choice, Quot.sound]. An example restating the registry statement verbatim is closed by dbn_real_zeros_upset.\n\nY = 0 check: the probe got (Im z)^2 <= max(-2(t-t0)) 0 directly from dbn_debruijn_parametric t0 0. The artifact's proof is the same Y = 0 instantiation, then it collapses the max. The real work is in M1a (iterated shift-average steps, then Hurwitz on the uniform limit), so this is not a trivial rewrite.\n\nNot vacuous: DBN.H_zero_ne_zero (standard three axioms) shows H t 0 is never 0, so H_t0 is never identically zero. That means the hypothesis is not automatically false and the conclusion is not automatically true. With t0 = 1/2 it adds nothing beyond classical de Bruijn, and the hypothesis at t0 is left to the caller.\n\nVerdict: the artifact establishes the registry statement, kernel-checked with no `sorry`. It does not establish RH, Lambda <= 0, or anything about where the zeros of H_0 lie.\n\nTestimony: docs/AUDIT_TESTIMONY_RH_dbn_real_zeros_upset_2026-09-24_A1.md, _A2.md (both pass, axioms_clean, statement_byte_identical)."
