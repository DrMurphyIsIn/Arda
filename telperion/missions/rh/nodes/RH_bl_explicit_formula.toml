text = "For every n >= 1, the symmetric-window partial sums of Li s kernel 1 - (1 - 1/rho)^n over the nontrivial zeta zeros, ordered by |Im rho| <= T, converge as T tends to infinity to the Bombieri-Lagarias arithmetic side: an archimedean part carrying gamma + log 4pi and the digamma tower psi^(m)(1/2), minus the finite eta_j residue sum. The family decays like n/|r| and is NOT summable, so a HasSum form would be FALSE, not vacuous; the symmetric-window Tendsto is forced, and the pairing works because the zero set is closed under rho -> 1 - rho. The hypothesis 0 < n is load-bearing (the statement without it is false, proved in Lean), and no tactic closes the statement."
