title = "The BOMBIERI-LAGARIAS EXPLICIT FORMULA on Li's test class (routes-roadmap B7-ii, the B6 -> B7 test-class extension of E8): for every n >= 1 the SYMMETRIC window sums sum_{|Im rho| <= T} m(rho) (1 - (1 - 1/rho)^n) over the nontrivial zeros (RvMCount / E8 multiplicity) converge as T -> infinity to S_inf(n) + S_f(n), S_inf(n) = 1 - (n/2)(gamma + log pi + 2 log 2) + sum_{j=2}^n (-1)^j C(n,j)(1 - 2^{-j}) zeta(j) the archimedean closed form and S_f(n) = -sum_{j=1}^n C(n,j) eta_{j-1} the finite part, eta_j the Taylor coefficients at s = 1 of -zeta'/zeta(s) - 1/(s-1) (BL 1999 Thm 2, Li 1997); the limit is Li's lambda_n. Li's kernel decays like 1/|r| on the line, is in neither the E8 nor the Guinand class, the family is NOT summable (HasSum false, one-sided windows diverge), and the naive prime sum diverges: the arithmetic side is the residue form, not a prime comb. PROVED hypothesis-free 2026-09-21 (E6Bridge27, blind audit AUDIT_TESTIMONY_B7_UNCONDITIONAL_2026-09-21.md); conjecture1_proved = False REDUCED 2026-09-21 to LiValue (see RH_bl_explicit_formula_of_livalue) REDUCED 2026-09-21 to LocalCountSum + StripDerivBound + NoRealZeroInUnitInterval REDUCED 2026-09-21 to StripDerivBound ALONE"
