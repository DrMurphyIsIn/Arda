title = "Zhu compact-window reduction (arXiv:2608.24827 Thm 1.1 + Lemma 6.1), RE-SPECIFIED 2026-09-23 from opaque to concrete inputs: the symbol representation (eq. 2) and the digamma envelope (Lemma 3.1) are PROVED on the rvm_bridge island (ZhuSymbol, ZhuEnvelope) and dropped as hypotheses; the Legendre localization (eqs. 6, 12, 13) is a CONCRETE tail-sum predicate on the reduced matrix beta* I + 2pp^T + C whose analytic inputs eqs. 6 and 12 are PROVED (ZhuLegendre) and whose tail sums stay a hypothesis; the parity decoupling (Lemma 6.1) is PROVED (ZhuParity) so both sectors enter; the eq. (13) tail data of BOTH sectors is PROVED with closed-form constants epsDfun/epsBfun (ZhuTail: Gershgorin and Schur sums dominated by a geometric series under the cut; ZhuInstance: sum < 1e-90 < 1/2 <= beta* at L = 0.8, T# = 200, N = 200, 801!! evaluated by the kernel), so the only remaining hypotheses are the two OPAQUE Arb-certified least-eigenvalue floors (ReducedHeadFloor even, ReducedHeadFloorOdd odd: the trust seams) and arithmetic side conditions -- concludes a positive window floor min over the two sectors of min(lam0, beta* - epsDfun) - epsBfun for the Weil form on supp f in [-L, L], where beta* = log(T#/2pi) - 1/T# - A_L and A_L is the finite von Mangoldt comb mass; STATED ONLY, not proved. Numerically instantiated at L = 0.8 by Zhu Thm 1.2 (8.9e-18, support 1.6, 2.3x the classical (log 2)/2 range) but the kernel asserts NO number. Route closed by Thm 1.4 at doubly exponential cost; PRE-WALL; conjecture1_proved = False"
