text = "The registry statement is `dbn_H0_zero_strip : ∀ z : ℂ, DBN.H 0 z = 0 → z.im ^ 2 ≤ 1`. It says that every complex zero of the de Bruijn-Newman function H_0(z) = ∫_{(0,∞)} Φ(u) cos(zu) du has (Im z)^2 ≤ 1, so all zeros of H_0 lie in the closed horizontal strip |Im z| ≤ 1. Here Φ(u) = Σ_{n≥1} (2π²n⁴e^{9u} − 3πn²e^{5u}) exp(−πn²e^{4u}), the Polymath15 kernel, written as a tsum over the positive integers. That series is summable for every u. The integral is a Bochner integral and is integrable for every complex z because Φ decays doubly exponentially, so H 0 is the genuine function and never a junk value. Classically H_0(z) = ξ(1/2 + iz/2)/8, and the strip corresponds to the closed critical strip 0 ≤ Re s ≤ 1. So the statement is the classical fact that ξ has no zeros outside the closed critical strip. It is far weaker than RH, it does not need ζ(1+it) ≠ 0 because the boundary is allowed, and it is non-vacuous because H_0(−2i) ≠ 0. It says nothing about zeros inside the strip. conjecture1_proved = False.\n\nIndependent second read-back (A2): RH_dbn_H0_zero_strip passes: every check below succeeded.\n\nWhat the statement says. Every complex zero z of the de Bruijn-Newman function H_0 satisfies (Im z)^2 <= 1, so it lies in the closed horizontal strip |Im z| <= 1. Here Phi(u) = sum over n >= 1 of (2 pi^2 n^4 e^{9u} - 3 pi n^2 e^{5u}) exp(-pi n^2 e^{4u}), and H_t(z) is the Bochner integral over (0, inf) of e^{tu^2} Phi(u) cos(zu). The integrand is proved integrable for every t and z, so H_0(z) is the real integral and not a junk value.\n\nWhat this means classically. With s = 1/2 + iz/2, it is the fact that the zeros of xi lie in the closed critical strip 0 <= Re s <= 1. It says nothing about where zeros sit inside the strip, and it is far from RH.\n\nHow it is proved. The proof does not use H_0 = xi/8 (C2):\n- Evenness of Phi folds H_0 into (1/2) times the integral over the whole line of Phi(u) e^{izu}.\n- Integrating term by term with Gamma gives (1/8) s(s-1) pi^{-s/2} Gamma(s/2) n^{-s} for each term.\n- Tonelli/Fubini sums the terms, which converges exactly when Im z < -1, giving H_0 = (1/16) s(s-1) pi^{-s/2} Gamma(s/2) zeta(s) there.\n- On that half-plane no factor vanishes; zeta != 0 comes from the Euler product.\n- Evenness in z (H_0(-z) = H_0(z)) covers Im z > 1.\n\nChecks:\n- The statement matches the artifact exactly, whitespace aside.\n- The hardened gate returns True, and it correctly rejects my two test mutations (a weakened conclusion and an added `sorry`).\n- There are no incompleteness markers in DBNStrip, DBNDefs or the upstream Lc Basic file.\n- #print axioms gives exactly [propext, Classical.choice, Quot.sound].\n- A walk over every constant the proof uses shows it draws only on DBNStrip, DBNDefs and core/Mathlib. Nothing from DBNXi (C2), LiCriterion, riemannXi or H0EqXi appears.\n- The half-plane identity matches numerically to about 1e-32 at z = -2i, 3 - 1.5i and -7.25 - 3i.\n\nWhat it does not establish: that zeros inside the strip are real, the open strip |Im z| < 1, C2, C4, C3, any bound on Lambda, or RH. conjecture1_proved = False.\n\nTestimony: docs/AUDIT_TESTIMONY_RH_dbn_H0_zero_strip_2026-09-22_A1.md, _A2.md (both pass, axioms_clean, statement_byte_identical)."
