name = "RvMBridge"
# E6 bridge island (routes roadmap E6, 2026-09-17): discharges the MIRRORMERE residual
# MM_rvm_unbounded_mean_density from Anthropic's zeta-23-lean (Alpoege--Furman, Theorem A +
# the unconditional Riemann--von Mangoldt main clause). SEPARATE toolchain island by
# necessity: zeta-23-lean pins Lean v4.33.0-rc2 / Mathlib 51e6992e, which matches neither the
# v4.32.0 islands (mirrormere, main) nor the v4.34.0-rc1 islands (missions/rh, li_positivity).
# AxiomGuardRvMBridge is in defaultTargets so bare `lake build` compiles the guard and every
# module it imports before CI runs `lake env lean AxiomGuardRvMBridge.lean` (cf. #448/#451).
defaultTargets = ["E6Bridge", "E6Bridge2", "E6Bridge3", "E6Bridge4", "E6Bridge5", "E6Bridge6", "E6Bridge7", "E6Bridge8", "E6Bridge9", "E6Bridge10", "E6Bridge11", "E6Bridge12", "E6Bridge13", "E6Bridge14", "E6Bridge15", "W2cAssembly", "AxiomGuardRvMBridge"]

# anthropics/zeta-23-lean redirects to anthropics/formal-math; the Lean project is the
# `zeta23/` subdirectory (package name `Zeta23`). Pinned to the exact commit that the E6 probe
# built and audited locally (see README.md). Transitively pins Mathlib
# 51e6992efd06126df61a496bebf8f49482a4e129 (tag v4.33.0-rc2); `lake exe cache get` works
# through this dependency.
[[require]]
name = "Zeta23"
git = "https://github.com/anthropics/formal-math"
rev = "fbdc36bbf17d20af3fd0447c6d1a8a02773c9844"
subDir = "zeta23"

[[lean_lib]]
name = "E6Bridge"

# Second bridge (2026-09-17): the RH registry node RH_rvm_unconditional (cumulative
# Riemann--von Mangoldt, O(log T) remainder), re-assembled from Zeta23's general-window internals.
[[lean_lib]]
name = "E6Bridge2"

# Third bridge (2026-09-17): the RH registry node RH_corridor_bound (routes-roadmap milestone
# E7 = A3 = B5 = D6, the good-ordinate lemma), from Zeta23's Landau partial fraction + local count
# + the completed-zeta functional equation.
[[lean_lib]]
name = "E6Bridge3"

# Fourth bridge (2026-09-18): the RH registry node RH_limit_explicit_formula (routes-roadmap
# milestone E8 = B6 = D6, the unconditional Weil/Guinand explicit formula for smooth compactly
# supported tests), a normalisation bridge from Zeta23's literature-form explicit formula
# (Zeta23.WeilEF.EF_lit_zetaZeroConfig): transform/index-set/multiplicity/archimedean-term seams.
[[lean_lib]]
name = "E6Bridge4"

# W2c assembly (2026-09-18): the MIRRORMERE milestone MM_zeta_ordinates_not_uniformly_discrete
# (the zeta ordinates are not uniformly discrete, unconditional), from a VERBATIM re-proof of
# the v4.32 quasicrystal island's pigeonhole brick (BoundaryLemmas.lean) applied to
# E6Bridge.rvm_unbounded_mean_density. Cross-toolchain assembly: the brick is re-proved here,
# not consumed as a v4.32 olean.
# Fifth bridge (2026-09-20): the MIRRORMERE dictionary node MM_rh_implies_weil_positivity
# (Weil's criterion, forward half: Mathlib's RiemannHypothesis implies Weil positivity of the
# E8 primes-side functional on Hermitian autocorrelations), assembled from E6Bridge4's limit
# explicit formula and Zeta23's transform factorisation paperFT_weilTest. Proves nothing about
# RH itself; discharges the hypothesis hpos carried by weil_negative_refutes_rh.
[[lean_lib]]
name = "E6Bridge5"

# Sixth bridge (2026-09-20): the Weil converse ATTACK. weil_positivity_implies_rh_of proves
# Weil positivity -> Mathlib RiemannHypothesis MODULO two named analytic obligations
# (GaussianTransfer / GaussianApprox, GaussianDominance), both carried as explicit hypotheses;
# plus the unconditional rearrangements (explicit formula with the zero side isolated and real,
# reflection symmetry, pair split, Gaussian summability, Tannery transfer). Nothing about RH is
# proved; the obligations are registry nodes. conjecture1_proved = False.
[[lean_lib]]
name = "E6Bridge6"

# Seventh bridge (2026-09-21): O2 GaussianDominance DISCHARGED unconditionally
# (RvMBridge7.gaussian_dominance: an off-line nontrivial zero makes some Gaussian-weighted
# zero sum strictly negative -- finite ordinate window, generic centre, attained maximiser with a
# gap, phase choice, lam-uniform tail majorant), so the Weil converse now rests on the single
# zero-free Fourier obligation GaussianApprox (weil_positivity_implies_rh_of_approx). Nothing
# about RH is proved. conjecture1_proved = False.
[[lean_lib]]
name = "E6Bridge7"

# Eighth bridge (2026-09-21): O1' GaussianApprox DISCHARGED (RvMBridge8.gaussian_approx): truncated
# Gaussian-derivative Weil tests whose Hermitian transforms converge to gaussTest on the strip with
# an n-uniform C/(1+|z|^2) bound (Gaussian Fourier integral + one integration by parts + DCT).
# Pure Fourier analysis; no zeros mentioned.
[[lean_lib]]
name = "E6Bridge8"

# Ninth bridge (2026-09-21): the ASSEMBLY. gaussian_transfer (O1 unconditional),
# weil_positivity_implies_rh (the Weil converse, unconditional on this island) and
# zeta_comb_membership_iff_rh (the MIRRORMERE dictionary theorem: goal statement <-> Mathlib RH).
# NOT a proof of RH: an equivalence says nothing about whether either side holds.
# conjecture1_proved = False.
[[lean_lib]]
name = "E6Bridge9"

# Tenth bridge (2026-09-21, WALL ASSAULT seam A): the Wall in two real parameters.
# RvMBridge10.rh_iff_gaussian_positivity: RH <-> for every centre c and width lam > 0 the
# Gaussian-weighted zero sum is nonnegative; zeroSide_gaussTest_eq: that sum equals
# archSide - primeSide of the Gaussian-derivative autocorrelation (the explicit formula for the
# non-compactly-supported Gaussian test, by limits of E8); rh_iff_gaussian_prime_le_arch: RH <->
# a prime-side inequality with no zeros in it. Equivalences only; nothing about RH is proved.
# conjecture1_proved = False.
[[lean_lib]]
name = "E6Bridge10"

# Twelfth bridge (2026-09-21, WALL ASSAULT seam C): the ladder-certified region of the
# two-parameter Wall as a kernel INSTRUMENT. gaussian_positivity_of_window: if every nontrivial
# zero within D of the centre c is on the line (WindowOnLine c D, what the Turing ladder certifies
# for c <= T - D, carried as a cross-island HYPOTHESIS) and one certified zero sits at distance in
# [delta, d] of c, then for lam >= lamThreshold(c, D, d, delta) the Gaussian zero sum is
# nonnegative. Nothing about RH is proved; the hypothesis is load-bearing (probes).
# conjecture1_proved = False.
[[lean_lib]]
name = "E6Bridge12"

# Eleventh bridge (2026-09-21, WALL ASSAULT seam B): the small-width region of the two-parameter
# Wall is UNCONDITIONAL with the absolute threshold lam0 = 1e-7 (re_weilForm_gauss_nonneg:
# archimedean dominance, the prime side exponentially small in 1/lam); the zero-side form is stated
# modulo the Gaussian explicit formula, discharged in E6Bridge13. Yoshida-type. Nothing about RH.
[[lean_lib]]
name = "E6Bridge11"

# Thirteenth bridge (2026-09-21): THE WALL MAP. rh_iff_gaussian_positivity_above_lam0: RH <->
# Gaussian positivity on widths strictly above lam0 (below it, positivity is a theorem).
# An equivalence; NOT a proof of RH. conjecture1_proved = False.
[[lean_lib]]
name = "E6Bridge13"

# Fourteenth bridge (2026-09-21, open lemma 1): EFFECTIVE Gaussian dominance. An off-line zero of
# maximal distance y0 in its window, with local spacing floor xmin, window count N and tail
# constant B, makes the Gaussian zero sum at its ordinate negative for every lam above the
# EXPLICIT effectiveThreshold (y0, xmin, N, B, D); plus the localisation instrument
# offline_zeros_small_or_margin. The spacing floor is load-bearing (threshold unbounded as
# xmin -> 0: the clustering control the sweep named). Nothing about RH. conjecture1_proved = False.
[[lean_lib]]
name = "E6Bridge14"

# Fifteenth bridge (2026-09-21, open lemma 2): the WEIL-TO-LI dictionary. The rh node
# RH_bl_explicit_formula (B7): liZeroSum_tendsto proves the CONVERGENCE half (symmetric window
# sums of Li's kernel converge, by conjugation pairing + the local-count majorant);
# bl_explicit_formula_of proves the node verbatim MODULO the named value obligation LiValue n
# (Bombieri-Lagarias Thm 2: needs the global xi'/xi partial fraction, absent from Mathlib/Zeta23);
# rh_implies_liLimit_re_nonneg is Li's criterion, forward half. Nothing about RH is proved.
# conjecture1_proved = False.
[[lean_lib]]
name = "E6Bridge15"

[[lean_lib]]
name = "W2cAssembly"

# The CI axiom guard, declared as a lib so `lake build` compiles it (and thus all its imports).
[[lean_lib]]
name = "AxiomGuardRvMBridge"
