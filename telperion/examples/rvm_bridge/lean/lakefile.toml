name = "RvMBridge"
# E6 bridge island (routes roadmap E6, 2026-09-17): discharges the MIRRORMERE residual
# MM_rvm_unbounded_mean_density from Anthropic's zeta-23-lean (Alpoege--Furman, Theorem A +
# the unconditional Riemann--von Mangoldt main clause). SEPARATE toolchain island by
# necessity: zeta-23-lean pins Lean v4.33.0-rc2 / Mathlib 51e6992e, which matches neither the
# v4.32.0 islands (mirrormere, main) nor the v4.34.0-rc1 islands (missions/rh, li_positivity).
# AxiomGuardRvMBridge is in defaultTargets so bare `lake build` compiles the guard and every
# module it imports before CI runs `lake env lean AxiomGuardRvMBridge.lean` (cf. #448/#451).
defaultTargets = ["E6Bridge", "E6Bridge2", "E6Bridge3", "E6Bridge4", "E6Bridge5", "E6Bridge6", "W2cAssembly", "AxiomGuardRvMBridge"]

# anthropics/zeta-23-lean redirects to anthropics/formal-math; the Lean project is the
# `zeta23/` subdirectory (package name `Zeta23`). Pinned to the exact commit that the E6 probe
# built and audited locally (see README.md). Transitively pins Mathlib
# 51e6992efd06126df61a496bebf8f49482a4e129 (tag v4.33.0-rc2); `lake exe cache get` works
# through this dependency.
[[require]]
name = "Zeta23"
git = "https://github.com/anthropics/formal-math"
rev = "fbdc36bbf17d20af3fd0447c6d1a8a02773c9844"
subDir = "zeta23"

[[lean_lib]]
name = "E6Bridge"

# Second bridge (2026-09-17): the RH registry node RH_rvm_unconditional (cumulative
# Riemann--von Mangoldt, O(log T) remainder), re-assembled from Zeta23's general-window internals.
[[lean_lib]]
name = "E6Bridge2"

# Third bridge (2026-09-17): the RH registry node RH_corridor_bound (routes-roadmap milestone
# E7 = A3 = B5 = D6, the good-ordinate lemma), from Zeta23's Landau partial fraction + local count
# + the completed-zeta functional equation.
[[lean_lib]]
name = "E6Bridge3"

# Fourth bridge (2026-09-18): the RH registry node RH_limit_explicit_formula (routes-roadmap
# milestone E8 = B6 = D6, the unconditional Weil/Guinand explicit formula for smooth compactly
# supported tests), a normalisation bridge from Zeta23's literature-form explicit formula
# (Zeta23.WeilEF.EF_lit_zetaZeroConfig): transform/index-set/multiplicity/archimedean-term seams.
[[lean_lib]]
name = "E6Bridge4"

# W2c assembly (2026-09-18): the MIRRORMERE milestone MM_zeta_ordinates_not_uniformly_discrete
# (the zeta ordinates are not uniformly discrete, unconditional), from a VERBATIM re-proof of
# the v4.32 quasicrystal island's pigeonhole brick (BoundaryLemmas.lean) applied to
# E6Bridge.rvm_unbounded_mean_density. Cross-toolchain assembly: the brick is re-proved here,
# not consumed as a v4.32 olean.
# Fifth bridge (2026-09-20): the MIRRORMERE dictionary node MM_rh_implies_weil_positivity
# (Weil's criterion, forward half: Mathlib's RiemannHypothesis implies Weil positivity of the
# E8 primes-side functional on Hermitian autocorrelations), assembled from E6Bridge4's limit
# explicit formula and Zeta23's transform factorisation paperFT_weilTest. Proves nothing about
# RH itself; discharges the hypothesis hpos carried by weil_negative_refutes_rh.
[[lean_lib]]
name = "E6Bridge5"

# Sixth bridge (2026-09-20): the Weil converse ATTACK. weil_positivity_implies_rh_of proves
# Weil positivity -> Mathlib RiemannHypothesis MODULO two named analytic obligations
# (GaussianTransfer / GaussianApprox, GaussianDominance), both carried as explicit hypotheses;
# plus the unconditional rearrangements (explicit formula with the zero side isolated and real,
# reflection symmetry, pair split, Gaussian summability, Tannery transfer). Nothing about RH is
# proved; the obligations are registry nodes. conjecture1_proved = False.
[[lean_lib]]
name = "E6Bridge6"

[[lean_lib]]
name = "W2cAssembly"

# The CI axiom guard, declared as a lib so `lake build` compiles it (and thus all its imports).
[[lean_lib]]
name = "AxiomGuardRvMBridge"
