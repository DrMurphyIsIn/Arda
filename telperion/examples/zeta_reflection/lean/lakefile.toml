name = "ZetaReflectionSpike"
# The six proved ANDURIL node artifacts are default targets (closure audit C2, 2026-09-22):
# a bare `lake build` compiles every one of them, and the coverage checker
# (telperion/src/telperion/missions/coverage.py) can see that it does.
defaultTargets = ["Spike_DIntvMini", "Spike_Toy", "DIntvDef", "DIntvCorrect", "TaylorKernels", "CertVerify", "Spike_BenchExpD",
                  "CheckBand", "ReflectedBand_t14", "EMZetaTail", "EMZetaComplex", "ForgeFirstZeroKernel", "StirlingBinet",
                  "ReflectedBand_t14_Kernel",
                  "EdgeClearGlue", "BandGlue", "BandGlue_h1000"]

# Same Mathlib pin as the sibling zeta_zero_localization island (v4.32.0), so the
# path require below shares the on-disk Mathlib build cache -- `lake exe cache get`
# pulls the identical artifacts.
[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.32.0"

# The sibling island supplies XiLineZeros, DiffractionCore and TuringBand (imported by
# CheckBand, StirlingBinet, SignChain, LogBranches, ZeroSignDecomp_t14, ...).  Same Mathlib
# rev, so the cache is shared.
#
# This requires the SLIM `zzl_core` sub-project (16 height-independent libs, srcDir = "..",
# so the very same source files), NOT the zeta_zero_localization monolith lakefile.  The
# monolith declares ~27k `lean_lib`s and Lake v4.32 builds LEAN_SRC_PATH from every one of
# them without deduplication (~2.2 MB), so `lake env` / `lake lean` could not even spawn
# `lean` ("could not execute external process", E2BIG) -- which is why the axiom guards of
# the six proved anduril nodes never ran in CI (closure audit C2, 2026-09-22).
[[require]]
name = "zzl_core"
path = "../../zeta_zero_localization/lean/zzl_core"

[[lean_lib]]
name = "Spike_DIntvMini"
roots = ["Spike.DIntvMini"]

[[lean_lib]]
name = "Spike_Toy"
roots = ["Spike.Toy"]

[[lean_lib]]
name = "DIntvDef"
roots = ["DIntvDef"]

[[lean_lib]]
name = "LogBranches"
roots = ["LogBranches"]

[[lean_lib]]
name = "DIntvCorrect"
roots = ["DIntvCorrect"]

[[lean_lib]]
name = "TaylorKernels"
roots = ["TaylorKernels"]

[[lean_lib]]
name = "CertVerify"
roots = ["CertVerify"]

# ANDÚRIL instrument (A): verified large-argument trig reduction (π-free double-angle) -- the
# cos/sin(t·log n) enclosures that unblock the zero-hypothesis reflected band.
[[lean_lib]]
name = "TrigReduce"
roots = ["TrigReduce"]

# Computable DIntv paired-doubling driver for the trig instrument (the emitter target: a single
# kernel `decide` climb instead of an M-step straight-line unroll).
[[lean_lib]]
name = "TrigReduceD"
roots = ["TrigReduceD"]

[[lean_lib]]
name = "Spike_BenchExpD"
roots = ["Spike.BenchExpD"]

[[lean_lib]]
