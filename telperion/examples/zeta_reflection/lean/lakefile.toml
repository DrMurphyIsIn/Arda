roots = ["EMZetaWip"]

[[lean_lib]]
name = "StirlingBinet"
roots = ["StirlingBinet"]

# WIP (K ≥ 2 Bernoulli tail) -- registered so the statement architecture typechecks, but
# deliberately NOT in defaultTargets and NOT guard-imported: it carries `sorry` placeholders.
[[lean_lib]]
name = "StirlingBinetWip"
roots = ["StirlingBinetWip"]

# The HONEST higher-rate Binet ingredients (kernel-clean, guard-imported): the height-aware
# per-term Binet bound (large-height sharpening, no trigamma required).  The exact cos-form K=4
# stays in StirlingBinetWip pending the digamma<->trigamma-series bridge (Mathlib gap).
[[lean_lib]]
name = "StirlingK4"
roots = ["StirlingK4"]

# E-track: complex Euler-Maclaurin lift + K=1 analytic continuation into the critical strip.
[[lean_lib]]
name = "EMZetaComplex"
roots = ["EMZetaComplex"]

# TAIL track: order-K Euler-Maclaurin remainder engine (the reflection blocker).  Builds on
# EMZeta + EMZetaComplex; delivers the N-decaying remainder bound that makes gLine boxes sign-tight.
[[lean_lib]]
name = "EMZetaTail"
roots = ["EMZetaTail"]

# A4 / G2: the reflected-band pilot checker + once-proven soundness.  Imports XiLineZeros from
# the sibling zeta_zero_localization island (via the LambdaLineReal path require above).
[[lean_lib]]
name = "CheckBand"
roots = ["CheckBand"]

# A4 / G2 PILOT INSTANCE (auto-generated by ../reflect_pilot.py): a real on-line band whose
# sign chain is kernel-decided (`ok`), yielding two on-line zeros with no numeric hypotheses.
[[lean_lib]]
name = "ReflectedBand_t14"
roots = ["ReflectedBand_t14"]

# A4 / STAGE 2: the finite-part + kernel-verified-envelope band checker (toward zero-hypothesis).
# checkBandFull computes the envelope widening + sign + alternation in-kernel; residual hypothesis is
# only the finite-part enclosure (the mod-2pi + Gamma-R-value blocked piece; see file header budget).
[[lean_lib]]
name = "FullyReflectedBand_t14"
roots = ["FullyReflectedBand_t14"]

# Operating-point certificates: cos/sin(14 log n), n in {2,200}.
[[lean_lib]]
name = "TrigReduceOperating"
roots = ["TrigReduceOperating"]

# G2-full: the ZERO-HYPOTHESIS ζ-term sign box on the critical line at t=14.  Closes the ζ half of a
# gLine box with no numeric hypotheses (atom term_re/term_im + amplitude box + instrument A), isolating
# gap (B) -- the Γℝ phase/value enclosure -- as the sole residual.  See file header for the design
# decision (Route B1) and the refusal arithmetic.
[[lean_lib]]
name = "ZeroHypBand_t14"
roots = ["ZeroHypBand_t14"]

# ANDÚRIL θ-value instrument: reusable arctan Taylor bracket (rigorous, no special-function anchors).
[[lean_lib]]
name = "ArctanTaylor"
roots = ["ArctanTaylor"]

# ANDÚRIL θ-value: finite Im-part pipeline (arg atom + Im L_n formula + Gauss-product bridge)
# plus the two named remaining Props (rate + branch bridge).
[[lean_lib]]
name = "ThetaValue"
roots = ["ThetaValue"]

# ANDÚRIL θ-bridge: discharges ThetaGap.ConvergenceObligation (branch bridge) + ThetaGap.RateObligation
# (explicit C/n) -- the entire remaining distance to the φ(14) value box.
[[lean_lib]]
name = "ThetaConverge"
roots = ["ThetaConverge"]

# ANDÚRIL G2-FULL: the phase-decomposition sign bridge -- gLine t = M·(cos φ·Re ζ − sin φ·Im ζ), M > 0.
# Removes the Γℝ-VALUE (magnitude) blocker permanently; conditional first-zero in (14,15) from the two
# magnitude-free sign quantities.  Depends (via XiLineZeros.olean on LEAN_PATH) on the sibling island.
[[lean_lib]]
name = "ZeroSignDecomp_t14"
roots = ["ZeroSignDecomp_t14"]

[[lean_lib]]
