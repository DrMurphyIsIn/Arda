name = "ZeroFreeBridge"
defaultTargets = ["ZeroFreeBridge"]

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.32.0"

[[lean_lib]]
name = "ZeroFreeBridge"

# Input (R) strip-representation assembly. Standalone (imports Mathlib only, NOT ZeroFreeBridge),
# kept OUT of `defaultTargets` so the green `zero-free-bridge-compiles` job (bare `lake build`)
# still builds ONLY ZeroFreeBridge. Built explicitly via `lake build StripRepr` in its own CI job.
[[lean_lib]]
name = "StripRepr"

# (R3) discharge: `IsPreconnected stripDomain`. Imports StripRepr; own CI target so it can go
# green while R1/R2 iterate. Out of defaultTargets.
[[lean_lib]]
name = "StripReprR3"

# (R2) discharge (WIP): DifferentiableAt fractIntegral. Own target. NOTE: may transiently carry
# `sorry` in the two hardest hypotheses (h_lip, h_bint) as a diagnostic; NOT a real discharge until
# sorry-free. Out of defaultTargets.
[[lean_lib]]
name = "StripReprR2"

# (R1) discharge (WIP SKELETON): the fractional-part representation of riemannZeta on Re s>1 via
# Abel summation. Now DISCHARGED (sorry-free): the analytic sub-obligations + the LHS->riemannZeta /
# RHS->stripRHS assembly are all proven. Its own CI target. Out of defaultTargets.
[[lean_lib]]
name = "StripReprR1"

# UNCONDITIONAL strip representation `zeta_fract_repr`, assembled from R1+R2+R3 via
# `zeta_fract_repr_of`. Imports StripReprR1/R2/R3; own CI target. Out of defaultTargets.
[[lean_lib]]
name = "StripReprAssembled"

# PHASE 2: the UNCONDITIONAL crude strip growth bound `zeta_strip_bound`, from input (R)
# `zeta_fract_repr` + input (B) `zeta_repr_integral_bound` via `zeta_strip_bound_of`. Imports both
# ZeroFreeBridge and StripReprAssembled; own CI target. Out of defaultTargets.
[[lean_lib]]
name = "StripBound"

# PHASE 4 (core): the de la Vallee Poussin quantitative estimate `dlvp_core_estimate` for the
# zero-free region, conditional on the Borel-Caratheodory log-derivative bounds. Imports
# ZeroFreeBridge; own CI target. Out of defaultTargets.
[[lean_lib]]
name = "ZeroFreeRegion"

# ELEMENTARY (Hadamard-free) UNCONDITIONAL zero-free region assembly `zeta_zero_free_poly_of`
# (polynomial rate Re s > 1 - c/|t|^5), from the product inequality + crude strip bound + pole +
# Cauchy estimate. Imports ZeroFreeBridge; own CI target. Out of defaultTargets.
[[lean_lib]]
name = "ZeroFreeElementary"

# (RATE UPGRADE, WIP) sharp near-line bound |ζ(σ+it)| ≤ C(1+log|t|) via truncated Euler-Maclaurin
# (N~|t|), to improve the region rate from |t|^-5 toward the dVP log-region. Carries `sorry`
# placeholders; own CI target. Out of defaultTargets.
[[lean_lib]]
name = "ZetaLogBound"

# RayPowerEstimate lemma pack (reusable cpow/rpow-on-rays primitives) + EmittedShapes (dogfood: the
# Lean output of the new emit_zero_free_region / emit_dominated_integrability emitters). Own CI targets.
[[lean_lib]]
name = "RayPowerEstimate"

[[lean_lib]]
name = "EmittedShapes"

# POLYLOG-improved unconditional zero-free region `riemannZeta_zero_free_polylog`
# (Re s > 1 - c/(γ⁴·(1+log(2γ))), strictly stronger than the elementary γ⁻⁵): wires the sharp
# `zeta_log_bound` into the elementary cascade's 2t factor. Imports ZeroFreeElementary + ZetaLogBound;
# own CI target. Out of defaultTargets.
[[lean_lib]]
name = "ZeroFreePolylog"

# PHASE 4 dVP frontier, rung 1: zero-extraction core of the `hzero` bound. Imports
# ZeroFreeBridge; own target, out of defaultTargets.
[[lean_lib]]
name = "DlvpZeroSum"

# PHASE 4 dVP frontier, rungs 3-5: pole bound, double bound, region assembly. Imports
# DlvpZeroSum + ZeroFreeRegion; own target, out of defaultTargets.
[[lean_lib]]
name = "DlvpPole"

# PHASE 4 dVP frontier, rung 2 combine: BC-SUM from the log-derivative split + entire
# bound. Imports DlvpZeroSum; own target, out of defaultTargets.
[[lean_lib]]
name = "DlvpBCSum"

# PHASE 4 dVP frontier, rung 2 analytic core: ζ-on-disk analyticity/non-vanishing + the
# Jensen zero-count applied to ζ. Imports Mathlib only; own target, out of defaultTargets.
[[lean_lib]]
name = "DlvpZetaDisk"

# PHASE 4 dVP frontier, obligation (i) core: the log-derivative partial-fraction split
# (Herglotz sum + entire part). Imports Mathlib only; own target, out of defaultTargets.
[[lean_lib]]
name = "DlvpHerglotz"

# PHASE 4 dVP frontier, obligation (i) foundations: ζ canonical factorization + entire-part
# analyticity. Imports DlvpZetaDisk; own target, out of defaultTargets.
[[lean_lib]]
name = "DlvpEntire"

# PHASE 4 dVP frontier, obligation (i-a') core: germ / identity-principle transfer of a
# factorization to a pointwise logDeriv equality. Imports Mathlib only; out of defaultTargets.
[[lean_lib]]
name = "DlvpTransfer"

# PHASE 4 dVP frontier, obligation (i-a''') bridge: finprod↔Finset connecting extract_zeros_poles
# to herglotz_split. Imports DlvpHerglotz; out of defaultTargets.
[[lean_lib]]
name = "DlvpBridge"

# PHASE 4 dVP frontier, obligation (i-a) CAPSTONE: ζ'/ζ = Herglotz sum + entire part, assembled
# end-to-end for ζ. Imports DlvpEntire+DlvpBridge+DlvpTransfer; out of defaultTargets.
[[lean_lib]]
name = "DlvpZetaSplit"

# PHASE 4 dVP frontier, obligation (i-b') FOUNDATION: analytic log branch of a zero-free g on a
# disk (primitive of logDeriv g; g = exp∘h; Re h = log‖g‖). Mathlib-only. Out of defaultTargets.
[[lean_lib]]
name = "DlvpLogBranch"

# PHASE 4 dVP frontier, obligation (i-b') CORE: Borel-Caratheodory + Cauchy derivative bound
# (‖deriv h c‖ ≤ 2M'/(R-r) from Re h ≤ M'). Mathlib-only. Out of defaultTargets.
[[lean_lib]]
name = "DlvpBCDeriv"

# PHASE 4 dVP frontier, obligation (i-b') COMPOSITION: ‖logDeriv g c‖ ≤ 2M'/(R-r) from
# log‖g‖ oscillation ≤ M' (composes DlvpLogBranch + DlvpBCDeriv). Out of defaultTargets.
[[lean_lib]]
name = "DlvpEntireBound"

# PHASE 4 dVP frontier, obligation (i-b') → sphere: max-modulus reduction (sphere bound on log‖g‖
# → disk) composed with the entire-part bound. Isolates ζ input as a sphere bound. Out of defaultTargets.
[[lean_lib]]
name = "DlvpMaxMod"

# PHASE 4 dVP frontier, obligation (i-b') → two ζ inputs: boundary-growth decomposition
# log‖g‖ = log‖ζ‖ - log‖P‖ splits the sphere oscillation into ζ-growth + zero-factor. Out of defaultTargets.
[[lean_lib]]
name = "DlvpBoundaryDecomp"

# PHASE 4 dVP frontier, ζ boundary growth LOWER half: ‖ζ(s)‖ ≥ 2 - π²/6 > 0 for Re s ≥ 2
# (Dirichlet reverse triangle + Basel tail). Mathlib-only. Out of defaultTargets.
[[lean_lib]]
name = "DlvpZetaLower"

# PHASE 4 dVP frontier, ζ zero-factor bound (2) crux: two-scale separation R-R₀ ≤ ‖z-ρ‖ +
# per-zero log ratio bound. Mathlib-only. Out of defaultTargets.
[[lean_lib]]
name = "DlvpZeroFactor"

# PHASE 4 dVP frontier, ζ zero-factor (2) log-of-finprod wiring: log‖∏(w-ρ)^m‖ = Σ m·log‖w-ρ‖,
# composed with the two-scale bound → AP. Imports DlvpZeroFactor. Out of defaultTargets.
[[lean_lib]]
name = "DlvpLogProd"

# PHASE 4 dVP frontier, ζ zero-factor (2) INSTANTIATION: abstract log_norm_prod_diff_le applied to
# the ζ zero-part finprod (divisor on inner disk). Imports DlvpZetaDisk+DlvpLogProd. Out of defaultTargets.
[[lean_lib]]
name = "DlvpZetaZeroFactor"

# PHASE 4 dVP frontier, BLASCHKE correction: finite Blaschke product ‖∏ᶠ canonicalFactor^n‖ = 1 on
# the sphere (Mathlib CanonicalDecomposition). Removes the lossy AP term. Out of defaultTargets.
[[lean_lib]]
name = "DlvpBlaschke"

# PHASE 4 dVP frontier, BLASCHKE step 1: pointwise sphere identity ‖f‖=‖g‖ from codiscrete factor
# via continuity + density (Set.EqOn.closure). Imports DlvpBlaschke. Out of defaultTargets.
[[lean_lib]]
name = "DlvpBlaschkeSphere"

# PHASE 4 dVP frontier, BLASCHKE step 2: canonical-decomp part g analytic + zero-free on ball 0 R
# (MeromorphicNFAt + nonvanishing ⟹ order 0 ⟹ analytic). Mathlib-only. Out of defaultTargets.
[[lean_lib]]
name = "DlvpBlaschkeAnalytic"

# PHASE 4 dVP frontier, BLASCHKE density discharge: codiscrete set dense within the sphere
# (preperfect sphere via isConnected_sphere). Mathlib-only. Out of defaultTargets.
[[lean_lib]]
name = "DlvpSphereDense"

# PHASE 4 dVP frontier, BLASCHKE step 3a: ‖f‖=‖g‖ on sphere for a CanonicalDecomp (composes
# Blaschke modulus-1 + density + sphere-identity). Out of defaultTargets.
[[lean_lib]]
name = "DlvpCanonicalNorm"

# PHASE 4 dVP frontier, BLASCHKE step 3b: entire-part bound ‖logDeriv g 0‖ ≤ 2M'/(R-r) for a
# CanonicalDecomp (no AP term). Imports DlvpMaxMod+DlvpCanonicalNorm+DlvpBlaschkeAnalytic. Out of defaultTargets.
[[lean_lib]]
name = "DlvpCanonicalBound"

# PHASE 4 dVP frontier, BLASCHKE item (d) foundation: logDeriv of canonicalFactor
# = -conj w/(R²-conj w z) - 1/(z-w). Mathlib-only. Out of defaultTargets.
[[lean_lib]]
name = "DlvpCanonicalLogDeriv"
