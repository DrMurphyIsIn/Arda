name = "LambdaLineReal"
defaultTargets = ["LambdaLineReal", "XiLineZeros", "WindingCount", "BoxArgPrinciple", "RigorousWinding", "BlaschkeBox", "BoxArgPrincipleZeta", "BoxLocalization", "RHInBoxCore", "RHInBoxAnalytic", "RHInBox", "RHInBox_2d5_3d5_0_100", "RHInBox_1d1000000_999999d1000000_0_100", "ZetaZeroConfinement", "AllZerosUpToHeight", "AllZeros_h100", "RHInBoxBands", "NoZerosInBox_1d1000_999d1000_0_55d16", "NoZerosInBox_0_1d1000_0_55d16", "RHInBox_1d1000000_999999d1000000_100_200", "AllZeros_h200", "DiffractionCore"]

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.32.0"

# The confinement lemma consumes the self-contained effective dVP zero-free region
# `ZeroFreeBridge.riemannZeta_ne_zero_region` (PR #318), which lives in the sibling
# `zero_free_bridge` Lean project. Same mathlib rev, so the path require shares the cache.
[[require]]
name = "ZeroFreeBridge"
path = "../../zero_free_bridge/lean"

[[lean_lib]]
name = "LambdaLineReal"

[[lean_lib]]
name = "XiLineZeros"

[[lean_lib]]
name = "WindingCount"

[[lean_lib]]
name = "BoxArgPrinciple"

[[lean_lib]]
name = "RigorousWinding"

[[lean_lib]]
name = "BlaschkeBox"

[[lean_lib]]
name = "BoxArgPrincipleZeta"

[[lean_lib]]
name = "BoxLocalization"

[[lean_lib]]
name = "RHInBoxCore"

[[lean_lib]]
name = "RHInBoxAnalytic"

[[lean_lib]]
name = "RHInBox"

# T=100 milestone: kernel-certified RH-in-box for [2/5,3/5]x[0,100] (29 on-line zeros).
# Emitted by generate.py --height 100 (Task 4 driver). Committed as a permanent milestone.
[[lean_lib]]
name = "RHInBox_2d5_3d5_0_100"

# WIDE-BOX milestone (Task 5): kernel-certified RH-in-box for the confinement band
# [1/10^6, 1-1/10^6]x[0,100] (29 on-line zeros = winding N(100)).  Emitted by
# generate.py --box 1/1000000,999999/1000000,0,100.  This is the box atom the final
# combination theorem AllZeros_h100 composes with ZetaZeroConfinement.
[[lean_lib]]
name = "RHInBox_1d1000000_999999d1000000_0_100"

# CONFINEMENT (dVP + FE): every nontrivial zeta zero up to height T lies in the band [a, 1-a].
# Consumes the self-contained effective dVP zero-free region (PR #318, ZeroFreeBridge require above).
[[lean_lib]]
name = "ZetaZeroConfinement"

# COMBINATION (kernel): composes ZetaZeroConfinement + RHInBox into the final theorem:
# all nontrivial zeta zeros up to height T lie on Re = 1/2.
[[lean_lib]]
name = "AllZerosUpToHeight"

# CONCRETE T=100 CERTIFICATE (Task 5): instantiates the combination at a=1/10^6, T=100.
# Composes ZetaZeroConfinement.zero_in_band (band [1/10^6,1-1/10^6]) with the wide-box
# atom RHInBox_1d1000000_999999d1000000_0_100 (box-localization).  Headline result:
# ALL nontrivial zeta zeros up to height 100 lie on Re = 1/2.  conjecture1_proved = False.
[[lean_lib]]
name = "AllZeros_h100"

# BAND-ADDITIVITY (height-tiling) + WIDTH-FOLD reduction: conclusion-level glue on top of
# RHInBox.rh_in_box_of_certificate.  rh_box_of_bands composes n cheap per-band certificates into
# one tall box (the compute lever for high boxes); rh_full_box_of_left_half halves the region via
# the critical-line reflection (ZeroFreeBridge.riemannZeta_reflect_line_eq_zero, PR #320 family).
[[lean_lib]]
name = "RHInBoxBands"

# EMPTY-BAND (zero-free) certificate: the box [1/1000, 999/1000] x [0, 55/16] has boundary
# winding N = 0, so it contains no zeta zero.  Emitted by driver_empty_band.run_empty_band;
# instantiates RHInBoxAnalytic.zeta_count_eq_winding_generic at N = 0 (empty divisor support).
# This is the box-driver half of the 55/16 no-low-zeros residual closure (the dVP-symmetry
# session's no_low_zeros_of_empty_band composes it with the Mathlib edge facts).
[[lean_lib]]
name = "NoZerosInBox_1d1000_999d1000_0_55d16"

# LEFT-SLIVER (zero-free) certificate: the sliver [0, 1/1000] x [0, 55/16] has boundary
# winding N = 0.  Together with the band cert above this clears [0, 999/1000] x [0, 55/16];
# the reflection rho -> 1 - conj(rho) (Klein four-group, PR #320) carries the remaining right
# sliver (999/1000, 1) to this left sliver, completing the full-strip clearing that
# no_low_zeros_of_strip_clear needs (a zero-free box makes no critical-line claim, so the
# sliver need not straddle Re = 1/2).
[[lean_lib]]
name = "NoZerosInBox_0_1d1000_0_55d16"

# BAND 2 for the T=200 certificate: [1/10^6, 1-1/10^6] x [100, 200], winding N = 50
# (N(200) - N(100) = 79 - 29).  Emitted by generate.py --box 1/1000000,999999/1000000,100,200
# with the O(N) list-based construction (#338).
[[lean_lib]]
name = "RHInBox_1d1000000_999999d1000000_100_200"

# CONCRETE T=200 CERTIFICATE: first band-stacked height milestone.  Glues the [0,100] and
# [100,200] band atoms via RHInBoxBands.rh_box_two_bands, composes with zero_in_band at
# a=1/10^6, T=200 (effective-rate edge haC_200 in-kernel).  conjecture1_proved = False.
[[lean_lib]]
name = "AllZeros_h200"

# DIFFRACTION CORE (Dyson/quasicrystal axis, QC2 brick 1): weighted rectangle pole formula
# Bd(g·(·-ρ)⁻¹) = 2πi·g(ρ) — the single-Bragg-peak mechanism (dslope removable-singularity
# split + rect Goursat + counting winding).  See UNIFORM_TRANSITION_CERTIFICATE §4/§6.
[[lean_lib]]
name = "DiffractionCore"
