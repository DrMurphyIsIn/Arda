# The project manifest: every family the repo freezes, in one place.
# `telperion verify` runs each entry's regeneration diff; any examples/*/
# generate.py NOT listed here fails verification — a family cannot silently
# fall out of the drift-check net (the 2026-08-15 re-freeze incident class).

[[check]]
name = "toy_box"
script = "examples/toy_box/generate.py"
group = "quick"

[[check]]
name = "r47_cells"
script = "examples/r47_cells/generate.py"
group = "heavy"    # ~6-12 min re-certification; runs in the casestudy CI job

[[check]]
name = "r7_starofhubs"
script = "examples/r7_starofhubs/generate.py"
group = "heavy"    # 972 star-of-hubs certs, 9 shards (frozen 0.1.3)

[[check]]
name = "g1_floors"
script = "examples/g1_floors/generate.py"
group = "quick"    # 3084 floor theorems + 176 kernel facts; ~2 s regeneration

[[check]]
name = "shed_lemmas"
script = "examples/shed_lemmas/generate.py"
group = "quick"    # 55 shedding re-derivations; ~3 s

[[check]]
name = "legs_certs"
script = "examples/legs_certs/generate.py"
group = "quick"    # 48 kernel facts incl. the 726-digit bignum; ~0.2 s

[[check]]
name = "interp_lemma"
script = "examples/interp_lemma/generate.py"
group = "quick"    # I1/I2 symbolic identities + 212 light-top facts; ~0.3 s

[[check]]
name = "g34_sweep"
script = "examples/g34_sweep/generate.py"
group = "heavy"    # 442,800 exact cases + fingerprint; ~2.5 min

[[check]]
name = "g34_twohub"
script = "examples/g34_twohub/generate.py"
group = "heavy"    # 480 tails + 4176 small-donor witness certs (frozen 0.1.3)

[[check]]
name = "hunt_sweep"
script = "examples/proof_audit/hunt_sweep.py"
group = "heavy"    # ~5 min: exact adversarial hunts over every family
