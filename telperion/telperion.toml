# The project manifest: every family the repo freezes, in one place.
# `telperion verify` runs each entry's regeneration diff; any examples/*/
# generate.py NOT listed here fails verification — a family cannot silently
# fall out of the drift-check net (the 2026-08-15 re-freeze incident class).
#
# Groups: quick (seconds, every push via telperion-test) | heavy (r47 ~10 min,
# every push via telperion-casestudy) | audit (heavy re-certifications +
# adversarial hunt, telperion-audit on dispatch/weekly/own-path-change — kept
# off the per-push path so a trivial change does not pay ~30 min of re-verify).

