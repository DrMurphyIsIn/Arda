name: proof-lean

on:
  push:
    paths:
      - "proof/formalization/**"
      - ".github/workflows/proof-lean.yml"
  pull_request:
    paths:
      - "proof/formalization/**"
      - ".github/workflows/proof-lean.yml"
  workflow_dispatch:
  # Continuous, independent loop: a daily run on the default branch re-verifies the whole
  # R3Cert/R7Hyps layer (no-sorry) AND refreshes the incremental build cache so it never goes
  # cold (GitHub evicts caches unused for 7 days). Runs on GitHub infra -- no local machine.
  schedule:
    - cron: "17 6 * * *"

jobs:
  lean-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: proof/formalization
    steps:
      - uses: actions/checkout@v4

      - name: Cache elan toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('proof/formalization/lean-toolchain') }}

      - name: Install elan
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch Mathlib olean cache
        run: lake exe cache get

      # Incremental project build cache: restore the most recent prior R3Cert/R7Hyps `.olean`
      # build (same toolchain + deps) so `lake build` only recompiles CHANGED modules, not all
      # ~2575 theorems cold. Rolling key keyed on the RUN ID so EVERY run (push, PR, and the daily
      # schedule) saves a fresh cache -- this refreshes GitHub's 7-day eviction timer, keeping the cache
      # perpetually warm; `restore-keys` restores the most recent prior build (same toolchain + deps) so
      # `lake build` only recompiles CHANGED modules. Toolchain/manifest change forces a full rebuild.
      - name: Cache Lean project build (incremental, self-refreshing)
        uses: actions/cache@v4
        with:
          path: proof/formalization/.lake/build
          key: lean-build-${{ runner.os }}-${{ hashFiles('proof/formalization/lean-toolchain', 'proof/formalization/lake-manifest.json') }}-${{ github.run_id }}
          restore-keys: |
            lean-build-${{ runner.os }}-${{ hashFiles('proof/formalization/lean-toolchain', 'proof/formalization/lake-manifest.json') }}-

      - name: Build (the verification — every R3Cert module compiles, no sorry)
        run: lake build

      - name: Build the R7' hypothesis layers (star-of-hubs cells + class floors)
        run: lake build R7Hyps R3Cert.HypStar R3Cert.HypFloors

      # R47 per-rule certificate leaves (R1 spider / R2 legs / R4 Kelmans corners /
      # R5 tiebreak / R6 deload / root-invariance / collapse-floor profile). NONE of these
      # is root-imported into R3Cert.lean, so `lake build` above never built them -- this
      # step is what CI-verifies the family. Built as SEPARATE targets (not a shared
      # import env): R47R6DeloadCert carries a local `conjecture1_proved` pin in
      # `R3Cert.Step3`, so co-importing it would collide; separate targets sidestep that.
      - name: Build the R47 per-rule certificate leaves
        run: |
          lake build \
            R3Cert.R47R1SpiderCert \
            R3Cert.R47R2LegsCert R3Cert.R47R2Legs34Cert \
            R3Cert.R47R4KelmansCornerCert R3Cert.R47R4KelmansC1Cert \
            R3Cert.R47R4KelmansC2Cert R3Cert.R47R4KelmansC3Cert \
            R3Cert.R47R5TiebreakCert R3Cert.R47R5Tiebreak2Cert \
            R3Cert.R47R6DeloadCert \
            R3Cert.R47RootInvariance \
            R3Cert.BridgeStep4l \
            R3Cert.R47CampaignBrick

      - name: Axiom / sorry scan (informational)
        run: |
          ! grep -rn --include="*.lean" -E "\bsorry\b|\badmit\b|^axiom " R3Cert R3Cert.lean || true
