name: telperion-test

on:
  push:
    paths:
      - "telperion/**"
      - ".github/workflows/telperion-test.yml"
  pull_request:
    paths:
      - "telperion/**"
      - ".github/workflows/telperion-test.yml"
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    # 25, not 15: with collection restored the suite now runs the mahler +
    # 168s ehrhart tests for real, and the slowest matrix cell (py3.12) lands
    # at ~14m47s -- a hair under a 15-min cap and a near-certain flake. 25 gives
    # comfortable headroom without hiding a genuine runaway.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
        sympy: ["sympy==1.12", "sympy"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # cvxpy provides the SDP backend the SOS route (prove_goal Phase 0.1 kind-
      # router) uses to certify interior ties; without it those tests can't run.
      # pytest/numpy are PINNED: the unpinned install began pulling pytest 9.x
      # (a major release), which aborts the run mid-suite with exit 2 and no
      # summary on py3.11-3.13 (the suite itself is green -- 864 passed locally
      # on pytest 8.x). Cap pytest to the supported 8.x line and numpy below the
      # co-bumped 2.5 until the suite is audited for pytest-9 compatibility.
      - run: pip install "${{ matrix.sympy }}" "pytest>=8,<9" networkx "numpy<2.5" cvxpy
      - name: Unit tests
        working-directory: telperion
        # test_bellman_rigidity's two value_function(max_size=14) tests are
        # intractable in CI: max_size=10 already takes ~80s and 14 runs for
        # hours (super-exponential in the tree enumeration). They were added
        # 2026-08-17 but never actually ran here (collection aborted first on a
        # missing networkx import), so this is the first time the suite would
        # reach them. Deselected until the owning proof session shrinks the
        # enumeration size (the same assertions hold at max_size=8, ~4s); the
        # rest of the suite runs in ~4.5 min. See telperion/CHANGELOG.md.
        run: >-
          python -m pytest tests -q
          --deselect tests/test_bellman_rigidity.py::test_value_function_and_sub_hull_gap
          --deselect tests/test_bellman_rigidity.py::test_cramer_rate_positive_below_hull
      - name: Manifest verify, quick group (drift net + byte-stability across sympy versions)
        working-directory: telperion
        run: PYTHONPATH=src python -m telperion.cli verify --group quick
