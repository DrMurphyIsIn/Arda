name: telperion-test

on:
  push:
    paths:
      - "telperion/**"
      - ".github/workflows/telperion-test.yml"
  pull_request:
    paths:
      - "telperion/**"
      - ".github/workflows/telperion-test.yml"
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
        sympy: ["sympy==1.12", "sympy"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install "${{ matrix.sympy }}" pytest networkx
      - name: Unit tests
        working-directory: telperion
        # test_bellman_rigidity's two value_function(max_size=14) tests are
        # intractable in CI: max_size=10 already takes ~80s and 14 runs for
        # hours (super-exponential in the tree enumeration). They were added
        # 2026-08-17 but never actually ran here (collection aborted first on a
        # missing networkx import), so this is the first time the suite would
        # reach them. Deselected until the owning proof session shrinks the
        # enumeration size (the same assertions hold at max_size=8, ~4s); the
        # rest of the suite runs in ~4.5 min. See telperion/CHANGELOG.md.
        run: >-
          python -m pytest tests -q
          --deselect tests/test_bellman_rigidity.py::test_value_function_and_sub_hull_gap
          --deselect tests/test_bellman_rigidity.py::test_cramer_rate_positive_below_hull
      - name: Manifest verify, quick group (drift net + byte-stability across sympy versions)
        working-directory: telperion
        run: PYTHONPATH=src python -m telperion.cli verify --group quick
