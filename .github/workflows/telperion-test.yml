name: telperion-test

on:
  push:
    paths:
      - "telperion/**"
      - ".github/workflows/telperion-test.yml"
  pull_request:
    paths:
      - "telperion/**"
      - ".github/workflows/telperion-test.yml"
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    # 25, not 15: with collection restored the suite now runs the mahler +
    # 168s ehrhart tests for real, and the slowest matrix cell (py3.12) lands
    # at ~14m47s -- a hair under a 15-min cap and a near-certain flake. 25 gives
    # comfortable headroom without hiding a genuine runaway.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
        sympy: ["sympy==1.12", "sympy"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # cvxpy provides the SDP backend the SOS route (prove_goal Phase 0.1 kind-
      # router) uses to certify interior ties; without it those tests can't run.
      # pytest capped to 8.x as version hygiene (9.x is a major bump); this is
      # NOT the cause of the current red -- see the DIAGNOSTIC note below.
      - run: pip install "${{ matrix.sympy }}" "pytest>=8,<9" networkx "numpy<2.5" cvxpy
      - name: Unit tests
        working-directory: telperion
        # DIAGNOSTIC (2026-08-30): the suite aborts on py3.11-3.13 Linux with exit
        # 2 and NO traceback after ~61 tests (~82s) -- a native interpreter crash
        # (segfault/OOM), version-independent, byte-identical on main. It is NOT a
        # test failure and NOT pytest 9 (reproduces under pytest 8.x). The suite is
        # green locally (macOS py3.9/3.14). PYTHONFAULTHANDLER + -v dump the C stack
        # and the last-started test id so the crash can be root-caused.
        env:
          PYTHONFAULTHANDLER: "1"
        # test_bellman_rigidity's two value_function(max_size=14) tests are
        # intractable in CI (super-exponential enumeration) -- deselected.
        run: >-
          python -X faulthandler -m pytest tests -v -s -p no:cacheprovider
          --deselect tests/test_bellman_rigidity.py::test_value_function_and_sub_hull_gap
          --deselect tests/test_bellman_rigidity.py::test_cramer_rate_positive_below_hull
      - name: Manifest verify, quick group (drift net + byte-stability across sympy versions)
        working-directory: telperion
        run: PYTHONPATH=src python -m telperion.cli verify --group quick
