name: proof-verify

on:
  push:
    paths:
      - "proof/verification/**"
      - "proof/verify.py"
      - "proof/requirements.txt"
      - ".github/workflows/proof-verify.yml"
  pull_request:
    paths:
      - "proof/verification/**"
      - "proof/verify.py"
      - "proof/requirements.txt"
      - ".github/workflows/proof-verify.yml"
  workflow_dispatch:
    inputs:
      full:
        description: "Run the full ~20-40 min verify.py (all 15 modules)"
        type: boolean
        default: true
  schedule:
    - cron: "17 6 * * 1" # weekly full verification, Monday 06:17 UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r proof/requirements.txt pytest
      - name: Unit tests (quick set — the 5 long-running certificate tests run in full-verify)
        working-directory: proof
        run: >
          python -m pytest verification/tests -q --durations=10
          --deselect verification/tests/test_lr.py::test_gap_reduction_frontier
          --deselect verification/tests/test_lr.py::test_lemma_proofs_E0_E1_E3_DEC
          --deselect verification/tests/test_lr.py::test_value_function_bellman
          --deselect verification/tests/test_lr.py::test_gap_certification
          --deselect verification/tests/test_lr.py::test_adversary_sweep_jensen_reduction

  full-verify:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r proof/requirements.txt pytest
      - name: Full test suite (including the long-running certificate tests)
        working-directory: proof
        run: python -m pytest verification/tests -q --durations=10
      - name: Full verification harness (every module's run_all; every claim an assert)
        run: python proof/verify.py
