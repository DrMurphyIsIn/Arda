  leakage-dictionary-compiles:
    # PROGRAM MIRRORMERE, ROUTE A item A2b: the leakage dictionary
    # (completely-multiplicative amplitude => zero COMPOSITE Bragg amplitude) as
    # kernel lemmas, plus the certified Davenport-Heilbronn instance b(6) = +1.9364.
    # conjecture1_proved = False.
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install sympy mpmath pytest

      - name: Unit tests (row re-derivation + the two-directional certify refusals)
        working-directory: telperion
        run: |
          PYTHONPATH=src python -m pytest tests/test_emit_leakage_dictionary.py -q

      - name: Regenerate the leakage instances from the family definition
        working-directory: telperion
        run: |
          python examples/leakage_dictionary/generate.py --check

      - name: Cache elan toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('telperion/examples/quasicrystal/lean/lean-toolchain') }}

      - name: Install elan
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch Mathlib olean cache
        working-directory: telperion/examples/quasicrystal/lean
        run: lake exe cache get

      - name: Build the dictionary and the emitted instances
        working-directory: telperion/examples/quasicrystal/lean
        run: |
          # The guard imports the whole branch, so build every default target: a
          # partial build leaves the guard's imports unbuilt and fails with
          # 'unknown module prefix', a false red on a proof that is fine.
          lake build

      - name: Axiom guard (LeakageDictionary + LeakageInstances must be sorry-free and axiom-clean)
        working-directory: telperion/examples/quasicrystal/lean
        shell: bash
        run: |
          set -euo pipefail
          lake env lean AxiomGuardLeakage.lean 2>&1 | tee guard-leakage.txt
          # 47 `#print axioms` anchors in AxiomGuardLeakage.lean as of 2026-09-20.
          # Without a floor, a guard that elaborates to NOTHING passes the checks
          # below, because `! grep -q sorryAx` is satisfied by an empty file.
          n=$(grep -cE "depends on axioms|does not depend on any axioms" guard-leakage.txt || true)
          if [ "$n" -lt "42" ]; then
            echo "::error::guard printed $n axiom lines, expected at least 42 --"
            echo "::error::the guard did not run, or was silently truncated"; exit 1; fi
          if grep -q "sorryAx" guard-leakage.txt; then echo "::error::GUARD FAILED: sorryAx present"; exit 1; fi
          for marker in ofReduceBool ofReduceNat; do
            if grep -q "$marker" guard-leakage.txt; then echo "::error::GUARD FAILED: $marker present"; exit 1; fi
          done
          # The node theorem, its contrapositive instrument, and BOTH controls must print.
          #
          # Each check is ANCHORED on the printed form rather than matching a bare
          # substring.  The substring form was satisfiable by a LONGER name: the
          # enclosure check passed on leak_dh_enclosure_decimal alone, without the
          # enclosure itself ever printing.  Verified on fixtures before landing.
          #
          # LIMITATION, stated rather than left for the next reader to discover: these
          # assert that a NAME printed, never that its STATEMENT is unchanged.  A theorem
          # weakened by an added hypothesis passes every one of them.  What actually
          # guards the statement is the registry's normalized-containment gate at grant
          # time, not this job.
          #
          # The line below used to name composite_bragg_amplitude_zero while calling itself
          # the node-theorem check.  That is a different declaration, so NOTHING verified
          # that the node's own theorem was guarded.  Found by a blind read-back that built
          # the island; the node does print, and the check now says so.  Both names are
          # asserted, since the theory lemma is worth guarding in its own right.
          if ! grep -qE "'Quasicrystal\\.leakage_composite_zero' (depends on axioms|does not depend)" guard-leakage.txt; then echo "::error::GUARD FAILED: the NODE theorem is not printed"; exit 1; fi
          if ! grep -qE "'Quasicrystal\\.composite_bragg_amplitude_zero' (depends on axioms|does not depend)" guard-leakage.txt; then echo "::error::GUARD FAILED: theory lemma not printed"; exit 1; fi
          if ! grep -qE "'Quasicrystal\\.not_completelyMultiplicative_of_composite_leak' (depends on axioms|does not depend)" guard-leakage.txt; then echo "GUARD FAILED: instrument not printed"; exit 1; fi
          if ! grep -qE "'LeakageInstances\\.leak_chi5_composite_vanishes' (depends on axioms|does not depend)" guard-leakage.txt; then echo "GUARD FAILED: positive control not printed"; exit 1; fi
          if ! grep -qE "'LeakageInstances\\.leak_dh_composite_leak_pos' (depends on axioms|does not depend)" guard-leakage.txt; then echo "GUARD FAILED: negative control not printed"; exit 1; fi
          if ! grep -qE "'LeakageInstances\\.leak_dh_enclosure' (depends on axioms|does not depend)" guard-leakage.txt; then echo "GUARD FAILED: certified b(6) enclosure not printed"; exit 1; fi
          if ! grep -qE "'LeakageInstances\\.leak_dh_multiplicativity_is_necessary' (depends on axioms|does not depend)" guard-leakage.txt; then echo "::error::GUARD FAILED: falsification twin not printed"; exit 1; fi
          # Every printed axiom list must be a SUBSET of the three standard axioms.  A
          # blind read-back confirmed all 47 guarded declarations print exactly those
          # three, but nothing was ASSERTING it, so the claim was unenforced.  Join lines
          # before extracting: Lean wraps a long list, and a line-based grep would read the
          # wrapped remainder as a violation.
          if tr "\n" " " < guard-leakage.txt | grep -oE "depends on axioms: \[[^]]*\]" \
               | sed -E "s/depends on axioms: \[|\]//g" | tr "," "\n" | tr -d " " \
               | grep -vE "^$|^propext$|^Classical\.choice$|^Quot\.sound$" ; then
            echo "::error::an axiom outside [propext, Classical.choice, Quot.sound] is listed above"
            exit 1
          fi
          echo "axiom guard: every printed list is a subset of the three standard axioms"
