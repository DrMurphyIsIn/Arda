      - name: Build the dVP zero-extraction rung (kernel verification)
        working-directory: telperion/examples/zero_free_bridge/lean
        run: lake build DlvpZeroSum

  # dVP frontier rungs 3-5: pole bound (hpole), double bound (htwo), and the REGION
  # ASSEMBLY (region ⟸ the three Borel-Caratheodory inputs; sole remaining core = BC-SUM).
  rh-dlvp-pole:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Cache elan toolchain
        uses: actions/cache@v4
        with:
