      - name: Cache elan toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('telperion/examples/bg_hi_degree_tail/lean/lean-toolchain') }}

      - name: Install elan
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch Mathlib olean cache
        working-directory: telperion/examples/bg_hi_degree_tail/lean
        run: lake exe cache get

      - name: Build the emitted Lean (the actual verification — d>=7 envelope tail V(c)<V(cherry) via ell<=0)
        working-directory: telperion/examples/bg_hi_degree_tail/lean
        run: lake build
