  satake-degree-two-compiles:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # zoo.py imports the telperion package, which imports certify, which needs sympy.
      # Without this the zoo CRASHED on ModuleNotFoundError and the gate below reported
      # it as "the clause no longer rejects L(s,Delta)" -- a missing dependency read out
      # as a mathematical result.  That is the same shape as finding 8 of the missions
      # audit: a check counting evidence that does not exist.
      # python-flint (2026-09-23): zoo.py's zeta row calls telperion.arb_platt.zeta_nzeros,
      # which loads libflint's Platt entry points (acb_dirichlet_zeta_nzeros,
      # acb_dirichlet_hardy_z_zeros, acb_dirichlet_platt_scaled_lambda_vec, ...) by ctypes.
      # Without the wheel every main run since the job was added died with "libflint with
      # Platt machinery not found". The manylinux wheel of 0.9.0 bundles FLINT 3
      # (libflint.so.24) under python_flint.libs/, which arb_platt._find_libflint searches,
      # and every symbol it needs is exported there. Same pin as the other Platt jobs here.
      - run: pip install sympy mpmath "python-flint==0.9.0"

      # The install must WORK: if arb_platt cannot find the Platt machinery, fail here with
      # a tooling error rather than let the zoo crash and read as a mathematical result.
      - name: Platt machinery present (arb_platt must load libflint's Platt entry points)
        working-directory: telperion
        shell: bash
        run: |
          set -uo pipefail
          PYTHONPATH=src python - <<'PY'
          import sys
          from telperion import arb_platt as a
          print("libflint:", a._LIB_PATH)
          print("PLATT_AVAILABLE:", a.PLATT_AVAILABLE, "PLATT_GRID_AVAILABLE:", a.PLATT_GRID_AVAILABLE)
          if not a.PLATT_AVAILABLE:
              print("::error::python-flint is installed but arb_platt cannot load libflint's Platt "
                    "machinery on this runner (TOOLING failure, not a mathematical one). Check the "
                    "wheel's python_flint.libs/ and arb_platt._find_libflint.")
              sys.exit(1)
          lo, hi = a.zeta_nzeros(100, prec=128)
          print("N(100) enclosure:", lo, hi)
          assert lo == hi == 29, (lo, hi)
          PY

      # zoo.py had NO CI coverage before this job.  It runs the falsification
      # matrix, whose governance rails include the A1b assertions: Delta must look
      # like zeta/L(chi) on every non-arithmetic clause and be killed by the
      # arithmetic one alone.  It also exercises the anti-phantom tau refusal.
      - name: Falsification matrix (zoo) -- A1b governance rails must hold
        working-directory: telperion/examples/quasicrystal
        shell: bash
        run: |
          set -uo pipefail
          # Run FIRST and check the exit status, so a crash is reported as a crash.
          # The gate below may only speak about mathematics once the script has
          # actually produced a verdict.
          if ! python zoo.py > zoo.txt 2>&1; then
            cat zoo.txt
            echo "::error::zoo.py did not run to completion -- this is a TOOLING failure,"
            echo "::error::not a mathematical one.  Do NOT read it as the clause changing."
            exit 1
          fi
          cat zoo.txt
          grep -q "A1b FALSIFICATION CONFIRMED" zoo.txt || {
            echo "::error::A1b GATE FAILED: the clause no longer rejects L(s,Delta)."
            echo "If the clause was repaired deliberately, update the roadmap A1b row"
            echo "and the assertions in zoo.py _run_asserts."; exit 1; }
          grep -q "GOVERNANCE: all required outcomes hold" zoo.txt || {
            echo "::error::GOVERNANCE RAIL BROKEN"; exit 1; }
          grep -q "DEDEKIND CONTROL CONFIRMED" zoo.txt || {
            echo "::error::DEDEKIND GATE FAILED: zeta_K = zeta * L(chi_-20) is no longer"
            echo "rejected by (B-mult-twisted) -- the product-closure control regressed."; exit 1; }

      - name: Anti-phantom refusal (a corrupted eta exponent must REFUSE, not report)
        working-directory: telperion/examples/quasicrystal
        run: python antiphantom_probe.py

      - name: Cache elan toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('telperion/examples/quasicrystal/lean/lean-toolchain') }}

      - name: Install elan
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch Mathlib olean cache
        working-directory: telperion/examples/quasicrystal/lean
        run: lake exe cache get

      - name: Build the island (the axiom guard imports all of it)
        working-directory: telperion/examples/quasicrystal/lean
        run: lake build

      # A blind read-back found this step asserted LESS than the node claimed.  It grepped
      # only for the absence of sorryAx and ofReduceBool, so "axiom-clean [propext,
      # Classical.choice, Quot.sound]" was an UNENFORCED claim, and for the decide-proved
      # tau theorems it is not even the right claim: those print the EMPTY axiom set, a
      # SUBSET of the standard three.  The correct rule is therefore subset, not equality,
      # and it is now enforced rather than asserted.  `pipefail` is set because `tee`
      # otherwise masks lean's own exit code.
      - name: Axiom guard (A1b falsification must be sorry-free and axiom-clean)
        working-directory: telperion/examples/quasicrystal/lean
        shell: bash
        run: |
          set -euo pipefail
          lake env lean AxiomGuardQC.lean 2>&1 | tee guard.txt
          if grep -q "sorryAx" guard.txt; then echo "::error::GUARD FAILED: sorryAx present"; exit 1; fi
          if grep -q "ofReduceBool" guard.txt; then echo "::error::GUARD FAILED: native_decide"; exit 1; fi
          for t in scalarGenerated_powerSum_iff unitary_deg2_not_scalarGenerated \
                   delta_satakeDet_two delta_rejected_by_B_mult_twisted \
                   delta_rejected_nonvacuous tau_hecke_p2 tau_mult_six \
                   dedekind_split_rejected dedekind_inert_rejected \
                   scalarGenerated_not_closed_under_product chi_m20_three chi_m20_eleven \
                   dedekind_at_three_rejected dedekind_at_eleven_rejected; do
            grep -q "SatakeDegreeTwo.$t" guard.txt || { echo "::error::GUARD FAILED: $t not printed"; exit 1; }
          done
          # Every printed axiom list must be a SUBSET of the three standard axioms.
          # Lean wraps a long list across lines, so join first, then extract each complete
          # group; a line-based grep reads the wrapped remainder as a violation.
          if tr "\n" " " < guard.txt | grep -oE "depends on axioms: \[[^]]*\]" \
               | sed -E "s/depends on axioms: \[|\]//g" | tr "," "\n" | tr -d " " \
               | grep -vE "^$|^propext$|^Classical\.choice$|^Quot\.sound$" ; then
            echo "::error::an axiom outside [propext, Classical.choice, Quot.sound] is listed above"
            exit 1
          fi
          echo "axiom guard: every printed list is a subset of the three standard axioms"

      - name: Anti-triviality gate (every trivial-close probe MUST refuse)
        working-directory: telperion/examples/quasicrystal/lean
        run: |
          if lake env lean ProbeSatake.lean > probes.txt 2>&1; then
            cat probes.txt
            echo "ANTI-TRIVIALITY GATE FAILED: a rfl/simp/decide probe compiled."
            echo "A trivially-closable statement is a wrong statement."
            exit 1
          fi
          n=$(grep -cE '^ProbeSatake\.lean:[0-9]+:[0-9]+: error' probes.txt)
          if [ "$n" -ne 14 ]; then
            cat probes.txt
            echo "PROBE DRIFT: $n trivial-close refusals, expected 14"; exit 1
          fi
          echo "anti-triviality gate OK: 14/14 trivial-close probes refused"

  mission-statements-compile:
    # Design invariant (MISSIONS_DESIGN_2026-09-11 section 2): "CI builds each
    # statement package: a statement that does not elaborate cannot enter the
    # graph."  This job closes the gap for ALL four campaigns (bg/rh predate it
    # too).  `by sorry` bodies are expected (statements, not proofs) -- lake
    # emits warnings, not errors; the gate is elaboration.
    strategy:
      fail-fast: false
      matrix:
        campaign: [bg, rh, anduril, mirrormere]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Cache elan toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles(format('telperion/missions/{0}/lean/lean-toolchain', matrix.campaign)) }}
