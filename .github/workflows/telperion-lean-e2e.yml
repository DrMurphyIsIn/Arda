  # MILESTONE: first kernel-verified on-line nontrivial-zero count for the Riemann zeta function.
  # Certifies N >= 5 zeros of Lambda (= nontrivial zeros of zeta) on Re s = 1/2 in [10, 35],
  # matching the 5 known zeros t ~ 14.1347, 21.0220, 25.0109, 30.4249, 32.9351.
  # Axioms: {propext, Classical.choice, Quot.sound} -- no sorryAx.
  # conjecture1_proved = False: this is a lower bound via sign changes, not a proof of RH.

  # ============================================================================
  # CONSOLIDATED RH SUITES (2026-09-09): the ~76 per-module zero_free_bridge and
  # zeta_zero_localization jobs each performed checkout + elan + Mathlib cache
  # fetch to build ~1 module (153 cache fetches per run).  Consolidated into TWO
  # suite jobs -- one cache fetch each, `lake build` over the packages' full
  # defaultTargets, then the axiom guards (which subsume per-theorem coverage:
  # every guarded anchor elaborates kernel-clean or the job fails).
  # ============================================================================
  zero-free-bridge-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Cache elan toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('telperion/examples/zero_free_bridge/lean/lean-toolchain') }}
      - name: Install elan
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch Mathlib olean cache (ONCE for the whole package)
        working-directory: telperion/examples/zero_free_bridge/lean
        run: lake exe cache get
      - name: Build ALL zero_free_bridge libraries
        working-directory: telperion/examples/zero_free_bridge/lean
        run: lake build
      - name: Axiom guards (RH + dVP + Polylog) -- fail on sorryAx or elaboration error
        working-directory: telperion/examples/zero_free_bridge/lean
        run: |
          # This loop already catches an elaboration error, which the two-line guards on
          # other islands did not.  What it did NOT do is assert the axiom SET, or notice
          # a guard that printed nothing at all.  Both are added.
          # AxiomGuardPolylog added by closure-run audit C1 (2026-09-22): it existed, ZeroFreePolylog
          # is in defaultTargets, and no workflow ran it.
          for G in AxiomGuardRH.lean AxiomGuardDlvp.lean AxiomGuardPolylog.lean; do
            out="$(lake env lean $G 2>&1 || true)"
            echo "$out"
            echo "$out" > "${G%.lean}.out"
            if echo "$out" | grep -q 'sorryAx'; then echo "::error::$G depends on sorry"; exit 1; fi
            if echo "$out" | grep -qE 'error:'; then echo "::error::$G did not elaborate cleanly"; exit 1; fi
            n=$(echo "$out" | grep -cE "depends on axioms|does not depend on any axioms" || true)
            if [ "$n" -lt "1" ]; then echo "::error::$G printed no axiom lines at all"; exit 1; fi
            if echo "$out" | tr "\n" " " | grep -oE "depends on axioms: \[[^]]*\]" \
                 | sed -E "s/depends on axioms: \[|\]//g" | tr "," "\n" | tr -d " " \
                 | grep -vE "^$|^propext$|^Classical\.choice$|^Quot\.sound$" ; then
              echo "::error::$G lists an axiom outside the three standard ones"; exit 1; fi
          done
          echo "OK: all guarded theorems kernel-clean."
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Registry-anchored coverage (closure run 2026-09-22): every PROVED registry node whose
      # artifact lives on this island must be printed clean by one of the guards above.
      - name: Registry anchors (every proved zero_free_bridge node is printed clean)
        working-directory: telperion/examples/zero_free_bridge/lean
        run: >-
          python ../../../scripts/guard_anchors.py --island zero_free_bridge
          AxiomGuardRH.out AxiomGuardDlvp.out AxiomGuardPolylog.out
  # B2 ladder suite (replaces the monolith `lake build` that hit E2BIG at ~16k targets).
  # Builds zzl_core + ZeroFreeBridge + zzl_aux (height-100 island, Bragg, zoo; the 669 legacy
  # RHInBox_* boxes live in zzl_legacy_boxes and run weekly, see telperion-legacy-boxes.yml) and then the
  # 25k-height block packages in ascending order up to H_CI, running the axiom battery on
  # each block-top capstone.  Green == every `all_nontrivial_zeros_up_to_height_<top>_of_bands`
  # up to H_CI compiles with axioms exactly [propext, Classical.choice, Quot.sound], 0 sorryAx.
  # H_CI is a policy dial (telperion/docs/B2_MAIN_CI.md): the climb runs hotter than CI;
  # the paper cites H_CI, campaign_state tracks H.  conjecture1_proved = False.
  zeta-ladder-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      H_CI: "50000"
    steps:
      - uses: actions/checkout@v4
      - name: Cache elan toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('telperion/examples/zeta_zero_localization/lean/lean-toolchain') }}
      - name: Install elan
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Wire the sharded packages to one shared deps dir (B2 layout; .lake is gitignored)
        working-directory: telperion/examples/zeta_zero_localization/lean
        run: |
          mkdir -p .lake/packages
          for d in zzl_core zzl_aux ZetaBands_h*; do
            mkdir -p "$d/.lake" && ln -sfn ../../.lake/packages "$d/.lake/packages"
          done
          mkdir -p ../../zero_free_bridge/lean/.lake
          ln -sfn ../../../zeta_zero_localization/lean/.lake/packages ../../zero_free_bridge/lean/.lake/packages
      - name: Fetch Mathlib olean cache (ONCE, into the shared deps dir)
        working-directory: telperion/examples/zeta_zero_localization/lean/zzl_core
        run: lake exe cache get
      - name: Build zzl_core (16 height-independent modules) + ZeroFreeBridge
        working-directory: telperion/examples/zeta_zero_localization/lean/zzl_core
        run: lake build
      - name: Build zzl_aux (height-100 island, Bragg family, zoo, R2Rigidity) + its guards
        working-directory: telperion/examples/zeta_zero_localization/lean/zzl_aux
        shell: bash
        run: |
          set -euo pipefail
          lake build
          # zzl_aux owns the proof artifacts of three MIRRORMERE nodes -- R2Rigidity
          # (MM_offline_pairs_le_defect, the campaign's publishable rung), BraggDefect
          # (MM_bragg_defect_witness) and RecurrenceDeficit (MM_recurrence_deficit_eq_excess).
          # This guard step used to check only for `sorryAx` and `error:`, which is strictly
          # weaker than every other island's guard: a theorem resting on a self-supplied
          # `axiom`, or on any Mathlib axiom beyond the standard three, printed a clean-looking
          # line and passed.  It now asserts the EXACT axiom set, counts the anchors so a
          # silently-truncated guard cannot pass as a green one, and joins wrapped lines first
          # (Lean wraps a long axiom list, and a line-based grep then reads a truncated list
          # as an unexpected axiom -- a false positive that cost a CI round on #562).
          declare -A MIN_ANCHORS=( [AxiomGuardBragg]=16 [AxiomGuardDefect]=21 [AxiomGuardZoo]=5 )
          for g in AxiomGuardBragg AxiomGuardDefect AxiomGuardZoo; do
            [ -f "../$g.lean" ] || { echo "::error::$g.lean is missing"; exit 1; }
            echo "== $g"
            lake env lean "../$g.lean" 2>&1 | tee "$g.out"
            if grep -qE 'error:' "$g.out"; then echo "::error::$g did not elaborate cleanly"; exit 1; fi
            if grep -q 'sorryAx' "$g.out"; then echo "::error::$g: a guarded theorem depends on sorry"; exit 1; fi
            n=$(grep -cE "depends on axioms|does not depend on any axioms" "$g.out" || true)
            if [ "$n" -lt "${MIN_ANCHORS[$g]}" ]; then
              echo "::error::$g printed $n axiom lines, expected at least ${MIN_ANCHORS[$g]} -- the guard did not run or was silently truncated"; exit 1; fi
            if tr "\n" " " < "$g.out" | grep -oE "depends on axioms: \[[^]]*\]" | tr -s " " \
                 | grep -vq "^depends on axioms: \[propext, Classical.choice, Quot.sound\]$"; then
              echo "::error::$g: unexpected axiom beyond [propext, Classical.choice, Quot.sound]"
              tr "\n" " " < "$g.out" | grep -oE "depends on axioms: \[[^]]*\]" | tr -s " " \
                 | grep -v "^depends on axioms: \[propext, Classical.choice, Quot.sound\]$"
              exit 1; fi
          done
      - name: Build the band ladder block-by-block up to H_CI (strict chain; Guard_h<top> is a default target)
        working-directory: telperion/examples/zeta_zero_localization/lean
        run: |
          set -e
          # Each block package's defaultTargets include Guard_h<top>: a generated module whose
          # `#guard_msgs (whitespace := lax) in #print axioms <block-top capstone>` FAILS the build
          # on any axiom set other than [propext, Classical.choice, Quot.sound] (or on sorryAx).
          # So a green `lake build` IS the axiom battery -- no `lake env lean` (which could not
          # spawn lean at block depth 2 on a hosted runner, #552 run, even after the block built).
          for d in $(ls -d ZetaBands_h*/ | sed 's#/##' | sort -t h -k2 -n); do
            top=${d#ZetaBands_h}
            if [ "$top" -gt "$H_CI" ]; then echo "skip $d (above H_CI=$H_CI)"; continue; fi
            grep -q "\"Guard_h$top\"" "$d/lakefile.toml" || { echo "::error::$d has no Guard_h$top target"; exit 1; }
            echo "::group::build $d (+ Guard_h$top)"
            t0=$(date +%s)
            ( cd "$d" && lake build )
            echo "$d built in $(( $(date +%s) - t0 ))s (guard passed: Guard_h$top elaborated)"
            echo "::endgroup::"
            rm -rf "$d/.lake/build/ir"
          done
          echo "OK: ladder CI-verified to H_CI=$H_CI (kernel-clean, 3 standard axioms, via Guard_h<top> modules)."
  weil-form-enclosure-compiles:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install sympy pytest python-flint

      # Regenerates the E8 Weil-pairing enclosures from scratch with Arb (archimedean
      # quadrature to |r| <= 1024 plus a 5-fold integration-by-parts tail) and checks the
      # frozen Lean matches byte-for-byte; also gates the WeilExplicit vocabulary mirror
      # against the PROVED node in examples/rvm_bridge/lean/E6Bridge4.lean.  ~4 min.
      - name: Regenerate the Weil-form ladder (enclose -> certify -> emit) and check it matches on-disk
        working-directory: telperion
        run: |
          python examples/weil_form_enclosure/generate.py --check

      - name: Cache elan toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('telperion/examples/weil_form_enclosure/lean/lean-toolchain') }}

      - name: Install elan
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch Mathlib olean cache
        working-directory: telperion/examples/weil_form_enclosure/lean
        run: lake exe cache get

      - name: Build the vocabulary mirror and the emitted ladder (the actual verification)
        working-directory: telperion/examples/weil_form_enclosure/lean
        run: lake build

      - name: Axiom guard (fails on sorryAx anywhere in the emitted theorems)
        working-directory: telperion/examples/weil_form_enclosure/lean
        shell: bash
        run: |
          set -euo pipefail
          lake env lean AxiomGuardWeilForm.lean 2>&1 | tee axioms.out
          # 6 `#print axioms` anchors in AxiomGuardWeilForm.lean as of 2026-09-20.
          # Without a floor, a guard that elaborates to NOTHING passes the checks
          # below, because `! grep -q sorryAx` is satisfied by an empty file.
          n=$(grep -cE "depends on axioms|does not depend on any axioms" axioms.out || true)
          if [ "$n" -lt "5" ]; then
            echo "::error::guard printed $n axiom lines, expected at least 5 --"
            echo "::error::the guard did not run, or was silently truncated"; exit 1; fi
          ! grep -q "sorryAx" axioms.out
          # Every printed axiom list must be a SUBSET of the three standard axioms.
          # Join lines first: Lean WRAPS a long list, and a line-based grep would read
          # the wrapped remainder as a violation.
          if tr "\n" " " < axioms.out | grep -oE "depends on axioms: \[[^]]*\]" \
               | sed -E "s/depends on axioms: \[|\]//g" | tr "," "\n" | tr -d " " \
               | grep -vE "^$|^propext$|^Classical\.choice$|^Quot\.sound$" ; then
            echo "::error::an axiom outside [propext, Classical.choice, Quot.sound] is listed above"
            exit 1
          fi

  wall-analysis-compiles:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Cache elan toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('telperion/examples/wall_barrier/lean/lean-toolchain') }}

