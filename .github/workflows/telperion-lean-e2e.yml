  # RH kernel tier (the AXLE-suite negative-control closing the loop): elaborate the
  # forged FALSE tangent bound and the TRUE controls against the built Mathlib env and
  # assert the KERNEL rejects the forgery while the true atoms compile clean. This is
  # the tier gated OFF locally (SoC hazard); CI is where it runs.
  dvp-atoms-compiles:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install sympy pytest
      - name: Regenerate the dVP-atom Lean from the emitters (certify -> emit -> check)
        working-directory: telperion
        run: python examples/dvp_atoms/generate.py --check
      - name: Cache elan toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('telperion/examples/dvp_atoms/lean/lean-toolchain') }}
      - name: Install elan
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch Mathlib olean cache
        working-directory: telperion/examples/dvp_atoms/lean
        run: lake exe cache get
      - name: Build the emitted Lean (the actual verification — dVP-atom certificates)
        working-directory: telperion/examples/dvp_atoms/lean
        run: lake build BCSplit JensenZeroCount SphereBound

  # dVP frontier obligation (i) core: the log-derivative partial-fraction split (Herglotz
  # sum + entire part) — logDeriv_sub_zpow / logDeriv_prod_sub_zpow / herglotz_split.
