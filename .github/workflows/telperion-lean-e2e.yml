          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch Mathlib olean cache
        working-directory: telperion/examples/zero_free_bridge/lean
        run: lake exe cache get

      - name: Build the zero-free region core estimate (Phase 4 core)
        working-directory: telperion/examples/zero_free_bridge/lean
        run: lake build ZeroFreeRegion

  # Compile the DRAFTED Borel-Caratheodory theorem (its own lakefile/toolchain). Sorry-free, 398 lines,
