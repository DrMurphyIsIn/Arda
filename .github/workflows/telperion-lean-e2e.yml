      - name: Install elan
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch Mathlib olean cache
        working-directory: telperion/examples/zero_free_bridge/lean
        run: lake exe cache get

      - name: Build the (R1) Abel-summation discharge
        working-directory: telperion/examples/zero_free_bridge/lean
        run: lake build StripReprR1

  # Assemble the UNCONDITIONAL strip representation `zeta_fract_repr` from R1+R2+R3 via
  # `zeta_fract_repr_of`. Imports all three R-files; own job so its verdict is isolated.
  strip-repr-assembled-compiles:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Cache elan toolchain
        uses: actions/cache@v4
        with:
