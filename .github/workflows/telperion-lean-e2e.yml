        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('telperion/examples/zero_free_bridge/lean/lean-toolchain') }}

      - name: Install elan
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch Mathlib olean cache
        working-directory: telperion/examples/zero_free_bridge/lean
        run: lake exe cache get

      - name: Build the region modules (define the exported theorems)
        working-directory: telperion/examples/zero_free_bridge/lean
        run: lake build ZetaLogBound ZeroFreePolylog ZeroFreeElementary

      - name: Run the RH corpus audit (dependency graph + region-strength gate)
        working-directory: telperion
        env:
          RH_AXLE_RUN_LEAN: "1"
          PYTHONPATH: src
        run: python scratch/rh_corpus_audit.py

  # dVP frontier rung 1: the zero-extraction core of the de la Vallee Poussin `hzero`
  # bound (equal-height evaluation + droppable other-zeros + the Herglotz reduction).
  rh-dlvp-zerosum:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Cache elan toolchain
        uses: actions/cache@v4
