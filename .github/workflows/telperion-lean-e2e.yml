        working-directory: telperion/examples/wall_barrier/lean
        shell: bash
        run: |
          set -euo pipefail
          lake exe cache get
          lake build
          : > out.txt
          for m in WallBarrierAM FEUniformBarrierAM; do lake env lean "$m.lean" 2>&1 | tee -a out.txt; done
          n=$(grep -c "depends on axioms" out.txt || true)
          if [ "$n" -lt "11" ]; then echo "::error::printed $n axiom lines, expected >= 11"; exit 1; fi
          if grep -q "sorryAx" out.txt; then echo "::error::sorryAx present"; exit 1; fi
          if grep -E "depends on axioms" out.txt | grep -vq "\[propext, Classical.choice, Quot.sound\]"; then
            echo "::error::unexpected axiom"; grep -E "depends on axioms" out.txt | grep -v "\[propext, Classical.choice, Quot.sound\]"; exit 1; fi

      - name: Build + axiom-guard wall_adversary (the refutation)
        working-directory: telperion/examples/wall_adversary/lean
        shell: bash
        run: |
          set -euo pipefail
          lake exe cache get
          lake build
          lake env lean BarrierScopeXR.lean 2>&1 | tee out.txt
          n=$(grep -c "depends on axioms" out.txt || true)
          if [ "$n" -lt "8" ]; then echo "::error::printed $n axiom lines, expected >= 8"; exit 1; fi
          if grep -q "sorryAx" out.txt; then echo "::error::sorryAx present"; exit 1; fi
          if grep -E "depends on axioms" out.txt | grep -vq "\[propext, Classical.choice, Quot.sound\]"; then
            echo "::error::unexpected axiom"; grep -E "depends on axioms" out.txt | grep -v "\[propext, Classical.choice, Quot.sound\]"; exit 1; fi

  rvm-bridge-compiles:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The drift check imports the telperion package (statement-port matching), which pulls
      # sympy. Without this the step dies with ModuleNotFoundError before it checks anything --
      # a drift check that cannot start is a drift check that cannot fail on drift.
      - run: pip install sympy

      - run: pip install sympy

      - name: Drift check (node statements + mirrored defs still match the mirrormere and rh registries)
        working-directory: telperion
        run: |
          python examples/rvm_bridge/generate.py --check

      - name: Cache elan toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('telperion/examples/rvm_bridge/lean/lean-toolchain') }}

      - name: Install elan
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # Zeta23 (anthropics/formal-math, public, Apache-2.0; ~1.6 MB repo) is cloned by Lake at the
      # pinned commit; Mathlib oleans come from the cache through that dependency. Zeta23 itself
      # (118 modules) compiles from source: ~2 min on 32 cores locally, expect ~15-25 min on a
      # 4-core hosted runner.
      - name: Fetch Mathlib olean cache (through the Zeta23 dependency)
        working-directory: telperion/examples/rvm_bridge/lean
        run: lake exe cache get

      - name: Build the bridge against the pinned zeta-23-lean (the actual verification)
        working-directory: telperion/examples/rvm_bridge/lean
        run: lake build

      - name: "Axiom guard (45 anchors incl. consumed upstream inputs): exact axiom set, no sorryAx, guard actually ran"
        working-directory: telperion/examples/rvm_bridge/lean
        shell: bash
        run: |
          set -euo pipefail
          lake env lean AxiomGuardRvMBridge.lean 2>&1 | tee axioms.out
          n=$(grep -cE "depends on axioms|does not depend on any axioms" axioms.out || true)
          if [ "$n" -lt "45" ]; then
            echo "::error::axiom guard printed $n axiom lines, expected at least 45 -- the guard did not run or was silently truncated"; exit 1; fi
          if grep -q "sorryAx" axioms.out; then echo "::error::sorryAx present"; exit 1; fi
          # every printed axioms line must be EXACTLY Lean's three standard axioms
          # Lean WRAPS a long axiom list across lines, so a line-based grep sees a truncated
          # list and reports a false positive.  Join lines, then extract each complete
          # "depends on axioms: [...]" group and require it to be exactly the three.
          if tr "\n" " " < axioms.out | grep -oE "depends on axioms: \[[^]]*\]" | tr -s " " \
               | grep -vq "^depends on axioms: \[propext, Classical.choice, Quot.sound\]$"; then
            echo "::error::unexpected axiom beyond [propext, Classical.choice, Quot.sound]"
            tr "\n" " " < axioms.out | grep -oE "depends on axioms: \[[^]]*\]" | tr -s " " \
               | grep -v "^depends on axioms: \[propext, Classical.choice, Quot.sound\]$"
            exit 1; fi

      # The step above asserts a FLOOR of 45 axiom lines, which proves the guard ran but not that it
      # covers the registry (closure-run audit 2026-09-22).  This asserts an exact-clean line for the
      # theorem of EVERY proved registry node whose artifact is on this island (52 as of 2026-09-22),
      # derived from telperion/missions/*/nodes/*.toml and the nodes' statement files.
      - name: Registry anchors (every proved rvm_bridge node is printed clean)
        working-directory: telperion/examples/rvm_bridge/lean
        run: python ../../../scripts/guard_anchors.py --island rvm_bridge axioms.out
