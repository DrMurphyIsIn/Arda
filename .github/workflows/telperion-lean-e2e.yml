  # dVP frontier rung 2 combine: BC-SUM from the log-derivative split + entire-part bound
  # (reduces the analytic core to two Mathlib-backed inputs: Jensen split + BC bound).
  rh-dlvp-bcsum:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Cache elan toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('telperion/examples/zero_free_bridge/lean/lean-toolchain') }}
      - name: Install elan
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch Mathlib olean cache
        working-directory: telperion/examples/zero_free_bridge/lean
        run: lake exe cache get
      - name: Build the dVP BC-SUM combine (kernel verification)
        working-directory: telperion/examples/zero_free_bridge/lean
        run: lake build DlvpBCSum

  # dVP frontier rung 2 analytic core (first ζ ingredients): ζ-on-disk analyticity +
  # non-vanishing + the Jensen zero-count (sum_divisor_le) applied to ζ.
  rh-dlvp-zetadisk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Cache elan toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('telperion/examples/zero_free_bridge/lean/lean-toolchain') }}
      - name: Install elan
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch Mathlib olean cache
        working-directory: telperion/examples/zero_free_bridge/lean
        run: lake exe cache get
      - name: Build the dVP ζ-disk zero-count (kernel verification)
        working-directory: telperion/examples/zero_free_bridge/lean
        run: lake build DlvpZetaDisk

  # dVP-atom certificate shapes (bc_split, jensen_zero_count, sphere_bound): regenerate
  # from the emitters, drift-check, and kernel-verify the emitted Lean.
  dvp-atoms-compiles:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install sympy pytest
      - name: Regenerate the dVP-atom Lean from the emitters (certify -> emit -> check)
        working-directory: telperion
        run: python examples/dvp_atoms/generate.py --check
      - name: Cache elan toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('telperion/examples/dvp_atoms/lean/lean-toolchain') }}
      - name: Install elan
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch Mathlib olean cache
        working-directory: telperion/examples/dvp_atoms/lean
        run: lake exe cache get
      - name: Build the emitted Lean (the actual verification — dVP-atom certificates)
        working-directory: telperion/examples/dvp_atoms/lean
        run: lake build BCSplit JensenZeroCount SphereBound

  # dVP frontier obligation (i) core: the log-derivative partial-fraction split (Herglotz
  # sum + entire part) — logDeriv_sub_zpow / logDeriv_prod_sub_zpow / herglotz_split.
  rh-dlvp-herglotz:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Cache elan toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('telperion/examples/zero_free_bridge/lean/lean-toolchain') }}
      - name: Install elan
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch Mathlib olean cache
        working-directory: telperion/examples/zero_free_bridge/lean
        run: lake exe cache get
      - name: Build the dVP Herglotz split (kernel verification)
        working-directory: telperion/examples/zero_free_bridge/lean
        run: lake build DlvpHerglotz

  # dVP obligation (i) foundations: ζ canonical factorization (extract_zeros_poles on ζ) +
  # entire-part analyticity (logDeriv g analytic where g analytic + nonzero).
  rh-dlvp-entire:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Cache elan toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('telperion/examples/zero_free_bridge/lean/lean-toolchain') }}
      - name: Install elan
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch Mathlib olean cache
        working-directory: telperion/examples/zero_free_bridge/lean
        run: lake exe cache get
      - name: Build the dVP obligation (i) foundations (kernel verification)
        working-directory: telperion/examples/zero_free_bridge/lean
        run: lake build DlvpEntire

  # dVP obligation (i-a') core: germ / identity-principle transfer of a factorization to a
  # pointwise logDeriv equality (logDeriv_congr_nhds / _eqOn_open / _of_analytic).
  rh-dlvp-transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Cache elan toolchain
        uses: actions/cache@v4
