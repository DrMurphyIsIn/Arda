      - name: Build the emitted Lean (the actual verification — Turan log-concavity via box_robust)
        working-directory: telperion/examples/turan_box/lean
        run: lake build
      - name: Fetch Mathlib olean cache
        working-directory: telperion/examples/zero_free_bridge/lean
        run: lake exe cache get
      - name: Build the dVP log-of-finprod wiring (kernel verification)
        working-directory: telperion/examples/zero_free_bridge/lean
        run: lake build DlvpLogProd

  # dVP ζ zero-factor (2) INSTANTIATION: abstract log_norm_prod_diff_le applied to the ζ zero-part
  # finprod (divisor on inner disk) → log‖P c‖ - log‖P z‖ ≤ count·(log R₀ - log(R-R₀)) = AP.
  rh-dlvp-zetazerofactor:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Cache elan toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('telperion/examples/zero_free_bridge/lean/lean-toolchain') }}
      - name: Install elan
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch Mathlib olean cache
        working-directory: telperion/examples/zero_free_bridge/lean
        run: lake exe cache get
      - name: Build the dVP ζ zero-factor instantiation (kernel verification)
        working-directory: telperion/examples/zero_free_bridge/lean
        run: lake build DlvpZetaZeroFactor

  # dVP BLASCHKE correction: finite Blaschke product ‖∏ᶠ canonicalFactor^n‖ = 1 on the sphere
  # (lifts Mathlib's single-factor norm_canonicalFactor_eval_circle_eq_one). Removes the lossy AP term.
  rh-dlvp-blaschke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Cache elan toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('telperion/examples/zero_free_bridge/lean/lean-toolchain') }}
      - name: Install elan
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch Mathlib olean cache
        working-directory: telperion/examples/zero_free_bridge/lean
        run: lake exe cache get
      - name: Build the dVP Blaschke modulus-one product (kernel verification)
        working-directory: telperion/examples/zero_free_bridge/lean
        run: lake build DlvpBlaschke

  # dVP BLASCHKE step 1: pointwise sphere identity ‖f‖=‖g‖ from a codiscrete unit-modulus factor
  # (continuity + density via Set.EqOn.of_subset_closure). The no-AP boundary reduction.
  rh-dlvp-blaschke-sphere:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Cache elan toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('telperion/examples/zero_free_bridge/lean/lean-toolchain') }}
      - name: Install elan
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch Mathlib olean cache
        working-directory: telperion/examples/zero_free_bridge/lean
        run: lake exe cache get
      - name: Build the dVP Blaschke pointwise sphere identity (kernel verification)
        working-directory: telperion/examples/zero_free_bridge/lean
        run: lake build DlvpBlaschkeSphere

  # dVP BLASCHKE step 2: canonical-decomposition part g is analytic + zero-free on ball 0 R
  # (MeromorphicNFAt + nonvanishing ⟹ order 0 ⟹ AnalyticAt).
  rh-dlvp-blaschke-analytic:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Cache elan toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('telperion/examples/zero_free_bridge/lean/lean-toolchain') }}
      - name: Install elan
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch Mathlib olean cache
        working-directory: telperion/examples/zero_free_bridge/lean
        run: lake exe cache get
      - name: Build the dVP Blaschke g-analyticity (kernel verification)
        working-directory: telperion/examples/zero_free_bridge/lean
        run: lake build DlvpBlaschkeAnalytic

  # dVP BLASCHKE density discharge: a codiscrete subset of closedBall is dense within the sphere
  # (preperfect sphere via isConnected_sphere + preperfect_of_nontrivial). Discharges step-1 density.
  rh-dlvp-spheredense:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Cache elan toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('telperion/examples/zero_free_bridge/lean/lean-toolchain') }}
      - name: Install elan
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch Mathlib olean cache
        working-directory: telperion/examples/zero_free_bridge/lean
        run: lake exe cache get
      - name: Build the dVP sphere-density discharge (kernel verification)
        working-directory: telperion/examples/zero_free_bridge/lean
        run: lake build DlvpSphereDense

  # dVP BLASCHKE step 3a: ‖f‖=‖g‖ on the sphere for a CanonicalDecomp (composes Blaschke modulus-1
  # + density discharge + continuity/density sphere-identity). The no-AP boundary identity for ζ.
  rh-dlvp-canonicalnorm:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Cache elan toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('telperion/examples/zero_free_bridge/lean/lean-toolchain') }}
      - name: Install elan
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch Mathlib olean cache
        working-directory: telperion/examples/zero_free_bridge/lean
        run: lake exe cache get
      - name: Build the dVP canonical-decomposition boundary identity (kernel verification)
        working-directory: telperion/examples/zero_free_bridge/lean
        run: lake build DlvpCanonicalNorm

  # dVP BLASCHKE step 3b: entire-part bound ‖logDeriv g 0‖ ≤ 2M'/(R-r) for a CanonicalDecomp,
  # feeding DlvpMaxMod with the no-AP sphere bound (log‖f‖ growth only). Completes item (c).
  rh-dlvp-canonicalbound:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Cache elan toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('telperion/examples/zero_free_bridge/lean/lean-toolchain') }}
      - name: Install elan
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch Mathlib olean cache
        working-directory: telperion/examples/zero_free_bridge/lean
        run: lake exe cache get
      - name: Build the dVP canonical-decomposition entire-part bound (kernel verification)
        working-directory: telperion/examples/zero_free_bridge/lean
        run: lake build DlvpCanonicalBound

  # dVP BLASCHKE item (d) foundation: logDeriv of canonicalFactor = -conj w/(R²-conj w z) - 1/(z-w)
  # (ratio of affine functions via logDeriv_div). The Blaschke Herglotz-term log-derivative.
  rh-dlvp-canonicallogderiv:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Cache elan toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('telperion/examples/zero_free_bridge/lean/lean-toolchain') }}
      - name: Install elan
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch Mathlib olean cache
        working-directory: telperion/examples/zero_free_bridge/lean
        run: lake exe cache get
      - name: Build the dVP canonical-factor log-derivative (kernel verification)
        working-directory: telperion/examples/zero_free_bridge/lean
        run: lake build DlvpCanonicalLogDeriv

  # dVP BLASCHKE item (d1): logDeriv of the finite Blaschke product = Σ (n u)·logDeriv canonicalFactor
  # (finprod → Finset + logDeriv_prod + logDeriv_fun_zpow). Blaschke analog of the Herglotz sum.
  rh-dlvp-blaschke-herglotz:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Cache elan toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('telperion/examples/zero_free_bridge/lean/lean-toolchain') }}
      - name: Install elan
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch Mathlib olean cache
        working-directory: telperion/examples/zero_free_bridge/lean
        run: lake exe cache get
      - name: Build the dVP Blaschke Herglotz sum (kernel verification)
        working-directory: telperion/examples/zero_free_bridge/lean
        run: lake build DlvpBlaschkeHerglotz

  # dVP BLASCHKE item (d2) sub-lemma: Blaschke product analytic away from its zeros
  # (Finset.analyticAt_prod + AnalyticAt.zpow; canonicalFactor analytic off {u}, nonzero away from u).
  rh-dlvp-blaschke-prodanalytic:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Cache elan toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('telperion/examples/zero_free_bridge/lean/lean-toolchain') }}
      - name: Install elan
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch Mathlib olean cache
        working-directory: telperion/examples/zero_free_bridge/lean
        run: lake exe cache get
      - name: Build the dVP Blaschke-product analyticity (kernel verification)
        working-directory: telperion/examples/zero_free_bridge/lean
        run: lake build DlvpBlaschkeProdAnalytic

  # dVP BLASCHKE item (d2): logDeriv split ζ = Σ (canonicalFactor log-derivs) + logDeriv g off zeros
  # (small convex ball avoiding zeros + logDeriv_congr_of_codiscrete + logDeriv_mul + d1).
  rh-dlvp-blaschke-split:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Cache elan toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('telperion/examples/zero_free_bridge/lean/lean-toolchain') }}
      - name: Install elan
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch Mathlib olean cache
        working-directory: telperion/examples/zero_free_bridge/lean
        run: lake exe cache get
      - name: Build the dVP Blaschke log-derivative split (kernel verification)
        working-directory: telperion/examples/zero_free_bridge/lean
        run: lake build DlvpBlaschkeSplit

  # dVP BLASCHKE item (d3): Blaschke correction sum bounded ‖Σ (n u) conj u/(R²-conj u z)‖ ≤
  # (Σ|n u|)/(R-‖z‖) (pole R²/conj u outside disk ⟹ denom ≥ R(R-‖z‖); count × O(1) = O(L)).
  rh-dlvp-correctionbound:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Cache elan toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('telperion/examples/zero_free_bridge/lean/lean-toolchain') }}
      - name: Install elan
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch Mathlib olean cache
        working-directory: telperion/examples/zero_free_bridge/lean
        run: lake exe cache get
      - name: Build the dVP Blaschke correction bound (kernel verification)
        working-directory: telperion/examples/zero_free_bridge/lean
        run: lake build DlvpCorrectionBound

  # dVP BLASCHKE item (d4) core: logDeriv ζ = Herglotz Σ divisor/(z-ρ) + entire part (correction +
  # logDeriv g) in Blaschke form — the ζ'/ζ = Z + E explicit-formula input to the reduction skeleton.
  rh-dlvp-blaschke-splitexpand:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Cache elan toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('telperion/examples/zero_free_bridge/lean/lean-toolchain') }}
      - name: Install elan
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch Mathlib olean cache
        working-directory: telperion/examples/zero_free_bridge/lean
        run: lake exe cache get
      - name: Build the dVP Blaschke explicit-formula expansion (kernel verification)
        working-directory: telperion/examples/zero_free_bridge/lean
        run: lake build DlvpBlaschkeSplitExpand

  # dVP BLASCHKE item (d4) capstone: BC-SUM for the Blaschke split -Re(ζ'/ζ) ≤ AL - Re(Herglotz)
  # (explicit formula d4-core + correction bound d3 + ‖logDeriv g‖ via bc_sum_of_split). Completes (d).
  rh-dlvp-bcsum-blaschke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Cache elan toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('telperion/examples/zero_free_bridge/lean/lean-toolchain') }}
      - name: Install elan
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch Mathlib olean cache
        working-directory: telperion/examples/zero_free_bridge/lean
        run: lake exe cache get
      - name: Build the dVP Blaschke BC-SUM capstone (kernel verification)
        working-directory: telperion/examples/zero_free_bridge/lean
        run: lake build DlvpBCSumBlaschke

  # dVP BLASCHKE→skeleton bridge: Herglotz lower bound k/(σ-β) ≤ Re(Σ m/(z-ρ)) (keep equal-height
  # zero via re_smul_inv_sub_at_equal_height, drop nonneg rest). Turns bc_sum_blaschke into hzero.
  rh-dlvp-herglotzlower:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Cache elan toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('telperion/examples/zero_free_bridge/lean/lean-toolchain') }}
      - name: Install elan
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch Mathlib olean cache
        working-directory: telperion/examples/zero_free_bridge/lean
        run: lake exe cache get
      - name: Build the dVP Herglotz lower bound (kernel verification)
        working-directory: telperion/examples/zero_free_bridge/lean
        run: lake build DlvpHerglotzLower

  # dVP geometry/two-scale certificate shapes (two_scale_separation, far_pole_sum, herglotz_lower):
  # regenerate from the emitters, drift-check, and kernel-verify the emitted Lean.
  dvp-geom-atoms-compiles:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install sympy pytest
      - name: Emitter self-check / negative-control tests
        working-directory: telperion
        run: PYTHONPATH=src python -m pytest tests/test_emit_dvp_geom_atoms.py -q
      - name: Regenerate the dVP geometry Lean from the emitters (certify -> emit -> check)
        working-directory: telperion
        run: PYTHONPATH=src python examples/dvp_geom_atoms/generate.py --check
      - name: Cache elan toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('telperion/examples/dvp_geom_atoms/lean/lean-toolchain') }}
      - name: Install elan
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch Mathlib olean cache
        working-directory: telperion/examples/dvp_geom_atoms/lean
        run: lake exe cache get
      - name: Build the emitted Lean (the actual verification — dVP geometry certificates)
        working-directory: telperion/examples/dvp_geom_atoms/lean
        run: lake build TwoScaleSeparation FarPoleSum HerglotzLower ArgumentPrinciple FullArgumentPrinciple RectArgumentPrinciple AnnulusCount SlitLoopWindingZero BoxResidueSum RectWinding LogProductBound

  # MILESTONE: first kernel-verified on-line nontrivial-zero count for the Riemann zeta function.
  # Certifies N >= 5 zeros of Lambda (= nontrivial zeros of zeta) on Re s = 1/2 in [10, 35],
  # matching the 5 known zeros t ~ 14.1347, 21.0220, 25.0109, 30.4249, 32.9351.
  # Axioms: {propext, Classical.choice, Quot.sound} -- no sorryAx.
  # conjecture1_proved = False: this is a lower bound via sign changes, not a proof of RH.
  zeta-zero-localization-compiles:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install sympy pytest mpmath "python-flint==0.9.0"
      - name: Regenerate XiLineZeros.lean and check it matches frozen output
        working-directory: telperion
        run: |
          python examples/zeta_zero_localization/generate.py --check
      - name: Cache elan toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('telperion/examples/zeta_zero_localization/lean/lean-toolchain') }}
      - name: Install elan
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch Mathlib olean cache
        working-directory: telperion/examples/zeta_zero_localization/lean
        run: lake exe cache get
      - name: Build the emitted Lean (kernel-verified on-line zero count)
        working-directory: telperion/examples/zeta_zero_localization/lean
        run: lake build
