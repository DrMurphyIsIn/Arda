name: telperion-lean-e2e

on:
  push:
    paths:
      - "telperion/**"
      - ".github/workflows/forge-lean-e2e.yml"
  pull_request:
    paths:
      - "telperion/**"
      - ".github/workflows/forge-lean-e2e.yml"
  workflow_dispatch:

jobs:
  toy-compiles:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install sympy pytest

      - name: Regenerate toy Lean from the family definition (certify -> validate -> emit)
        working-directory: telperion
        run: |
          python examples/toy_box/generate.py --check

      - name: Cache elan toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('telperion/examples/toy_box/lean/lean-toolchain') }}

      - name: Install elan
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch Mathlib olean cache
        working-directory: telperion/examples/toy_box/lean
        run: lake exe cache get

      - name: Build the emitted Lean (the actual verification)
        working-directory: telperion/examples/toy_box/lean
        run: lake build

  tangent-compiles:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install sympy pytest

      - name: Regenerate tangent Lean from the family definition (certify -> validate -> emit)
        working-directory: telperion
        run: |
          python examples/tangent_sum/generate.py --check

      - name: Cache elan toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('telperion/examples/tangent_sum/lean/lean-toolchain') }}

      - name: Install elan
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch Mathlib olean cache
        working-directory: telperion/examples/tangent_sum/lean
        run: lake exe cache get

      - name: Build the emitted Lean (the actual verification — tangent-line trick)
        working-directory: telperion/examples/tangent_sum/lean
        run: lake build

  cs-compiles:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install sympy pytest

      - name: Regenerate Cauchy-Schwarz Lean from the family definition
        working-directory: telperion
        run: |
          python examples/cauchy_schwarz/generate.py --check

      - name: Cache elan toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('telperion/examples/cauchy_schwarz/lean/lean-toolchain') }}

      - name: Install elan
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch Mathlib olean cache
        working-directory: telperion/examples/cauchy_schwarz/lean
        run: lake exe cache get

      - name: Build the emitted Lean (the actual verification — Cauchy-Schwarz)
        working-directory: telperion/examples/cauchy_schwarz/lean
        run: lake build
