      - name: Install elan
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch Mathlib olean cache
        working-directory: telperion/examples/zero_free_bridge/lean
        run: lake exe cache get

      - name: Build the unconditional strip representation (R1+R2+R3 assembly)
        working-directory: telperion/examples/zero_free_bridge/lean
        run: lake build StripReprAssembled

  # PHASE 2: the UNCONDITIONAL crude strip growth bound `zeta_strip_bound`, assembled from input (R)
  # `zeta_fract_repr` + input (B) `zeta_repr_integral_bound` via `zeta_strip_bound_of`. Own job.
  strip-bound-compiles:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Cache elan toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
