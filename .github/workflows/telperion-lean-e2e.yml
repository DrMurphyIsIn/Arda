    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install sympy pytest

      - name: Regenerate BG caterpillar concavity Lean from the frozen enclosures
        working-directory: telperion
        run: |
          python examples/bg_caterpillar_concavity/generate.py --check

      - name: Cache elan toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('telperion/examples/bg_caterpillar_concavity/lean/lean-toolchain') }}

      - name: Install elan
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch Mathlib olean cache
        working-directory: telperion/examples/bg_caterpillar_concavity/lean
        run: lake exe cache get

      - name: Build the emitted Lean (the actual verification — density concavity + strict max at a=7)
        working-directory: telperion/examples/bg_caterpillar_concavity/lean
        run: lake build
