      - name: Fetch Mathlib olean cache
        working-directory: telperion/examples/jensen_hyperbolicity/lean
        run: lake exe cache get

      - name: Build the emitted Lean (JensenBridge + JensenHyperbolicity, the actual verification)
        working-directory: telperion/examples/jensen_hyperbolicity/lean
        run: lake build

