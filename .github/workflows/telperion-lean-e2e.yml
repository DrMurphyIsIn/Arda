name: telperion-lean-e2e

on:
  push:
    branches:
      - main
    paths:
      - "telperion/**"
      - ".github/workflows/telperion-lean-e2e.yml"
  pull_request:
    paths:
      - "telperion/**"
      - ".github/workflows/telperion-lean-e2e.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  toy-compiles:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install sympy pytest

      - name: Regenerate toy Lean from the family definition (certify -> validate -> emit)
        working-directory: telperion
        run: |
          python examples/toy_box/generate.py --check

      - name: Cache elan toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('telperion/examples/toy_box/lean/lean-toolchain') }}

      - name: Install elan
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch Mathlib olean cache
        working-directory: telperion/examples/toy_box/lean
        run: lake exe cache get

      - name: Build the emitted Lean (the actual verification)
        working-directory: telperion/examples/toy_box/lean
        run: lake build
  jensen-hyperbolicity-compiles:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install sympy pytest mpmath python-flint

      - name: Regenerate Jensen d=2 grid (certify -> emit) and check it matches on-disk
        working-directory: telperion
        run: |
          python examples/jensen_hyperbolicity/generate.py --grid --check

      - name: Cache elan toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('telperion/examples/jensen_hyperbolicity/lean/lean-toolchain') }}

      - name: Install elan
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch Mathlib olean cache
        working-directory: telperion/examples/jensen_hyperbolicity/lean
        run: lake exe cache get

      - name: Build the emitted Lean (JensenBridge + JensenHyperbolicity, the actual verification)
        working-directory: telperion/examples/jensen_hyperbolicity/lean
        run: lake build

  # Li positivity ladder (RH-roadmap Track 2).  NOTE: toolchain ISLAND — the
  # upstream LiCriterion dependency (nicholasbulka/li-criterion-rh-equivalence-lean,
  # pinned by rev in the lakefile) transitively pins Lean v4.34.0-rc1 + its own
  # Mathlib, differing from the v4.32.0 of the other examples.  elan installs
  # from the example's own lean-toolchain; the Mathlib olean cache is fetched
  # through the dependency tree as usual.
  li-positivity-compiles:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install sympy pytest mpmath python-flint

      - name: Regenerate the Li ladder (enclose -> certify -> emit) and check it matches on-disk
        working-directory: telperion
        run: |
          python examples/li_positivity/generate.py --check

      - name: Cache elan toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('telperion/examples/li_positivity/lean/lean-toolchain') }}

      - name: Install elan
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch Mathlib olean cache (through the LiCriterion dependency)
        working-directory: telperion/examples/li_positivity/lean
        run: lake exe cache get

      - name: Build the emitted ladder against the upstream reduction (the actual verification)
        working-directory: telperion/examples/li_positivity/lean
        run: lake build

      - name: Axiom guard (fails on sorryAx anywhere in the anchors)
        working-directory: telperion/examples/li_positivity/lean
        shell: bash
        run: |
          set -euo pipefail
          lake env lean AxiomGuardLiPositivity.lean 2>&1 | tee axioms.out
          # 163 `#print axioms` anchors in AxiomGuardLiPositivity.lean as of 2026-09-20.
          # Without a floor, a guard that elaborates to NOTHING passes the checks
          # below, because `! grep -q sorryAx` is satisfied by an empty file.
          n=$(grep -cE "depends on axioms|does not depend on any axioms" axioms.out || true)
          if [ "$n" -lt "146" ]; then
            echo "::error::guard printed $n axiom lines, expected at least 146 --"
            echo "::error::the guard did not run, or was silently truncated"; exit 1; fi
          ! grep -q "sorryAx" axioms.out
          # Every printed axiom list must be a SUBSET of the three standard axioms.
          # Join lines first: Lean WRAPS a long list, and a line-based grep would read
          # the wrapped remainder as a violation.
          if tr "\n" " " < axioms.out | grep -oE "depends on axioms: \[[^]]*\]" \
               | sed -E "s/depends on axioms: \[|\]//g" | tr "," "\n" | tr -d " " \
               | grep -vE "^$|^propext$|^Classical\.choice$|^Quot\.sound$" ; then
            echo "::error::an axiom outside [propext, Classical.choice, Quot.sound] is listed above"
            exit 1
          fi

      # Closure-run audit C1 (2026-09-22): AxiomGuardZeroFree prints the theorems of the two
      # proved rh nodes RH_zero_free_polylog and RH_zero_free_gamma5.  It is a lean_lib in
      # defaultTargets, so `lake build` compiled it -- but NO step ran it, so its `#print axioms`
      # output was never checked.  It cannot be folded into AxiomGuardLiPositivity: the
      # `ZeroFreeBridge.zeta_sphere_bound` name clash forbids the co-import.  Same checks as
      # above, with the exact three-axiom set (both anchors are expected to use all three).
      - name: Axiom guard for the zero-free-region artifacts (AxiomGuardZeroFree)
        working-directory: telperion/examples/li_positivity/lean
        shell: bash
        run: |
          set -euo pipefail
          for G in AxiomGuardZeroFree.lean; do
            lake env lean "$G" 2>&1 | tee "${G%.lean}.out"
            n=$(grep -cE "depends on axioms|does not depend on any axioms" "${G%.lean}.out" || true)
            if [ "$n" -lt "2" ]; then
              echo "::error::$G printed $n axiom lines, expected at least 2 -- the guard did not run"; exit 1; fi
            if grep -q "sorryAx" "${G%.lean}.out"; then echo "::error::$G depends on sorryAx"; exit 1; fi
            # Join first (Lean wraps long lists), then every list must be exactly the three.
            if tr "\n" " " < "${G%.lean}.out" | grep -oE "depends on axioms: \[[^]]*\]" | tr -s " " \
                 | grep -v "^depends on axioms: \[propext, Classical.choice, Quot.sound\]$"; then
              echo "::error::$G lists an axiom set other than [propext, Classical.choice, Quot.sound]"; exit 1; fi
          done

      # Registry-anchored coverage: every PROVED registry node whose artifact lives on this island
      # must have its theorem printed clean by one of the two guards above.  The floors above only
      # prove the guards RAN; this proves they cover what the registry calls proved.  The anchor
      # list is derived from telperion/missions/*/nodes/*.toml, not hand-maintained.
      - name: Registry anchors (every proved li_positivity node is printed clean)
        working-directory: telperion/examples/li_positivity/lean
        run: python ../../../scripts/guard_anchors.py --island li_positivity axioms.out AxiomGuardZeroFree.out
