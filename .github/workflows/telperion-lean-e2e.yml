      - name: Install elan
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch Mathlib olean cache
        working-directory: telperion/examples/zero_free_bridge/lean
        run: lake exe cache get

      - name: Build the unconditional crude strip bound (Phase 2)
        working-directory: telperion/examples/zero_free_bridge/lean
        run: lake build StripBound

  # PHASE 4 core: the de la Vallee Poussin quantitative estimate `dlvp_core_estimate`, proven from
  # the 3-4-1 positivity with the Borel-Caratheodory log-derivative bounds as explicit hypotheses.
  zero-free-region-compiles:
    runs-on: ubuntu-latest
    timeout-minutes: 60
