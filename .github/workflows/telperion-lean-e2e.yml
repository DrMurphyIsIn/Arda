  speiser-box-probe-compiles:
    # MM_speiser_box_probe (routes-roadmap E9, Face 7 pilot, W4c): a Lipschitz-net
    # ZERO-FREENESS certificate for `deriv riemannZeta` on [1/4, 3/8] x [6, 10].
    # NOT the Speiser wall -- Speiser (1935) makes non-vanishing of zeta' on the WHOLE
    # open left strip equivalent to RH, and no finite union of boxes exhausts a strip.
    # This job decides nothing about RH.  conjecture1_proved = False.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install sympy pytest mpmath

      - name: Emitter self-check pass + Layer-1 negative-control refusals
        working-directory: telperion
        run: PYTHONPATH=src python -m pytest tests/test_emit_grid_modulus_nonvanishing.py -q

      - name: Regenerate the certificate arithmetic + sidecar (drift check)
        working-directory: telperion
        run: PYTHONPATH=src python examples/speiser_box_probe/generate.py --check

      - name: Cache elan toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('telperion/examples/speiser_box_probe/lean/lean-toolchain') }}

      - name: Install elan
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch Mathlib olean cache
        working-directory: telperion/examples/speiser_box_probe/lean
        run: lake exe cache get

      - name: Build the island (instrument + box + emitted certificate arithmetic)
        working-directory: telperion/examples/speiser_box_probe/lean
        run: lake build

      - name: Axiom guard (fails on sorryAx anywhere in the island)
        working-directory: telperion/examples/speiser_box_probe/lean
        shell: bash
        run: |
          set -euo pipefail
          lake env lean AxiomGuardSpeiserBoxProbe.lean 2>&1 | tee axioms.out
          # 17 `#print axioms` anchors as of 2026-09-20.  Without a floor, a guard that
          # elaborates to NOTHING passes, because `! grep -q sorryAx` is satisfied by an
          # empty file.  Without `2>&1`, an elaboration error never reaches the file at all.
          n=$(grep -cE "depends on axioms|does not depend on any axioms" axioms.out || true)
          if [ "$n" -lt "15" ]; then
            echo "::error::guard printed $n axiom lines, expected at least 15 --"
            echo "::error::the guard did not run, or was silently truncated"; exit 1; fi
          ! grep -q "sorryAx" axioms.out
          if tr "\n" " " < axioms.out | grep -oE "depends on axioms: \[[^]]*\]" \
               | sed -E "s/depends on axioms: \[|\]//g" | tr "," "\n" | tr -d " " \
               | grep -vE "^$|^propext$|^Classical\.choice$|^Quot\.sound$" ; then
            echo "::error::an axiom outside [propext, Classical.choice, Quot.sound] is listed above"
            exit 1
          fi
