name: telperion-casestudy

on:
  push:
    paths:
      - "telperion/**"
      - ".github/workflows/telperion-casestudy.yml"
  pull_request:
    paths:
      - "telperion/**"
      - ".github/workflows/telperion-casestudy.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  r47-regen-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install sympy
      - name: Manifest verify, heavy group (R47 36-cell re-certification + diff)
        working-directory: telperion
        run: PYTHONPATH=src python -m telperion.cli verify --group heavy
