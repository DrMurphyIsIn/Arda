name: telperion-production

# THE COMPILE GATE over frozen production artifacts — added per
# REVIEW_20260816_TELPERION_G1: regen-diffs check byte-stability and tests
# check mathematics, but only `lake build` checks that shipped Lean IS Lean.

on:
  push:
    paths:
      - "telperion/examples/g1_floors/**"
      - "telperion/examples/shed_lemmas/**"
      - "telperion/examples/legs_certs/**"
      - "telperion/examples/interp_lemma/**"
      - "telperion/examples/h_floors/**"
      - "telperion/examples/exp_bracket/**"
      - "telperion/examples/padic_valuation/**"
      - "telperion/examples/tax_growth/**"
      - "telperion/examples/telescope/**"
      - "telperion/examples/interlacing/**"
      - "telperion/examples/lorentzian/**"
      - "telperion/examples/rigidity/**"
      - "telperion/examples/sos_sdp/**"
      - "telperion/examples/mconvex/**"
      - "telperion/examples/proof_audit/**"
      - "telperion/src/**"
      - ".github/workflows/telperion-production.yml"
  pull_request:
    paths:
      - "telperion/examples/g1_floors/**"
      - "telperion/src/**"
      - ".github/workflows/telperion-production.yml"
  workflow_dispatch:

jobs:
  g1-compiles:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install sympy
      - name: Regeneration diff (the frozen artifact matches the generator)
        working-directory: telperion
        run: python examples/g1_floors/generate.py --check
      - name: Cache elan
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('telperion/examples/g1_floors/lean/lean-toolchain') }}
      - name: Install elan
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile the frozen G1 artifact (3084 floors + 176 kernel facts)
        working-directory: telperion/examples/g1_floors/lean
        run: |
          lake exe cache get
          lake build

  audit-compiles:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Stage frozen audit artifacts into the Audit project
        run: |
          cd telperion/examples/proof_audit/lean
          mkdir -p Audit
          cp ../../shed_lemmas/frozen/ShedLemmas.lean       Audit/Shed.lean
          cp ../../legs_certs/frozen/LegsCerts.lean         Audit/Legs.lean
          cp ../../interp_lemma/frozen/i1/InterpI1.lean     Audit/InterpI1.lean
          cp ../../interp_lemma/frozen/i2/InterpI2.lean     Audit/InterpI2.lean
          cp ../../interp_lemma/frozen/light/InterpLight.lean Audit/InterpLight.lean
          cp ../../h_floors/frozen/floors/HFloors.lean        Audit/HFloors.lean
          cp ../../h_floors/frozen/anchors/HFloorAnchors.lean Audit/HFloorAnchors.lean
          cp ../../exp_bracket/frozen/ExpBracket.lean            Audit/ExpBracket.lean
          cp ../../padic_valuation/frozen/PadicValuation.lean   Audit/PadicValuation.lean
          cp ../../tax_growth/frozen/TaxGrowth.lean             Audit/TaxGrowth.lean
          cp ../../interlacing/frozen/Interlacing.lean          Audit/Interlacing.lean
          cp ../../lorentzian/frozen/Lorentzian.lean            Audit/Lorentzian.lean
          cp ../../rigidity/frozen/Rigidity.lean                Audit/Rigidity.lean
          cp ../../sos_sdp/frozen/SOSSDP.lean                    Audit/SOSSDP.lean
          cp ../../mconvex/frozen/MConvex.lean                  Audit/MConvex.lean
      - name: Cache elan
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('telperion/examples/proof_audit/lean/lean-toolchain') }}
      - name: Install elan
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile the audit re-derivations + handoff artifacts (shed 55 + legs 48 + interp 215 + hfloors 382)
        working-directory: telperion/examples/proof_audit/lean
        run: |
          lake exe cache get
          lake build

  telescope-compiles:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Stage the frozen telescope lemma
        run: |
          cd telperion/examples/telescope/lean
          mkdir -p Tele
          cp ../frozen/Telescope.lean Tele/Telescope.lean
      - name: Cache elan
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('telperion/examples/telescope/lean/lean-toolchain') }}
      - name: Install elan
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile the rose-tree telescoping lemma + worked instantiation
        working-directory: telperion/examples/telescope/lean
        run: |
          lake exe cache get
          lake build
