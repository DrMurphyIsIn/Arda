name: telperion-mathlib-probe

# One-shot API probe: `#check`s candidate zeta/gamma-numerics constants against
# pinned Mathlib and dumps the log (types for what exists, "unknown identifier"
# for what does not).  Expected to "fail" -- that is how it reports the gaps.

on:
  push:
    paths:
      - "telperion/examples/mathlib_probe/**"
      - ".github/workflows/telperion-mathlib-probe.yml"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Cache elan toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('telperion/examples/mathlib_probe/lean-toolchain') }}
      - name: Install elan
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch Mathlib olean cache
        working-directory: telperion/examples/mathlib_probe
        run: lake exe cache get
      - name: Probe (log the #check results; do not fail the job)
        working-directory: telperion/examples/mathlib_probe
        run: lake build 2>&1 | tee probe.log || true
      - name: Show which constants are unknown vs typed
        working-directory: telperion/examples/mathlib_probe
        run: |
          echo "===== UNKNOWN (missing from Mathlib v4.32.0) ====="
          grep -iE "unknown identifier|unknown constant" probe.log || echo "(none)"
          echo "===== the raw probe log ====="
          cat probe.log
