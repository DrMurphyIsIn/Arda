name: proof-comparator

# Independent re-verification of the Brualdi-Goldwasser anchor theorems by the
# openai/ten-proofs Comparator (github.com/leanprover/comparator): over and above
# `lake build` + the `#print axioms` AxiomGuard, this exports each anchor proof and
#   (1) enforces a machine-checked axiom whitelist [propext, Quot.sound, Classical.choice],
#   (2) replays it through BOTH the Lean default kernel AND nanoda -- a second,
#       independently-written (Rust) kernel.  A soundness bug would have to fool two
#       kernels.  The three anchors are the sorry-free, axiom-clean core:
#         R3Cert.Step3.conjecture1_of_layers          (R7' capstone, conditional)
#         R3Cert.phi_le_one                            (Phi <= 1 crux)
#         R3Cert.CappedJointConfig.gstep_le_one_achievable  (g-step / master ineq)
#
# All pins are v4.32.0 (R3Cert toolchain, mathlib, comparator) -- see
# proof/formalization/comparator/README.md.

on:
  push:
    paths:
      - "proof/formalization/**"
      - ".github/workflows/proof-comparator.yml"
  pull_request:
    paths:
      - "proof/formalization/**"
      - ".github/workflows/proof-comparator.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bg-comparator:
    runs-on: ubuntu-latest
    # WHY 300 (2026-09-23): the job used to die at its 150-min limit in a COLD `lake build` of
    # the WHOLE R3Cert library (260 modules incl. R47PC6Cells ~70 min and R47PC6Reduce, 18.2 GB
    # peak -- see proof-lean.yml) that no anchor below imports. The build is now scoped to the
    # three anchor cones and staged with cache checkpoints, as in proof-lean.yml; the stage
    # timeouts (100 + 100 min) leave ~100 min for the tool builds, the Comparator runs and the
    # always() cache save.
    timeout-minutes: 300
    defaults:
      run:
        working-directory: proof/formalization
    steps:
      - uses: actions/checkout@v4

      - name: Cache elan toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('proof/formalization/lean-toolchain') }}
      - name: Install elan
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch Mathlib olean cache
        run: lake exe cache get

      # Same staged-checkpoint cold-build fix as proof-lean.yml (closure-run finding C4,
      # 2026-09-23): swap so a memory peak pages out instead of killing the runner, the `lakeb`
      # telemetry wrapper (writes `built=<n>` to the step outputs), a cache key computed once on
      # an idle machine, per-stage checkpoint saves, and an always() save of partial progress.
      - name: Provision swap + install the build-telemetry wrapper
        run: |
          set -uo pipefail
          free -m; df -h / /mnt 2>/dev/null || true
          # Prefer the runner's scratch disk (/mnt); fall back to a smaller file on /. Never fail
          # the job over swap: without it the build is merely back to the old risk.
          SW=""
          for cand in /mnt/arda-lean.swap:16G /arda-lean.swap:10G; do
            f=${cand%%:*}; sz=${cand##*:}
            if sudo fallocate -l "$sz" "$f" 2>/dev/null; then SW=$f; break; fi
          done
          if [ -n "$SW" ] && sudo chmod 600 "$SW" && sudo mkswap "$SW" >/dev/null && sudo swapon "$SW"; then
            echo "extra swap enabled: $SW"
          else
            echo "::warning::could not enable extra swap; continuing without it"
          fi
          swapon --show || true; free -m
          # `lakeb <targets...>`: `lake build` plus a once-a-minute memory/swap/disk line in the
          # step log, so the next resource failure is diagnosable from the log alone. It also
          # writes `built=<n>` (modules actually compiled) to the step outputs, which gates the
          # intermediate cache saves (no point re-saving an unchanged warm cache).
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/lakeb" <<'SH'
          #!/usr/bin/env bash
          set -uo pipefail
          ( while sleep 60; do
              echo "[res $(date -u +%H:%M:%S)] $(free -m 2>/dev/null | awk '/^Mem:/{printf "mem_used=%sM avail=%sM", $3, $7} /^Swap:/{printf " swap_used=%sM", $3}') disk_free=$(df -BG --output=avail / 2>/dev/null | tail -1 | tr -d ' ')"
            done ) &
          mon=$!
          trap 'kill "$mon" 2>/dev/null || true' EXIT
          log=$(mktemp)
          lake build "$@" 2>&1 | tee "$log"
          rc=${PIPESTATUS[0]}
          n=$(grep -cE '\[[0-9]+/[0-9]+\] Built ' "$log" || true)
          echo "lakeb: $n module(s) compiled by: lake build $*"
          [ -n "${GITHUB_OUTPUT:-}" ] && echo "built=$n" >> "$GITHUB_OUTPUT"
          exit "$rc"
          SH
          chmod +x "$RUNNER_TEMP/bin/lakeb"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # Compute the build-cache key ONCE, on an idle machine (hashFiles() on a thrashing runner
      # can exceed GitHub's 120 s step limit). The prefix is IDENTICAL to proof-lean.yml's, so
      # the two workflows restore each other's builds (caches are still scoped per ref).
      - name: Build-cache key
        id: ckey
        run: |
          echo "prefix=lean-build-${{ runner.os }}-${{ hashFiles('proof/formalization/lean-toolchain', 'proof/formalization/lake-manifest.json') }}-" >> "$GITHUB_OUTPUT"
          echo "run=${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"

      # Restore the most recent incremental R3Cert build (this workflow's or proof-lean's
      # checkpoints; shared prefix), so `lake build` only recompiles changed modules.
      - name: Restore Lean project build (incremental)
        uses: actions/cache/restore@v4
        with:
          path: proof/formalization/.lake/build
          key: ${{ steps.ckey.outputs.prefix }}${{ steps.ckey.outputs.run }}
          restore-keys: |
            ${{ steps.ckey.outputs.prefix }}

      # The Comparator needs ONLY the three anchor modules and their import cones (the
      # challenge/solution modules of comparator/*.comparator.json). Import closure checked
      # 2026-09-23: R3Cert.R47TopCapstone 57 modules, R3Cert.PotentialFinal 31,
      # R3Cert.CappedJointClosure 7 -- none of R47PC6Cells / R47PC6Reduce / R7Hyps. Compiling the
      # whole library (the old bare `lake build`) is proof-lean.yml's job, not this one's; here
      # it only burned the 150-min budget. If a comparator config gains a new module, add it here.
      # Stage 1: the two small cruxes' cones.
      - name: Build stage 1 — anchor cones of phi_le_one + gstep_le_one_achievable
        id: stage1
        timeout-minutes: 100
        run: lakeb R3Cert.PotentialFinal R3Cert.CappedJointClosure

      - name: Save build-cache checkpoint (stage 1)
        if: steps.stage1.outcome == 'success' && steps.stage1.outputs.built != '0'
        uses: actions/cache/save@v4
        with:
          path: proof/formalization/.lake/build
          key: ${{ steps.ckey.outputs.prefix }}${{ steps.ckey.outputs.run }}-s1

      # Stage 2: the conditional capstone's cone (the largest of the three).
      - name: Build stage 2 — anchor cone of conjecture1_of_layers (R3Cert.R47TopCapstone)
        id: stage2
        timeout-minutes: 100
        run: lakeb R3Cert.R47TopCapstone

      - name: Save build-cache checkpoint (stage 2)
        if: steps.stage2.outcome == 'success' && steps.stage2.outputs.built != '0'
        uses: actions/cache/save@v4
        with:
          path: proof/formalization/.lake/build
          key: ${{ steps.ckey.outputs.prefix }}${{ steps.ckey.outputs.run }}-s2

      # landrun shim: real landrun (urfave/cli) strips the `--` separator lean4export
      # needs; we verify our OWN proofs so the sandbox is not security-critical (the
      # kernel replay is the guarantee).  Exec the child un-sandboxed with `--` preserved.
      - name: Install landrun shim (preserves `--`)
        run: |
          mkdir -p "$HOME/.local/bin"
          cat > "$HOME/.local/bin/landrun" <<'SHIM'
          #!/usr/bin/env bash
          set -euo pipefail
          args=("$@"); i=0; n=${#args[@]}
          while (( i < n )); do
            a="${args[$i]}"
            case "$a" in
              --ro|--rw|--rwx|--rox|--env|--log-level)
                v="${args[$((i+1))]:-}"
                [[ "$a" == "--env" && "$v" == *"="* ]] && export "$v"
                i=$((i+2)) ;;
              --env=*) export "${a#--env=}"; i=$((i+1)) ;;
              --*=*) i=$((i+1)) ;;
              -*) i=$((i+1)) ;;
              *) break ;;
            esac
          done
          exec "${args[@]:$i}"
          SHIM
          chmod +x "$HOME/.local/bin/landrun"

      - name: Build Comparator + lean4export (v4.32.0)
        run: |
          git clone --depth 1 --branch v4.32.0 \
            https://github.com/leanprover/comparator.git "$HOME/comparator"
          cd "$HOME/comparator"
          lake build lean4export comparator
          COMPARATOR_BIN="$(find "$HOME/comparator/.lake" -type f -name comparator -path '*/bin/*' | head -1)"
          L4X_BIN="$(find "$HOME/comparator/.lake" -type f -name lean4export -path '*/bin/*' | head -1)"
          test -x "$COMPARATOR_BIN" && test -x "$L4X_BIN"
          echo "$(dirname "$COMPARATOR_BIN")" >> "$GITHUB_PATH"
          echo "COMPARATOR_LEAN4EXPORT=$L4X_BIN" >> "$GITHUB_ENV"

      - name: Build nanoda (2nd kernel)
        run: |
          git clone --depth 1 https://github.com/ammkrn/nanoda_lib.git "$HOME/nanoda"
          cd "$HOME/nanoda"
          cargo build --release
          NANODA_BIN="$HOME/nanoda/target/release/nanoda_bin"
          test -x "$NANODA_BIN"
          echo "COMPARATOR_NANODA=$NANODA_BIN" >> "$GITHUB_ENV"

      - name: Comparator — verify the BG anchors (axiom whitelist + 2 kernels)
        env:
          COMPARATOR_LANDRUN: /home/runner/.local/bin/landrun
        run: |
          set -uo pipefail
          echo "lean4export = $COMPARATOR_LEAN4EXPORT ; nanoda = $COMPARATOR_NANODA"
          # Run each anchor independently and record pass/fail (a huge proof cone
          # could exhaust the runner; we want ALL results, not an abort on the first).
          # Smaller cruxes first, the conditional capstone last.
          fail=0
          declare -A RESULT
          for cfg in \
            comparator/phi_le_one.comparator.json \
            comparator/gstep_le_one_achievable.comparator.json \
            comparator/conjecture1_of_layers.comparator.json ; do
            echo "==================== $cfg ===================="
            if lake env comparator "$cfg"; then RESULT[$cfg]=PASS; else RESULT[$cfg]=FAIL; fail=1; fi
          done
          echo "==================== summary ===================="
          for cfg in "${!RESULT[@]}"; do printf '%-55s %s\n' "$cfg" "${RESULT[$cfg]}"; done
          if [ "$fail" -ne 0 ]; then
            echo "::error::One or more BG anchors did not pass Comparator (see per-anchor logs above)."
            exit 1
          fi
          echo "All BG anchors independently re-verified (axiom-clean; Lean + nanoda kernels accept)."

      # Save partial progress when a build stage did NOT complete (failed, timed out, or the job
      # was cancelled), so the next run resumes instead of starting cold. When both stages
      # succeeded, their checkpoint saves above already hold everything compiled, so no
      # duplicate multi-GB entry is written (repo cache quota is shared with proof-lean).
      - name: Save Lean project build cache (partial build — breaks the cold-rebuild spiral)
        if: >-
          always() && steps.ckey.outputs.prefix != '' &&
          (steps.stage1.outcome == 'failure' || steps.stage1.outcome == 'cancelled' ||
           steps.stage2.outcome == 'failure' || steps.stage2.outcome == 'cancelled')
        uses: actions/cache/save@v4
        with:
          path: proof/formalization/.lake/build
          key: ${{ steps.ckey.outputs.prefix }}${{ steps.ckey.outputs.run }}
