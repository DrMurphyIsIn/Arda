name: telperion-comparator

# End-to-end verification of Telperion output by openai/ten-proofs Comparator
# (https://github.com/leanprover/comparator): an INDEPENDENT judge that asserts
# the emitted proof proves EXACTLY the challenge statement, uses only whitelisted
# axioms, and survives a fresh kernel replay.  This is the "wrong certificate is
# a compile error" promise, mechanized and hardened.
#
# Pins (all v4.32.0, matching every other telperion lean example):
#   - lean-toolchain      leanprover/lean4:v4.32.0  (examples/bernoulli/lean/)
#   - mathlib             v4.32.0                   (lakefile require)
#   - comparator          v4.32.0 tag               (github.com/leanprover/comparator)
#
# STATUS: first-run infrastructure.  The mathlib build + module compile mirror the
# proven telperion-lean-e2e jobs; the Comparator install/run steps are new and may
# need one round of path/sandbox tuning on the first live run (see NOTE comments).
# nanoda (the optional 2nd, non-Lean kernel) is OFF here — it needs a separate Rust
# build; enable via the commented block + `generate.py --comparator --nanoda`.

on:
  push:
    paths:
      - "telperion/examples/bernoulli/**"
      - "telperion/src/telperion/comparator.py"
      - ".github/workflows/telperion-comparator.yml"
      - ".github/comparator/**"
  pull_request:
    paths:
      - "telperion/examples/bernoulli/**"
      - "telperion/src/telperion/comparator.py"
      - ".github/workflows/telperion-comparator.yml"
      - ".github/comparator/**"
  workflow_dispatch:

jobs:
  bernoulli-comparator:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install sympy pytest

      # 1. Regenerate solution + independent challenge + config from the family
      #    definition (certify -> validate -> emit), and drift-check the frozen copy.
      #    --nanoda sets enable_nanoda in the config so the judge ALSO replays the
      #    solution through nanoda (a 2nd, non-Lean kernel; built in step 4b).
      - name: Regenerate and materialize the Comparator challenge
        working-directory: telperion
        run: |
          python examples/bernoulli/generate.py --check
          python examples/bernoulli/generate.py --comparator --nanoda

      # 2. Lean toolchain (elan), pinned by the project's lean-toolchain (v4.32.0).
      - name: Cache elan toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('telperion/examples/bernoulli/lean/lean-toolchain') }}
      - name: Install elan
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # 3. Build the solution + challenge modules (mathlib olean cache -> compile).
      #    This is the same pattern as the other telperion-lean-e2e jobs.
      - name: Fetch Mathlib olean cache
        working-directory: telperion/examples/bernoulli/lean
        run: lake exe cache get
      - name: Build solution + challenge (the mathlib verification)
        working-directory: telperion/examples/bernoulli/lean
        run: lake build

      # 4. landrun shim.  Comparator wraps every child (lake build, lean4export)
      #    in landrun for sandboxing.  Real landrun (github.com/Zouuup/landrun)
      #    uses urfave/cli, whose Args().Slice() STRIPS the `--` separator — which
      #    silently breaks lean4export's `<module> -- <constants>` contract, so
      #    every constant is parsed as a module import ("unknown module prefix").
      #    We verify our OWN emitted proofs, so the Landlock sandbox is not
      #    security-critical (the kernel replay is the real guarantee).  Install a
      #    shim that accepts landrun's flags but execs the child un-sandboxed with
      #    args — including `--` — preserved.  (Validated end-to-end locally.)
      - name: Install landrun shim (preserves `--`)
        run: |
          mkdir -p "$HOME/.local/bin"
          cat > "$HOME/.local/bin/landrun" <<'SHIM'
          #!/usr/bin/env bash
          set -euo pipefail
          args=("$@"); i=0; n=${#args[@]}
          while (( i < n )); do
            a="${args[$i]}"
            case "$a" in
              --ro|--rw|--rwx|--rox|--env|--log-level)
                v="${args[$((i+1))]:-}"
                [[ "$a" == "--env" && "$v" == *"="* ]] && export "$v"
                i=$((i+2)) ;;
              --env=*) export "${a#--env=}"; i=$((i+1)) ;;
              --*=*) i=$((i+1)) ;;
              -*) i=$((i+1)) ;;
              *) break ;;
            esac
          done
          exec "${args[@]:$i}"
          SHIM
          chmod +x "$HOME/.local/bin/landrun"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # 5. Comparator + lean4export, from the v4.32.0 tag (matches our toolchain).
      #    `lake build lean4export comparator` builds BOTH binaries (per the
      #    comparator README); they land in .lake/build/bin.
      - name: Build Comparator + lean4export
        run: |
          git clone --depth 1 --branch v4.32.0 \
            https://github.com/leanprover/comparator.git "$HOME/comparator"
          cd "$HOME/comparator"
          lake build lean4export comparator
          # comparator's exe lands in its own build dir; lean4export is a *dependency*,
          # so its binary lives under .lake/packages/<pkg>/.lake/build/bin.  Locate
          # both and hand comparator the lean4export path via COMPARATOR_LEAN4EXPORT.
          COMPARATOR_BIN="$(find "$HOME/comparator/.lake" -type f -name comparator -path '*/bin/*' | head -1)"
          L4X_BIN="$(find "$HOME/comparator/.lake" -type f -name lean4export -path '*/bin/*' | head -1)"
          echo "comparator = $COMPARATOR_BIN"
          echo "lean4export = $L4X_BIN"
          test -x "$COMPARATOR_BIN" && test -x "$L4X_BIN"
          echo "$(dirname "$COMPARATOR_BIN")" >> "$GITHUB_PATH"
          echo "COMPARATOR_LEAN4EXPORT=$L4X_BIN" >> "$GITHUB_ENV"

      # 5b. nanoda — the 2nd, non-Lean kernel.  A small Rust build (cargo is
      #     preinstalled on ubuntu-latest).  Validated locally: it ACCEPTS the
      #     bernoulli solution export with the clean axiom set and REJECTS it with
      #     an empty whitelist, so it is genuinely load-bearing.
      - name: Build nanoda (2nd kernel)
        run: |
          git clone --depth 1 https://github.com/ammkrn/nanoda_lib.git "$HOME/nanoda"
          cd "$HOME/nanoda"
          cargo build --release
          NANODA_BIN="$HOME/nanoda/target/release/nanoda_bin"
          test -x "$NANODA_BIN"
          echo "nanoda = $NANODA_BIN"
          echo "COMPARATOR_NANODA=$NANODA_BIN" >> "$GITHUB_ENV"

      # 6. Run the judge against the built bernoulli project.
      #    `lake env` supplies the project's LEAN_PATH so comparator can locate and
      #    export the Bernoulli / BernoulliChallenge modules.  With enable_nanoda in
      #    the config + COMPARATOR_NANODA set, comparator replays the solution
      #    through BOTH the Lean default kernel and nanoda.
      #    NOTE: COMPARATOR_LEAN4EXPORT / COMPARATOR_NANODA come from GITHUB_ENV.
      - name: Run Comparator (independent judge, 2 kernels)
        working-directory: telperion/examples/bernoulli/lean
        env:
          COMPARATOR_LANDRUN: /home/runner/.local/bin/landrun
        run: |
          echo "lean4export = $COMPARATOR_LEAN4EXPORT"
          echo "nanoda      = $COMPARATOR_NANODA"
          lake env comparator Bernoulli.comparator.json

  # Real-sandbox wrapper self-test (cheap; no mathlib).  Proves the bwrap-backed
  # landrun replacement runs on the runner, provides isolation, and — unlike real
  # landrun — preserves the `--` separator lean4export needs.  This is the
  # COMPARATOR_LANDRUN to use when judging UNTRUSTED third-party solutions.
  comparator-sandbox-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install bubblewrap + allow unprivileged userns
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          # ubuntu-24 AppArmor restricts unprivileged user namespaces; relax it so
          # bwrap can create the sandbox (best-effort — harmless if the knob is absent).
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
          bwrap --version
      - name: Wrapper preserves `--` and sandboxes
        run: |
          W=.github/comparator/landrun-bwrap.sh
          chmod +x "$W"
          # 1. inner `--` survives through a REAL bwrap sandbox (the landrun bug fix)
          OUT=$("$W" --best-effort --ro / -ldd --env PATH -- /bin/bash -c 'printf "%s|" "$@"' _ A -- B)
          echo "argv seen by command: $OUT"
          test "$OUT" = "A|--|B|"
          echo "OK: inner -- preserved through bwrap"
          # 2. real isolation: writing outside the allowed paths is blocked
          if "$W" --ro / --env PATH -- /bin/bash -c 'echo x > /usr/nope' 2>/dev/null; then
            echo "FAIL: wrote to read-only root"; exit 1
          fi
          echo "OK: write to ro root blocked"
          # 3. a --rw path IS writable (bind translation works)
          mkdir -p "$RUNNER_TEMP/wr"
          "$W" --ro / --rw "$RUNNER_TEMP/wr" --env PATH -- \
            /bin/bash -c "echo ok > $RUNNER_TEMP/wr/f"
          test "$(cat "$RUNNER_TEMP/wr/f")" = ok
          echo "OK: --rw path writable"
          # 4. network is unshared (no connectivity for untrusted code)
          if "$W" --ro / --env PATH -- /bin/bash -c 'exec 3<>/dev/tcp/1.1.1.1/53' 2>/dev/null; then
            echo "FAIL: network reachable inside sandbox"; exit 1
          fi
          echo "OK: network unshared"
