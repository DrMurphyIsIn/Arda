# Telperion -- the zeta_reflection island: the six proved ANDURIL node artifacts.
#
# WHAT THIS VERIFIES. The island is the home of ALL SIX proved anduril node artifacts:
#
#   node                    artifact module         theorem asserted below
#   AND_checkline_correct   CheckBand               ZetaReflection.checkLine_correct
#   AND_g2_reflected_band   ReflectedBand_t14       ReflectedBand_t14.ok, ReflectedBand_t14.pilot
#   AND_em_tail3_number     EMZetaTail              ZetaReflection.em_tail3_number
#   AND_em_zeta_strip       EMZetaComplex           ZetaReflection.em_zeta_strip
#   AND_first_zero_kernel   ForgeFirstZeroKernel    ForgeFirstZeroKernel.first_zero_kernel
#   AND_stirling_binet_k1   StirlingBinet           ZetaReflection.logDeriv_gammaR_stirling
#
# Also built and guarded here (2026-09-23):
#   AND_g2_reflected_band_kernel  ReflectedBand_t14_Kernel  ReflectedBand_t14_Kernel.pilot_kernel, .okK
#   AND_theta_branch (proposed)   RSTheta                   RSDesignTheta.gaussBranch_theta_sub_thetaMain_le
#
# The job builds these modules and their seven axiom-guard libs, then runs each guard and
# asserts (1) it elaborated, (2) no `sorryAx`, (3) every printed axiom list is a SUBSET of
# {propext, Classical.choice, Quot.sound}, (4) at least the expected number of anchors printed,
# and (5) every registry theorem above is among them.
#
# HISTORY (closure audit C2, 2026-09-22). The first version of this workflow could never pass,
# and never ran:
#   (a) it ran `lake build AxiomGuardA4 ...`, but the guards were not `lean_lib`s -> "unknown
#       target"; they are now declared in lean/lakefile.toml;
#   (b) `lake env lean` could not spawn `lean` ("could not execute external process"): the
#       island path-required the zeta_zero_localization MONOLITH lakefile (~27k lean_libs), and
#       Lake v4.32 builds LEAN_SRC_PATH from every lib without deduplication (~2.2 MB, E2BIG).
#       The island now requires the slim `zzl_core` sub-project instead (same source files,
#       16 libs), so `lake env` works and nothing here touches the monolith;
#   (c) its grep demanded the exact line [propext, Classical.choice, Quot.sound] and so rejected
#       the legitimate strict subset [propext] printed for ReflectedBand_t14.ok and
#       checkLine_sign_isSome. The check is now subset-of-the-three, on joined lines.
# `missions/coverage.py` now requires the artifact MODULE to be inside the import closure of a
# runnable step's build (not merely a `lake build` string under the island directory), and a job
# whose `lake build` names an undeclared target counts for nothing.
#
# Runs on EVERY PR, weekly, and on demand. Intended as a REQUIRED status check (job name
# `zeta-reflection-compiles`). A required check must always report, so there is no workflow-level
# `paths:` filter any more (a path-filtered workflow never starts on an unrelated PR, and the
# required check would then block that PR forever). Instead the first step diffs the PR against
# its base: if nothing the island BUILDS FROM changed, the heavy steps are skipped and the job
# passes in under a minute. "Builds from" = this island, this workflow file, the zzl_core
# sub-project and the ZeroFreeBridge package it path-requires, and the zeta_zero_localization
# source modules the island compiles (the 16 zzl_core libs + the ZZLSegment_h1000 roots in
# lean/lakefile.toml, import closure checked 2026-09-23: 42 top-level modules, no subdirectories).
# The old filter watched only the island directory, so an edit to e.g. LambdaLineReal.lean never
# re-ran this check. Keep RELEVANT below in step with lean/lakefile.toml.
# conjecture1_proved = False.
name: telperion-zeta-reflection

on:
  pull_request:   # no paths filter: see the header (required-check safety)
  workflow_dispatch:
  schedule:
    - cron: "41 4 * * 2"   # Tuesdays 04:41 UTC, off the legacy-boxes slot

concurrency:
  group: telperion-zeta-reflection-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  zeta-reflection-compiles:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      # fetch-depth 2: on a pull_request event HEAD is GitHub's test-merge commit, and depth 2
      # also fetches its parents, so HEAD^1 (the base tip it merged into) is available to diff.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # Path gate (replaces the old workflow-level `paths:` filter, see the header). run=false
      # ONLY for a pull_request whose diff against its base touches nothing in RELEVANT; every
      # other event, and any failure to compute the diff, yields run=true (fail-safe).
      - name: Relevant changes? (path gate for pull requests)
        id: changes
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          RELEVANT: '^(telperion/examples/zeta_reflection/|\.github/workflows/telperion-zeta-reflection\.yml$|telperion/examples/zero_free_bridge/lean/|telperion/examples/zeta_zero_localization/lean/zzl_core/|telperion/examples/zeta_zero_localization/lean/(LambdaLineReal|XiLineZeros|WindingCount|BoxArgPrinciple|BoxArgPrincipleZeta|RigorousWinding|BlaschkeBox|BoxLocalization|RHInBoxCore|RHInBoxAnalytic|RHInBox|RHInBoxBands|DiffractionCore|ZetaZeroConfinement|AllZerosUpToHeight|TuringBand|AllZeros_h1000|RHInBoxT_1d4000000_3999999d4000000_[0-9d]+_[0-9d]+)\.lean$)'
        run: |
          set -uo pipefail
          run=true
          if [ "$EVENT" = "pull_request" ]; then
            base=""
            if git rev-parse -q --verify 'HEAD^2^{commit}' >/dev/null; then
              base=$(git rev-parse -q --verify 'HEAD^1^{commit}' || true)
            elif [ -n "${BASE_SHA:-}" ] && git fetch -q --no-tags --depth=1 origin "$BASE_SHA"; then
              base="$BASE_SHA"
            fi
            if [ -n "$base" ] && files=$(git diff --name-only "$base" HEAD); then
              echo "PR changes $(printf '%s' "$files" | grep -c . || true) file(s) relative to $base"
              if grep -qE "$RELEVANT" <<< "$files"; then
                printf '%s\n' "$files" | grep -E "$RELEVANT" | head -20 || true
              else
                run=false
              fi
            else
              echo "::warning::could not compute the PR diff against its base; running the full job"
            fi
          fi
          echo "run=$run" | tee -a "$GITHUB_OUTPUT"

      - name: Nothing relevant changed -- skipping the island build
        if: steps.changes.outputs.run != 'true'
        run: echo "::notice::No change to the zeta_reflection island or its path dependencies; zeta-reflection-compiles passes without building."

      - name: Cache elan toolchain
        if: steps.changes.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('telperion/examples/zeta_reflection/lean/lean-toolchain') }}

      - name: Install elan
        if: steps.changes.outputs.run == 'true'
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # zeta_reflection is the root workspace: its path deps (zzl_core, ZeroFreeBridge) resolve
      # their Mathlib through THIS package's .lake/packages, so one cache fetch serves all three.
      - name: Fetch Mathlib olean cache
        if: steps.changes.outputs.run == 'true'
        working-directory: telperion/examples/zeta_reflection/lean
        run: lake exe cache get

      - name: Build the anduril artifacts and their axiom guards
        if: steps.changes.outputs.run == 'true'
        working-directory: telperion/examples/zeta_reflection/lean
        run: |
          lake build CheckBand ReflectedBand_t14 EMZetaTail EMZetaComplex ForgeFirstZeroKernel StirlingBinet ReflectedBand_t14_Kernel RSTheta HeightFloor EdgeClearGlue BandGlue \
                     AxiomGuardA4 AxiomGuardEMTail AxiomGuardEMZetaComplex AxiomGuardFirstZeroKernel AxiomGuardStirling AxiomGuardArbKernel AxiomGuardRSTheta AxiomGuardHeightFloor AxiomGuardBandGlue

      - name: "Axiom guard (anduril artifacts): axioms within the standard three, no sorryAx, every registry theorem printed"
        if: steps.changes.outputs.run == 'true'
        working-directory: telperion/examples/zeta_reflection/lean
        shell: bash
        run: |
          set -euo pipefail
          # (plain functions, not `declare -A`, so the step also runs under bash 3.2 locally)
          # Anchor floor = the number of `#print axioms` lines in each guard file today.
          floor() { case "$1" in
            AxiomGuardA4) echo 8 ;; AxiomGuardEMTail) echo 23 ;; AxiomGuardEMZetaComplex) echo 23 ;;
            AxiomGuardFirstZeroKernel) echo 1 ;; AxiomGuardStirling) echo 12 ;; AxiomGuardArbKernel) echo 16 ;;
            AxiomGuardRSTheta) echo 24 ;; AxiomGuardHeightFloor) echo 98 ;; AxiomGuardBandGlue) echo 39 ;; *) echo 999 ;; esac; }
          # The registry theorems (one per proved node; two for AND_g2_reflected_band).
          registry() { case "$1" in
            AxiomGuardA4) echo "ZetaReflection.checkLine_correct ReflectedBand_t14.ok ReflectedBand_t14.pilot" ;;
            AxiomGuardEMTail) echo "ZetaReflection.em_tail3_number" ;;
            AxiomGuardEMZetaComplex) echo "ZetaReflection.em_zeta_strip" ;;
            AxiomGuardFirstZeroKernel) echo "ForgeFirstZeroKernel.first_zero_kernel" ;;
            AxiomGuardStirling) echo "ZetaReflection.logDeriv_gammaR_stirling" ;;
            AxiomGuardArbKernel) echo "ReflectedBand_t14_Kernel.pilot_kernel ReflectedBand_t14_Kernel.okK" ;;
            AxiomGuardRSTheta) echo "RSDesignTheta.gaussBranch_theta_sub_thetaMain_le" ;;
            AxiomGuardHeightFloor) echo "HeightFloor.height_floor HeightFloor.height_floor_280000" ;;
            AxiomGuardBandGlue) echo "EdgeClearGlue.hnzl_discharged BandGlue.segBandHyp_of_certs" ;; esac; }
          total=0
          for g in AxiomGuardA4 AxiomGuardEMTail AxiomGuardEMZetaComplex AxiomGuardFirstZeroKernel AxiomGuardStirling AxiomGuardArbKernel AxiomGuardRSTheta AxiomGuardHeightFloor AxiomGuardBandGlue; do
            [ -f "$g.lean" ] || { echo "::error::$g.lean is missing"; exit 1; }
            echo "== $g"
            rc=0; lake env lean "$g.lean" > "$g.out" 2>&1 || rc=$?
            cat "$g.out"
            if [ "$rc" -ne 0 ]; then echo "::error::$g: lean exited $rc"; exit 1; fi
            if grep -qE '(^|[^A-Za-z])error:' "$g.out"; then echo "::error::$g did not elaborate cleanly"; exit 1; fi
            if grep -q 'sorryAx' "$g.out"; then echo "::error::$g: a guarded theorem depends on sorry"; exit 1; fi
            # Join wrapped lines first: Lean wraps a long axiom list over several lines.
            joined="$(tr '\n' ' ' < "$g.out" | tr -s ' ')"
            n=$(grep -oE "depends on axioms: \[[^]]*\]|does not depend on any axioms" <<< "$joined" | wc -l)
            if [ "$n" -lt "$(floor "$g")" ]; then
              echo "::error::$g printed $n axiom lines, expected at least $(floor "$g") -- the guard did not run or was truncated"; exit 1; fi
            total=$((total + n))
            # Every axiom in every list must be one of the standard three (any subset is fine,
            # e.g. [propext] for a decide-only theorem).
            bad="$(grep -oE "depends on axioms: \[[^]]*\]" <<< "$joined" \
                    | sed -E 's/^depends on axioms: \[//; s/\]$//' | tr ',' '\n' | tr -d ' ' \
                    | grep -vxE 'propext|Classical\.choice|Quot\.sound' || true)"
            if [ -n "$bad" ]; then
              echo "::error::$g: axiom(s) outside {propext, Classical.choice, Quot.sound}: $(echo $bad)"; exit 1; fi
            for thm in $(registry "$g"); do
              grep -qE "'${thm//./\\.}' (depends on axioms: \[[^]]*\]|does not depend on any axioms)" <<< "$joined" \
                || { echo "::error::$g: registry theorem $thm was not printed"; exit 1; }
            done
          done
          echo "OK: $total guarded anchors across 9 guards; every axiom list within the standard three; all 14 registry theorems present."
